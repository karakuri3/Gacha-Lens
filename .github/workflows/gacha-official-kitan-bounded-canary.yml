name: Gacha Official Kitan Bounded Canary

on:
  workflow_dispatch:
    inputs:
      audit_run_id:
        description: Exact approved Kitan readiness audit run ID
        required: true
        type: string
      audit_digest:
        description: Exact approved Kitan audit canonical digest
        required: true
        type: string
      approval:
        description: APPROVE_OFFICIAL_KITAN_CANARY:<MAIN_SHA>:<AUDIT_DIGEST>
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  kitan-bounded-canary:
    concurrency:
      group: gacha-official-kitan-manual-canary
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify exact main revision
        id: main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin main --depth=1
          origin_main_sha="$(git rev-parse origin/main)"
          test "$origin_main_sha" = "$GITHUB_SHA"
          echo "origin_main_sha=$origin_main_sha" >> "$GITHUB_OUTPUT"
      - name: Download exact Kitan readiness artifact
        uses: actions/download-artifact@v4
        with:
          name: official-kitan-readiness-audit-${{ inputs.audit_run_id }}
          path: ${{ runner.temp }}/gacha-official-kitan-bounded-canary/audit
          repository: ${{ github.repository }}
          run-id: ${{ inputs.audit_run_id }}
          github-token: ${{ github.token }}
      - name: Authorize Kitan bounded canary
        id: authorize
        env:
          KITAN_CANARY_AUDIT_DIGEST: ${{ inputs.audit_digest }}
          KITAN_CANARY_APPROVAL: ${{ inputs.approval }}
        run: >-
          npm run official:kitan-bounded-canary -- authorize
          --output-dir=${{ runner.temp }}/gacha-official-kitan-bounded-canary/result
          --audit-dir=${{ runner.temp }}/gacha-official-kitan-bounded-canary/audit
          --audit-run-id=${{ inputs.audit_run_id }}
          --origin-main-sha=${{ steps.main.outputs.origin_main_sha }}
      - name: Execute transactional Kitan bounded canary
        id: execute
        continue-on-error: true
        env:
          KITAN_CANARY_AUDIT_DIGEST: ${{ inputs.audit_digest }}
          KITAN_CANARY_APPROVAL: ${{ inputs.approval }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main --depth=1
          final_origin_main_sha="$(git rev-parse origin/main)"
          test "$final_origin_main_sha" = "$GITHUB_SHA"
          npm run official:kitan-bounded-canary -- execute \
            --output-dir="${{ runner.temp }}/gacha-official-kitan-bounded-canary/result" \
            --audit-dir="${{ runner.temp }}/gacha-official-kitan-bounded-canary/audit" \
            --audit-run-id="${{ inputs.audit_run_id }}" \
            --origin-main-sha="$final_origin_main_sha"
      - name: Scan sanitized Kitan canary result
        id: scan
        if: ${{ always() }}
        run: >-
          npm run official:kitan-bounded-canary -- scan
          --output-dir=${{ runner.temp }}/gacha-official-kitan-bounded-canary/result
      - name: Upload sanitized Kitan canary result
        if: ${{ always() && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: official-kitan-bounded-canary-result-${{ github.run_id }}
          path: ${{ runner.temp }}/gacha-official-kitan-bounded-canary/result
          if-no-files-found: error
          retention-days: 30
      - name: Enforce Kitan canary result
        if: ${{ always() && steps.scan.outcome == 'success' }}
        run: >-
          npm run official:kitan-bounded-canary -- verify
          --output-dir=${{ runner.temp }}/gacha-official-kitan-bounded-canary/result
