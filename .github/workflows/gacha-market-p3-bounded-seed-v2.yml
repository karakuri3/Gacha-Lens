name: Gacha Market P3 Bounded Seed V2

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact approved main SHA
        required: true
        type: string
      limit:
        description: Maximum Priority 3 variants to persist (10 or 25)
        required: true
        default: "10"
        type: choice
        options:
          - "10"
          - "25"
      confirmation:
        description: Type APPROVE_P3_BOUNDED_SEED_V2
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  p3-bounded-seed-v2:
    concurrency:
      group: gacha-market-bounded-v2
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GACHA_DATA_SOURCE: supabase
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
      YAHOO_SHOPPING_APP_ID: ${{ secrets.YAHOO_SHOPPING_APP_ID }}
      YAHOO_SHOPPING_FETCH_ENABLED: ${{ secrets.YAHOO_SHOPPING_FETCH_ENABLED }}
      P3_BOUNDED_SEED_V2_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify exact approved main and fixed P3 v2 contract
        id: main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "${{ inputs.expected_main_sha }}"
          case "${{ inputs.limit }}" in 10|25) ;; *) exit 1 ;; esac
          git fetch --no-tags origin main --depth=1
          origin_main_sha="$(git rev-parse origin/main)"
          test "$GITHUB_SHA" = "$origin_main_sha"
          echo "origin_main_sha=$origin_main_sha" >> "$GITHUB_OUTPUT"
      - name: Retrieve and persist bounded Priority 3 seed v2 batch
        run: >-
          node scripts/market-p3-bounded-seed-v2.mjs
          --expected-main-sha=${{ inputs.expected_main_sha }}
          --origin-main-sha=${{ steps.main.outputs.origin_main_sha }}
          --limit=${{ inputs.limit }}
          --output-dir=${{ runner.temp }}/gacha-market-p3-bounded-seed-v2
      - name: Scan sanitized P3 bounded seed v2 artifact
        id: scan
        if: ${{ always() }}
        run: node scripts/manual-market-audit-guard.mjs scan --directory=${{ runner.temp }}/gacha-market-p3-bounded-seed-v2
      - name: Upload sanitized P3 bounded seed v2 artifact
        if: ${{ always() && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: market-p3-bounded-seed-v2-result-${{ github.run_id }}
          path: ${{ runner.temp }}/gacha-market-p3-bounded-seed-v2
          if-no-files-found: error
          retention-days: 14
