name: Cloudflare cache proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/cloudflare-cache-proof.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-cache-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-cache-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOYED_SHA: d6a19ce64777ead04ab3613f4b7e3ff070b4e387
      PREVIEW_URL: https://32d3e79e-gacha-lens.senpingxingzuo.workers.dev
    steps:
      - name: Checkout current pull-request head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prove runtime sources match isolated preview
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${DEPLOYED_SHA}^{commit}"
          changed="$(git diff --name-only "$DEPLOYED_SHA" HEAD -- app components lib next.config.mjs package.json package-lock.json)"
          if [[ -n "$changed" ]]; then
            echo 'Runtime source drift exists after the pinned cache-proof preview:' >&2
            echo "$changed" >&2
            exit 1
          fi
          echo "Runtime source tree is byte-equivalent to cache-proof preview commit ${DEPLOYED_SHA}." >> "$GITHUB_STEP_SUMMARY"
          echo "Preview URL: ${PREVIEW_URL}" >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnose cold and warm cache headers
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          product_path='/series/tarts-y901096-%E3%83%87%E3%82%A3%E3%82%BA%E3%83%8B%E3%83%BC-%E3%83%9E%E3%83%AA%E3%83%BC'
          start="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Proof window start: ${start}" | tee -a "$GITHUB_STEP_SUMMARY"

          for n in 1 2 3; do
            body="$tmp/body-${n}"
            headers="$tmp/headers-${n}"
            metrics="$(curl --silent --show-error --max-time 90 --dump-header "$headers" --output "$body" --write-out '%{http_code} %{time_total} %{size_download}' "${PREVIEW_URL}${product_path}")"
            code="${metrics%% *}"
            [[ "$code" == "200" ]] || { echo "request ${n} returned ${code}" >&2; exit 1; }
            grep -Fq 'ディズニー マリー' "$body" || { echo "request ${n} missing Japanese product marker" >&2; exit 1; }

            hash="$(sha256sum "$body" | awk '{print $1}')"
            cf_status="$(awk 'BEGIN{IGNORECASE=1} /^cf-cache-status:/ {gsub("\r", ""); print $2; exit}' "$headers")"
            cache_status="$(awk 'BEGIN{IGNORECASE=1} /^cache-status:/ {sub(/^[^:]*:[[:space:]]*/, ""); gsub("\r", ""); print; exit}' "$headers")"
            cdn_cache_control="$(awk 'BEGIN{IGNORECASE=1} /^cdn-cache-control:/ {sub(/^[^:]*:[[:space:]]*/, ""); gsub("\r", ""); print; exit}' "$headers")"
            cache_control="$(awk 'BEGIN{IGNORECASE=1} /^cache-control:/ {sub(/^[^:]*:[[:space:]]*/, ""); gsub("\r", ""); print; exit}' "$headers")"
            cache_tag="$(awk 'BEGIN{IGNORECASE=1} /^cache-tag:/ {sub(/^[^:]*:[[:space:]]*/, ""); gsub("\r", ""); print; exit}' "$headers")"
            age="$(awk 'BEGIN{IGNORECASE=1} /^age:/ {gsub("\r", ""); print $2; exit}' "$headers")"
            vary="$(awk 'BEGIN{IGNORECASE=1} /^vary:/ {sub(/^[^:]*:[[:space:]]*/, ""); gsub("\r", ""); print; exit}' "$headers")"
            set_cookie_presence="none"
            if grep -qi '^set-cookie:' "$headers"; then set_cookie_presence='present'; fi

            line="Request ${n}: ${metrics} | sha256=${hash} | cf-cache-status=${cf_status:-none} | cache-status=${cache_status:-none} | cdn-cache-control=${cdn_cache_control:-none} | cache-control=${cache_control:-none} | cache-tag=${cache_tag:-none} | age=${age:-none} | vary=${vary:-none} | set-cookie=${set_cookie_presence}"
            echo "$line" | tee -a "$GITHUB_STEP_SUMMARY"
            sleep 2
          done

          end="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Proof window end: ${end}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo 'All three identical Japanese-slug requests were HTTP 200 with the required semantic marker. Body hashes are diagnostic only because server-render serialization may vary.' | tee -a "$GITHUB_STEP_SUMMARY"
