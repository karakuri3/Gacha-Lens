name: Cloudflare cache proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/cloudflare-cache-proof.yml"
      - ".github/workflows/cloudflare-runtime-smoke.yml"
      - ".github/workflows/cloudflare-production-release-proof.yml"
      - "scripts/cloudflare-release-integrity.mjs"
      - "tests/cloudflare-release-integrity.test.mjs"
      - "jsconfig.json"
      - "worker/**"

permissions:
  contents: read
  checks: read

# Both live-preview workflows hit the same exact-head Worker/Supabase runtime.
# Serialize them so CI does not manufacture origin pressure that normal smoke
# traffic is not intended to test.
concurrency:
  group: cloudflare-cache-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-cache-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Resolve exact-head Cloudflare Preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$TARGET_SHA" ]] || {
            echo "Checkout SHA ${actual_sha} does not match target ${TARGET_SHA}." >&2
            exit 1
          }

          found='false'
          status=''
          conclusion=''
          check_id=''
          preview_url=''

          for attempt in $(seq 1 40); do
            payload="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100")"

            inspection="$(node scripts/cloudflare-release-integrity.mjs inspect-check "$TARGET_SHA" --require-preview <<<"$payload")"
            found="$(jq -r '.found' <<<"$inspection")"
            if [[ "$found" == 'true' ]]; then
              status="$(jq -r '.status // ""' <<<"$inspection")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$inspection")"
              check_id="$(jq -r '.check_id // ""' <<<"$inspection")"
              preview_url="$(jq -r '.preview_url // ""' <<<"$inspection")"
              if [[ "$status" == 'completed' ]]; then
                break
              fi
            fi

            echo "Cloudflare exact-head build not complete yet (attempt ${attempt}/40)." >> "$GITHUB_STEP_SUMMARY"
            sleep 15
          done

          [[ "$found" == 'true' ]] || {
            echo "No Cloudflare Workers check run found for exact head ${TARGET_SHA}." >&2
            exit 1
          }
          [[ "$status" == 'completed' ]] || {
            echo 'Cloudflare Workers check did not complete within the bounded wait.' >&2
            exit 1
          }
          [[ "$conclusion" == 'success' ]] || {
            echo "Cloudflare Workers exact-head build concluded ${conclusion:-unknown}." >&2
            exit 1
          }
          [[ -n "$preview_url" ]] || {
            echo 'Cloudflare check succeeded but did not expose one approved immutable exact-head deployment URL.' >&2
            exit 1
          }

          echo "PREVIEW_URL=${preview_url}" >> "$GITHUB_ENV"
          echo "Cloudflare check run: ${check_id}" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact source SHA: ${TARGET_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Immutable exact-head Preview URL: ${preview_url}" >> "$GITHUB_STEP_SUMMARY"

      - name: Prove Preview runtime source identity
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          headers="$(mktemp)"
          trap 'rm -f "$body" "$headers"' EXIT
          rc=0
          code="$(curl --silent --show-error --max-time 60 \
            -H 'Accept: application/json' \
            -H 'Cache-Control: no-cache' \
            --dump-header "$headers" \
            --output "$body" \
            --write-out '%{http_code}' \
            "${PREVIEW_URL}/api/runtime-diagnostics/release-source")" || rc=$?
          code="${code:-000}"
          [[ "$rc" == '0' && "$code" == '200' ]] || {
            echo "Preview source identity failed rc=${rc} HTTP ${code}." >&2
            cat "$body" >&2 || true
            exit 1
          }
          deployed_sha="$(node scripts/cloudflare-release-integrity.mjs read-source-sha < "$body")"
          [[ "$deployed_sha" == "$TARGET_SHA" ]] || {
            echo "Preview runtime SHA ${deployed_sha} does not match target ${TARGET_SHA}." >&2
            exit 1
          }
          cache_control="$(awk 'BEGIN{IGNORECASE=1} /^cache-control:/ {sub(/^[^:]*:[[:space:]]*/, ""); gsub("\r", ""); print; exit}' "$headers")"
          [[ "$cache_control" == *'no-store'* ]] || {
            echo "Preview release identity endpoint is missing no-store: ${cache_control:-none}." >&2
            exit 1
          }
          echo "Preview runtime source identity: ${deployed_sha}" >> "$GITHUB_STEP_SUMMARY"

      - name: Prove cold-to-warm edge cache
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          product_path="/series/tarts-y901096-%E3%83%87%E3%82%A3%E3%82%BA%E3%83%8B%E3%83%BC-%E3%83%9E%E3%83%AA%E3%83%BC?cacheproof=stage4-worker-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          start="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Proof window start: ${start}" | tee -a "$GITHUB_STEP_SUMMARY"
          declare -a statuses
          first_hash=""

          for n in 1 2 3 4 5; do
            body="$tmp/body-${n}"
            headers="$tmp/headers-${n}"
            metrics="$(curl --silent --show-error --max-time 90 -H 'Accept: text/html' --dump-header "$headers" --output "$body" --write-out '%{http_code} %{time_total} %{size_download}' "${PREVIEW_URL}${product_path}")"
            code="${metrics%% *}"
            [[ "$code" == "200" ]] || { echo "request ${n} returned ${code}" >&2; exit 1; }
            grep -Fq 'ディズニー マリー' "$body" || { echo "request ${n} missing Japanese product marker" >&2; exit 1; }

            hash="$(sha256sum "$body" | awk '{print $1}')"
            if [[ -z "$first_hash" ]]; then
              first_hash="$hash"
            else
              [[ "$hash" == "$first_hash" ]] || { echo "cached response body drift on request ${n}" >&2; exit 1; }
            fi

            cf_status="$(awk 'BEGIN{IGNORECASE=1} /^cf-cache-status:/ {gsub("\r", ""); print $2; exit}' "$headers")"
            worker_cache="$(awk 'BEGIN{IGNORECASE=1} /^x-gacha-worker-cache:/ {gsub("\r", ""); print $2; exit}' "$headers")"
            cache_control="$(awk 'BEGIN{IGNORECASE=1} /^cache-control:/ {sub(/^[^:]*:[[:space:]]*/, ""); gsub("\r", ""); print; exit}' "$headers")"
            age="$(awk 'BEGIN{IGNORECASE=1} /^age:/ {gsub("\r", ""); print $2; exit}' "$headers")"
            policy="$(awk 'BEGIN{IGNORECASE=1} /^x-gacha-edge-cache-policy:/ {gsub("\r", ""); print $2; exit}' "$headers")"
            set_cookie_presence="none"
            if grep -qi '^set-cookie:' "$headers"; then set_cookie_presence='present'; fi

            statuses[$n]="${worker_cache:-none}"
            line="Request ${n}: ${metrics} | sha256=${hash} | worker-cache=${worker_cache:-none} | cf-cache-status=${cf_status:-none} | cache-control=${cache_control:-none} | age=${age:-none} | edge-policy=${policy:-none} | set-cookie=${set_cookie_presence}"
            echo "$line" | tee -a "$GITHUB_STEP_SUMMARY"

            [[ "$policy" == 'series-detail-300-v2' ]] || { echo "request ${n} missing edge-cache policy marker" >&2; exit 1; }
            [[ "$set_cookie_presence" == 'none' ]] || { echo "request ${n} unexpectedly set a cookie" >&2; exit 1; }
            sleep 2
          done

          [[ "${statuses[1]}" == 'MISS' ]] || { echo "cold request Worker cache was ${statuses[1]}, expected MISS" >&2; exit 1; }
          [[ "${statuses[4]}" == 'HIT' ]] || { echo "warm request 4 Worker cache was ${statuses[4]}, expected HIT after bounded convergence" >&2; exit 1; }
          [[ "${statuses[5]}" == 'HIT' ]] || { echo "warm request 5 Worker cache was ${statuses[5]}, expected HIT after bounded convergence" >&2; exit 1; }

          end="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Proof window end: ${end}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo 'Cold Worker-cache MISS converged to two final byte-identical Worker-cache HITs within five bounded requests: warm identical HTML requests bypass vinext/Supabase rendering.' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Diagnose cache-proof failure
        if: ${{ failure() }}
        continue-on-error: true
        shell: bash
        run: |
          set -u
          if [[ -z "${PREVIEW_URL:-}" ]]; then
            echo 'Exact-head Preview URL was unavailable; skipping variant-detail diagnostic.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          rc=0
          code="$(curl --silent --show-error --max-time 30 --output "$body" --write-out '%{http_code}' "${PREVIEW_URL}/api/runtime-diagnostics/variant-detail")" || rc=$?
          code="${code:-000}"
          echo "Failure diagnostic: rc=${rc} HTTP ${code}" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$rc" == "0" && "$code" == "200" ]]; then
            compact="$(tr -d '\n\r' < "$body")"
            echo "Failure diagnostic payload: ${compact}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Variant-detail diagnostic was unavailable during failure analysis.' >> "$GITHUB_STEP_SUMMARY"
          fi
