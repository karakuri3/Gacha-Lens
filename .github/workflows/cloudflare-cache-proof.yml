name: Cloudflare cache proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/cloudflare-cache-proof.yml"
      - ".github/workflows/cloudflare-runtime-smoke.yml"
      - "jsconfig.json"
      - "worker/**"

permissions:
  contents: read
  checks: read

# Both live-preview workflows hit the same exact-head Worker/Supabase runtime.
# Serialize them so CI does not manufacture origin pressure that normal smoke
# traffic is not intended to test.
concurrency:
  group: cloudflare-live-preview-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  isolated-cache-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Resolve exact-head Cloudflare Preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$TARGET_SHA" ]] || {
            echo "Checkout SHA ${actual_sha} does not match target ${TARGET_SHA}." >&2
            exit 1
          }

          candidate=''
          status=''
          conclusion=''

          for attempt in $(seq 1 40); do
            payload="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100")"

            candidate="$(jq -c --arg sha "$TARGET_SHA" '
              [.check_runs[]
                | select(.name == "Workers Builds: gacha-lens" and .head_sha == $sha)]
              | sort_by(.id)
              | last // empty
            ' <<<"$payload")"

            if [[ -n "$candidate" ]]; then
              status="$(jq -r '.status // ""' <<<"$candidate")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$candidate")"
              if [[ "$status" == 'completed' ]]; then
                break
              fi
            fi

            echo "Cloudflare exact-head build not complete yet (attempt ${attempt}/40)." >> "$GITHUB_STEP_SUMMARY"
            sleep 15
          done

          [[ -n "$candidate" ]] || {
            echo "No Cloudflare Workers check run found for exact head ${TARGET_SHA}." >&2
            exit 1
          }
          [[ "$status" == 'completed' ]] || {
            echo "Cloudflare Workers check did not complete within the bounded wait." >&2
            exit 1
          }
          [[ "$conclusion" == 'success' ]] || {
            echo "Cloudflare Workers exact-head build concluded ${conclusion:-unknown}." >&2
            exit 1
          }

          summary="$(jq -r '.output.summary // ""' <<<"$candidate" | tr -d '\r')"
          preview_url="$(printf '%s\n' "$summary" | grep -Eo 'https://[A-Za-z0-9-]+-gacha-lens\.senpingxingzuo\.workers\.dev' | head -1 || true)"
          check_id="$(jq -r '.id' <<<"$candidate")"

          case "$preview_url" in
            https://*-gacha-lens.senpingxingzuo.workers.dev) ;;
            *)
              echo 'Cloudflare check succeeded but did not expose an approved exact-head Preview URL.' >&2
              printf '%s\n' "$summary" >&2
              exit 1
              ;;
          esac

          echo "PREVIEW_URL=${preview_url}" >> "$GITHUB_ENV"
          echo "Cloudflare check run: ${check_id}" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact source SHA: ${TARGET_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact-head Preview URL: ${preview_url}" >> "$GITHUB_STEP_SUMMARY"

      - name: Probe bounded variant-detail diagnostic
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          code="$(curl --silent --show-error --max-time 90 --output "$body" --write-out '%{http_code}' "${PREVIEW_URL}/api/runtime-diagnostics/variant-detail")"
          echo "Diagnostic HTTP ${code}" >> "$GITHUB_STEP_SUMMARY"
          [[ "$code" == "200" ]] || { echo "diagnostic returned HTTP ${code}" >&2; cat "$body" >&2; exit 1; }
          compact="$(tr -d '\n\r' < "$body")"
          echo "Diagnostic payload: ${compact}" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -Fq '"status":"ok"' "$body" || { echo 'variant-detail diagnostic isolated a failing stage' >&2; exit 1; }

      - name: Prove cold-to-warm edge cache
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          product_path="/series/tarts-y901096-%E3%83%87%E3%82%A3%E3%82%BA%E3%83%8B%E3%83%BC-%E3%83%9E%E3%83%AA%E3%83%BC?cacheproof=stage4-worker-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          start="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Proof window start: ${start}" | tee -a "$GITHUB_STEP_SUMMARY"
          declare -a statuses
          first_hash=""

          for n in 1 2 3; do
            body="$tmp/body-${n}"
            headers="$tmp/headers-${n}"
            metrics="$(curl --silent --show-error --max-time 90 -H 'Accept: text/html' --dump-header "$headers" --output "$body" --write-out '%{http_code} %{time_total} %{size_download}' "${PREVIEW_URL}${product_path}")"
            code="${metrics%% *}"
            [[ "$code" == "200" ]] || { echo "request ${n} returned ${code}" >&2; exit 1; }
            grep -Fq 'ディズニー マリー' "$body" || { echo "request ${n} missing Japanese product marker" >&2; exit 1; }

            hash="$(sha256sum "$body" | awk '{print $1}')"
            if [[ -z "$first_hash" ]]; then
              first_hash="$hash"
            else
              [[ "$hash" == "$first_hash" ]] || { echo "cached response body drift on request ${n}" >&2; exit 1; }
            fi

            cf_status="$(awk 'BEGIN{IGNORECASE=1} /^cf-cache-status:/ {gsub("\r", ""); print $2; exit}' "$headers")"
            cache_control="$(awk 'BEGIN{IGNORECASE=1} /^cache-control:/ {sub(/^[^:]*:[[:space:]]*/, ""); gsub("\r", ""); print; exit}' "$headers")"
            age="$(awk 'BEGIN{IGNORECASE=1} /^age:/ {gsub("\r", ""); print $2; exit}' "$headers")"
            policy="$(awk 'BEGIN{IGNORECASE=1} /^x-gacha-edge-cache-policy:/ {gsub("\r", ""); print $2; exit}' "$headers")"
            set_cookie_presence="none"
            if grep -qi '^set-cookie:' "$headers"; then set_cookie_presence='present'; fi

            statuses[$n]="${cf_status:-none}"
            line="Request ${n}: ${metrics} | sha256=${hash} | cf-cache-status=${cf_status:-none} | cache-control=${cache_control:-none} | age=${age:-none} | edge-policy=${policy:-none} | set-cookie=${set_cookie_presence}"
            echo "$line" | tee -a "$GITHUB_STEP_SUMMARY"

            [[ "$policy" == 'series-detail-1800-v1' ]] || { echo "request ${n} missing edge-cache policy marker" >&2; exit 1; }
            [[ "$set_cookie_presence" == 'none' ]] || { echo "request ${n} unexpectedly set a cookie" >&2; exit 1; }
            sleep 2
          done

          [[ "${statuses[1]}" == 'MISS' ]] || { echo "cold request was ${statuses[1]}, expected MISS" >&2; exit 1; }
          [[ "${statuses[2]}" == 'HIT' ]] || { echo "warm request 2 was ${statuses[2]}, expected HIT" >&2; exit 1; }
          [[ "${statuses[3]}" == 'HIT' ]] || { echo "warm request 3 was ${statuses[3]}, expected HIT" >&2; exit 1; }

          end="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Proof window end: ${end}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo 'Cold MISS followed by two byte-identical HITs: warm identical HTML requests are served by Workers Cache before the Worker/Supabase render path.' | tee -a "$GITHUB_STEP_SUMMARY"
