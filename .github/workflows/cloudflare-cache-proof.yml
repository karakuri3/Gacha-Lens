name: Cloudflare cache proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/cloudflare-cache-proof.yml"

permissions:
  contents: read
  checks: read

concurrency:
  group: cloudflare-cache-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-cache-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Resolve fresh exact-head Cloudflare preview
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          preview=""
          version=""
          for attempt in $(seq 1 90); do
            checks="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100")"
            failed="$(jq -r --arg sha "$TARGET_SHA" '.check_runs[] | select(.name == "Workers Builds: gacha-lens" and .head_sha == $sha and .status == "completed" and .conclusion != "success") | .conclusion' <<<"$checks" | head -n 1)"
            if [[ -n "$failed" ]]; then
              echo "Cloudflare exact-head build completed with: $failed" >&2
              exit 1
            fi
            summary="$(jq -r --arg sha "$TARGET_SHA" '.check_runs[] | select(.name == "Workers Builds: gacha-lens" and .head_sha == $sha and .conclusion == "success") | .output.summary // empty' <<<"$checks" | head -n 1)"
            preview="$(awk '/^Preview URL:/ {print $3; exit}' <<<"$summary")"
            version="$(awk '/^Version ID:/ {print $3; exit}' <<<"$summary")"
            if [[ "$preview" == https://*.workers.dev && -n "$version" ]]; then
              break
            fi
            sleep 10
          done
          if [[ "$preview" != https://*.workers.dev ]]; then
            echo "Fresh exact-head Cloudflare preview URL was not available in time." >&2
            exit 1
          fi
          echo "url=$preview" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Preview version: ${version}" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview URL: ${preview}" >> "$GITHUB_STEP_SUMMARY"

      - name: Prove identical warm requests
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          product_path='/series/tarts-y901096-%E3%83%87%E3%82%A3%E3%82%BA%E3%83%8B%E3%83%BC-%E3%83%9E%E3%83%AA%E3%83%BC'
          start="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Proof window start: ${start}" >> "$GITHUB_STEP_SUMMARY"
          first_hash=""
          for n in 1 2 3 4; do
            body="$tmp/body-${n}"
            headers="$tmp/headers-${n}"
            metrics="$(curl --silent --show-error --max-time 90 --dump-header "$headers" --output "$body" --write-out '%{http_code} %{time_total} %{size_download}' "${PREVIEW_URL}${product_path}")"
            code="${metrics%% *}"
            [[ "$code" == "200" ]] || { echo "request ${n} returned ${code}" >&2; exit 1; }
            grep -Fq 'ディズニー マリー' "$body" || { echo "request ${n} missing Japanese product marker" >&2; exit 1; }
            hash="$(sha256sum "$body" | awk '{print $1}')"
            if [[ -z "$first_hash" ]]; then
              first_hash="$hash"
            else
              [[ "$hash" == "$first_hash" ]] || { echo "response body drift on request ${n}" >&2; exit 1; }
            fi
            cf_status="$(awk 'BEGIN{IGNORECASE=1} /^cf-cache-status:/ {gsub("\r", ""); print $2; exit}' "$headers")"
            cache_status="$(awk 'BEGIN{IGNORECASE=1} /^cache-status:/ {sub(/^[^:]*:[[:space:]]*/, ""); gsub("\r", ""); print; exit}' "$headers")"
            cache_control="$(awk 'BEGIN{IGNORECASE=1} /^cache-control:/ {sub(/^[^:]*:[[:space:]]*/, ""); gsub("\r", ""); print; exit}' "$headers")"
            age="$(awk 'BEGIN{IGNORECASE=1} /^age:/ {gsub("\r", ""); print $2; exit}' "$headers")"
            printf 'Request %d: %s | sha256=%s | cf-cache-status=%s | cache-status=%s | cache-control=%s | age=%s\n' "$n" "$metrics" "$hash" "${cf_status:-none}" "${cache_status:-none}" "${cache_control:-none}" "${age:-none}" >> "$GITHUB_STEP_SUMMARY"
            sleep 2
          done
          end="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Proof window end: ${end}" >> "$GITHUB_STEP_SUMMARY"
          echo "All four identical Japanese-slug responses were HTTP 200 and byte-identical." >> "$GITHUB_STEP_SUMMARY"
