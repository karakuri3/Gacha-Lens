name: Bounded Re-observation One-shot #211

on:
  push:
    branches:
      - ops/bounded-reobs-one-shot-211-20260903

permissions:
  contents: read

jobs:
  bounded-reobservation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APPROVED_MAIN_SHA: d7955b285fccd93b327ffb8d80594d400660c68c
      REOBS_BOUNDED_EXPECTED_MAIN_SHA: d7955b285fccd93b327ffb8d80594d400660c68c
      REOBS_BOUNDED_OBSERVATION_KEY: reobs-v1:bounded-20260903-02
      REOBS_BOUNDED_LISTING_IDS: yahoo-lead-netstore-qq022607s248osk2,yahoo-lead-netstore-qq082607s186cuk2,yahoo-lead-netstore-qq102603s262zpm4,yahoo-lead-netstore-qq132602s196cpm5,yahoo-lead-netstore-qq152607s248pdk4,yahoo-lead-netstore-qq152607s248tmt2,yahoo-lead-netstore-qq222607s309oem5,yahoo-suruga-ya-601192353001,yahoo-toysanta-g-5l640018ty-003-58102,yahoo-toysanta-g-5l8r0018wu-004-58206
      REOBS_BOUNDED_APPROVAL: APPROVE_MARKET_REOBSERVATION_BOUNDED_V1:d7955b285fccd93b327ffb8d80594d400660c68c:7435ea9e78f1ebf5b27667bd0c252d48fbc6ef952ceb35d34c850c61ba7e68e3
      MARKET_API_MAX_ATTEMPTS: "3"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      YAHOO_SHOPPING_APP_ID: ${{ secrets.YAHOO_SHOPPING_APP_ID }}

    steps:
      - name: Checkout disposable branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact approved main and one-file branch diff
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/ops/bounded-reobs-one-shot-211-20260903"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main --no-tags --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$APPROVED_MAIN_SHA"
          git cat-file -e "$APPROVED_MAIN_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$APPROVED_MAIN_SHA" "$GITHUB_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/bounded-reobs-one-shot-211.yml"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Execute approved bounded re-observation exactly once
        shell: bash
        run: |
          set -euo pipefail
          node scripts/market-reobservation-bounded-canary.mjs \
            --mode canary-write \
            --approval "$REOBS_BOUNDED_APPROVAL" \
            --head-sha "$APPROVED_MAIN_SHA" \
            --expected-main-sha "$APPROVED_MAIN_SHA" \
            --observation-key "$REOBS_BOUNDED_OBSERVATION_KEY" \
            --listing-ids "$REOBS_BOUNDED_LISTING_IDS" \
            --resolution-manifest-out "$RUNNER_TEMP/reobs-bounded-resolution-manifest.json" \
            | tee "$RUNNER_TEMP/reobs-bounded-result.json"

      - name: Upload sanitized execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-reobs-211-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/reobs-bounded-result.json
            ${{ runner.temp }}/reobs-bounded-resolution-manifest.json
