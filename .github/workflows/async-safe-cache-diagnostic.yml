name: Async safe cache diagnostic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/async-safe-cache-diagnostic.yml"

permissions:
  contents: read
  checks: read

jobs:
  same-colo-cache-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Resolve exact-head Cloudflare Preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$TARGET_SHA" ]]

          candidate=''
          status=''
          conclusion=''
          for attempt in $(seq 1 40); do
            payload="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100")"
            candidate="$(jq -c --arg sha "$TARGET_SHA" '
              [.check_runs[] | select(.name == "Workers Builds: gacha-lens" and .head_sha == $sha)]
              | sort_by(.id) | last // empty
            ' <<<"$payload")"
            if [[ -n "$candidate" ]]; then
              status="$(jq -r '.status // ""' <<<"$candidate")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$candidate")"
              [[ "$status" == "completed" ]] && break
            fi
            sleep 15
          done
          [[ -n "$candidate" && "$status" == "completed" && "$conclusion" == "success" ]]

          summary="$(jq -r '.output.summary // ""' <<<"$candidate" | tr -d '\r')"
          preview_url="$(printf '%s\n' "$summary" | grep -Eo 'https://[A-Za-z0-9-]+-gacha-lens\.senpingxingzuo\.workers\.dev' | head -1 || true)"
          case "$preview_url" in
            https://*-gacha-lens.senpingxingzuo.workers.dev) ;;
            *) exit 1 ;;
          esac
          echo "PREVIEW_URL=$preview_url" >> "$GITHUB_ENV"
          echo "Exact-head Preview URL: $preview_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Prove async verified cache in one colo
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          prove_target() {
            local target="$1"
            local needle="$2"
            local status_url="${PREVIEW_URL}/__diag/async-safe-cache?target=${target}&mode=status"
            local html_url="${PREVIEW_URL}/__diag/async-safe-cache?target=${target}"
            local status_json first_metrics second_metrics second_header

            status_json="$(curl --silent --show-error --max-time 30 "$status_url")"
            echo "${target} initial status: ${status_json}" >> "$GITHUB_STEP_SUMMARY"

            first_metrics="$(curl --silent --show-error --max-time 90 \
              --dump-header "$tmp/${target}-first.headers" \
              --output "$tmp/${target}-first.body" \
              --write-out '%{http_code} %{time_total}' "$html_url")"
            [[ "${first_metrics%% *}" == "200" ]]
            grep -Fq "$needle" "$tmp/${target}-first.body"
            echo "${target} first: ${first_metrics}" >> "$GITHUB_STEP_SUMMARY"

            cached='false'
            verified='false'
            for attempt in $(seq 1 20); do
              status_json="$(curl --silent --show-error --max-time 30 "$status_url")"
              cached="$(jq -r '.cached' <<<"$status_json")"
              verified="$(jq -r '.verified' <<<"$status_json")"
              echo "${target} cache poll ${attempt}: cached=${cached} verified=${verified}" >> "$GITHUB_STEP_SUMMARY"
              if [[ "$cached" == "true" && "$verified" == "true" ]]; then
                break
              fi
              sleep 2
            done
            [[ "$cached" == "true" && "$verified" == "true" ]] || {
              echo "${target} async verified cache was not observable from the same runner." >&2
              exit 1
            }

            second_metrics="$(curl --silent --show-error --max-time 30 \
              --dump-header "$tmp/${target}-second.headers" \
              --output "$tmp/${target}-second.body" \
              --write-out '%{http_code} %{time_total}' "$html_url")"
            [[ "${second_metrics%% *}" == "200" ]]
            grep -Fq "$needle" "$tmp/${target}-second.body"
            second_header="$(awk 'BEGIN{IGNORECASE=1} /^x-gacha-diag-async-cache:/ {gsub("\r", ""); print $2; exit}' "$tmp/${target}-second.headers")"
            [[ "$second_header" == "HIT" ]] || {
              echo "${target} second response was not diagnostic HIT: ${second_header:-none}" >&2
              exit 1
            }
            cmp "$tmp/${target}-first.body" "$tmp/${target}-second.body"
            echo "${target} second: ${second_metrics} | async-cache=${second_header}" >> "$GITHUB_STEP_SUMMARY"
          }

          prove_target category 'ガシャポン'
          prove_target ranking '相場ランキング'
