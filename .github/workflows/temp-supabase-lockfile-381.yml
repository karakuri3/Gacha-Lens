name: Temporary Supabase lockfile generation

on:
  push:
    branches:
      - fix/runtime-supabase-transient-retry-381
    paths:
      - package.json
      - .github/workflows/temp-supabase-lockfile-381.yml

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Generate lockfile with exact retry-capable Supabase client
        run: npm install @supabase/supabase-js@2.102.0 --package-lock-only --ignore-scripts
      - name: Verify resolved version
        run: node -e "const l=require('./package-lock.json'); if(l.packages['node_modules/@supabase/supabase-js']?.version!=='2.102.0') process.exit(1)"
      - name: Verify lockfile changes are Supabase-only
        shell: bash
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const before = JSON.parse(execFileSync('git', ['show', 'HEAD:package-lock.json'], { encoding: 'utf8' }));
          const after = require('./package-lock.json');
          const keys = new Set([...Object.keys(before.packages || {}), ...Object.keys(after.packages || {})]);
          const changed = [...keys].filter((key) => JSON.stringify(before.packages?.[key]) !== JSON.stringify(after.packages?.[key]));
          const unexpected = changed.filter((key) => key !== '' && !key.startsWith('node_modules/@supabase/'));
          if (unexpected.length) {
            console.error('Unexpected lockfile package changes:', unexpected);
            process.exit(1);
          }
          const beforeRoot = structuredClone(before.packages?.[''] || {});
          const afterRoot = structuredClone(after.packages?.[''] || {});
          if (beforeRoot.dependencies) delete beforeRoot.dependencies['@supabase/supabase-js'];
          if (afterRoot.dependencies) delete afterRoot.dependencies['@supabase/supabase-js'];
          if (JSON.stringify(beforeRoot) !== JSON.stringify(afterRoot)) {
            console.error('Unexpected root lockfile changes');
            process.exit(1);
          }
          console.log(JSON.stringify({ ok: true, changed_packages: changed }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: supabase-lockfile-381
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
