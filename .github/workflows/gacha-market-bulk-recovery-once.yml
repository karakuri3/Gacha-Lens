name: Gacha Market One-Time Bulk Recovery

on:
  push:
    branches:
      - main
    paths:
      - .github/ops/gacha-market-bulk-recovery-20260916.token

permissions:
  contents: read
  actions: read

jobs:
  bulk-market-recovery:
    concurrency:
      group: gacha-market-bounded-v2
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GACHA_DATA_SOURCE: supabase
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
      YAHOO_SHOPPING_APP_ID: ${{ secrets.YAHOO_SHOPPING_APP_ID }}
      YAHOO_SHOPPING_FETCH_ENABLED: ${{ secrets.YAHOO_SHOPPING_FETCH_ENABLED }}
      GACHA_MARKET_BULK_RECOVERY_CONFIRMATION: APPROVE_GACHA_MARKET_BULK_RECOVERY_20260916
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify one-time recovery marker and exact current main
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test -f .github/ops/gacha-market-bulk-recovery-20260916.token
          marker="$(tr -d '\r\n' < .github/ops/gacha-market-bulk-recovery-20260916.token)"
          test "$marker" = "$GACHA_MARKET_BULK_RECOVERY_CONFIRMATION"
          git fetch --no-tags origin main --depth=1
          origin_main_sha="$(git rev-parse origin/main)"
          test "$GITHUB_SHA" = "$origin_main_sha"
          echo "origin_main_sha=$origin_main_sha" >> "$GITHUB_OUTPUT"
      - name: Recover current released market evidence in bounded rounds
        env:
          GACHA_MARKET_BULK_RECOVERY_ORIGIN_MAIN_SHA: ${{ steps.gate.outputs.origin_main_sha }}
        run: >-
          node scripts/market-bulk-recovery-once.mjs
          --output-dir=${{ runner.temp }}/gacha-market-bulk-recovery-once
      - name: Scan sanitized recovery artifacts
        id: scan
        if: ${{ always() }}
        run: node scripts/manual-market-audit-guard.mjs scan --directory=${{ runner.temp }}/gacha-market-bulk-recovery-once
      - name: Upload sanitized recovery artifacts
        if: ${{ always() && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: gacha-market-bulk-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/gacha-market-bulk-recovery-once
          if-no-files-found: error
          retention-days: 14
