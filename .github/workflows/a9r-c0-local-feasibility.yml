name: C0-A isolated local ranking feasibility
on:
  pull_request:
    paths:
      - 'experiments/a9r-c0/**'
      - 'tests/a9r-c0-*.test.mjs'
      - '.github/workflows/a9r-c0-local-feasibility.yml'
permissions:
  contents: read
concurrency:
  group: c0-a-local-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  local-only:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      C0_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      C0_NEXT_ORIGIN: http://127.0.0.1:3011
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Require exact-head and localhost-only C0 files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$C0_SOURCE_SHA"
          if grep -RE 'https?://(gachalens\.com|gacha-lens\.senpingxingzuo\.workers\.dev|gacha-lens-public\.senpingxingzuo\.workers\.dev)' experiments/a9r-c0 tests/a9r-c0-*.test.mjs; then
            echo 'Forbidden Production URL in local experiment' >&2; exit 1
          fi
      - name: Install root and frozen Wrangler workerd toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm ci --ignore-scripts --prefix .github/vinext-toolchain
      - name: Focused C0 contract, truthfulness and date-boundary tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/a9r-c0-*.test.mjs
      - name: Start real local Next application with built-in sample only
        shell: bash
        env:
          GACHA_DATA_SOURCE: sample
        run: |
          set -euo pipefail
          mkdir -p experiments/a9r-c0/artifacts
          node_modules/.bin/next dev --hostname 127.0.0.1 --port 3011 > "$RUNNER_TEMP/c0-next.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/c0-next.pid"
          ready=false
          for i in $(seq 1 80); do
            if curl --silent --fail --max-time 3 http://127.0.0.1:3011/ranking > /dev/null; then ready=true; break; fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then echo 'Real Next localhost unavailable' >&2; exit 2; fi
      - name: Capture genuine HTML and two genuine RSC states
        id: capture
        continue-on-error: true
        run: node experiments/a9r-c0/capture.mjs
      - name: Probe paired local workerd gates (not Production)
        id: workerd
        if: steps.capture.outcome == 'success'
        continue-on-error: true
        run: node experiments/a9r-c0/probe-workerd.mjs
      - name: Record complete 52-A9R-assertion classification without A9R execution
        run: node experiments/a9r-c0/coverage.mjs
      - name: Explicit C0 status; do not claim 52/52 or CPU Free10ms PASS
        if: always()
        shell: bash
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          WORKERD_OUTCOME: ${{ steps.workerd.outcome }}
        run: |
          set -euo pipefail
          mkdir -p experiments/a9r-c0/artifacts
          echo '{"classification":"NOT_PROVEN","reason":"real Next built-in sample is not the same 237/123/241 synthetic fixture; trusted update feed/browser parity/billable CPU not demonstrated"}' > experiments/a9r-c0/artifacts/disposition.json
          echo "C0-A: NOT_PROVEN. Capture step: $CAPTURE_OUTCOME. Local workerd step: $WORKERD_OUTCOME." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload local-only evidence even if RSC capture failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c0-a-local-${{ github.event.pull_request.head.sha }}
          path: experiments/a9r-c0/artifacts/
          retention-days: 7
          if-no-files-found: warn
      - name: Verify no tracked App/Public/runtime mutation or whitespace errors
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- worker/index.js workers/public app components lib
