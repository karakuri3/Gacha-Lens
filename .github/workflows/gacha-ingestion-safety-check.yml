name: Gacha Ingestion Safety Check

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      task:
        description: Production task to inspect
        required: true
        type: choice
        options:
          - official
          - market
          - stock

jobs:
  safety-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AUTOMATIC_INGESTION_WRITE_ENABLED: ${{ vars.AUTOMATIC_INGESTION_WRITE_ENABLED || 'false' }}
      INGESTION_WRITE_DISABLED: "true"
      MARKET_BACKFILL_WRITE_DISABLED: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify exact main SHA
        id: main_sha
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch --no-tags origin main --depth=1
          origin_main_sha="$(git rev-parse origin/main)"
          test "$GITHUB_SHA" = "$origin_main_sha"
          echo "origin_main_sha=$origin_main_sha" >> "$GITHUB_OUTPUT"
      - name: Run read-only safety preflight
        id: safety
        run: >-
          node scripts/ingestion-execution-guard.mjs preflight
          --output-dir=${{ runner.temp }}/gacha-ingestion-safety-check
          --event-name=workflow_dispatch
          --ref=${{ github.ref }}
          --head-sha=${{ github.sha }}
          --origin-main-sha=${{ steps.main_sha.outputs.origin_main_sha }}
          --task=${{ inputs.task }}
          --mode=read-only
          --source-scope=none
          --execute-sources=false
          --automatic-write-enabled=${{ env.AUTOMATIC_INGESTION_WRITE_ENABLED }}
      - name: Capture read-only after snapshot
        id: after_snapshot
        continue-on-error: true
        run: >-
          node scripts/ingestion-execution-guard.mjs snapshot
          --output=${{ runner.temp }}/gacha-ingestion-safety-check/after-snapshot.json
      - name: Finalize read-only safety report
        id: finalize
        if: ${{ always() }}
        run: >-
          node scripts/ingestion-execution-guard.mjs finalize-read-only
          --output-dir=${{ runner.temp }}/gacha-ingestion-safety-check
          --after=${{ runner.temp }}/gacha-ingestion-safety-check/after-snapshot.json
          --origin-main-sha=${{ steps.main_sha.outputs.origin_main_sha }}
      - name: Scan safety report
        id: scan
        run: node scripts/ingestion-execution-guard.mjs scan --directory=${{ runner.temp }}/gacha-ingestion-safety-check
      - name: Upload sanitized safety report
        id: upload
        if: ${{ steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-safety-check-${{ github.run_id }}
          path: ${{ runner.temp }}/gacha-ingestion-safety-check
          if-no-files-found: error
          retention-days: 14
      - name: Enforce read-only safety result
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ "${{ steps.finalize.outputs.final_ok }}" != "true" \
            || "${{ steps.finalize.outputs.zero_delta_verified }}" != "true" \
            || "${{ steps.scan.outcome }}" != "success" \
            || "${{ steps.upload.outcome }}" != "success" ]]; then
            echo "::error::Read-only safety verification failed."
            exit 1
          fi
