name: Worker A runtime lock probe

on:
  pull_request:
    paths:
      - ".github/vinext-toolchain/package.json"
      - ".github/workflows/worker-a-runtime-lock-probe.yml"

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate locked CI toolchain
        run: npm install --package-lock-only --ignore-scripts --prefix .github/vinext-toolchain

      - name: Verify patched undici remains locked
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const lock = JSON.parse(fs.readFileSync(".github/vinext-toolchain/package-lock.json", "utf8"));
          const version = lock.packages?.["node_modules/undici"]?.version;
          if (version !== "7.29.1") throw new Error(`expected undici 7.29.1, got ${version}`);
          console.log("undici lock preserved:", version);
          NODE

      - name: Commit npm-generated toolchain lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/vinext-toolchain/package-lock.json; then
            echo "toolchain lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/vinext-toolchain/package-lock.json
          git commit -m "build(runtime): refresh locked vinext static-assets graph"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
