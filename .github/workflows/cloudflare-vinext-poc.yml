name: Cloudflare vinext POC

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "lib/**"
      - "workers/public/**"
      - "scripts/build-public-worker.mjs"
      - "scripts/cloudflare-release-integrity.mjs"
      - "tests/cloudflare-dual-worker-bootstrap.test.mjs"
      - "tests/cloudflare-public-data-read.test.mjs"
      - "tests/cloudflare-release-integrity.test.mjs"
      - "next.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/vinext-toolchain/**"
      - ".github/workflows/cloudflare-vinext-poc.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-vinext-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TOOLCHAIN_DIR: .github/vinext-toolchain

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Require React and locked RSC versions to match
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const app = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const toolchain = JSON.parse(fs.readFileSync(".github/vinext-toolchain/package.json", "utf8"));
          const react = app.dependencies?.react;
          const reactDom = app.dependencies?.["react-dom"];
          const rsc = toolchain.dependencies?.["react-server-dom-webpack"];
          if (!react || !reactDom || !rsc || react !== reactDom || react !== rsc) {
            throw new Error(`React/RSC version mismatch: react=${react}, react-dom=${reactDom}, react-server-dom-webpack=${rsc}. Regenerate the locked vinext toolchain for the application React patch; do not allow vinext to live-upgrade React.`);
          }
          console.log(`React/RSC lockstep verified at ${react}.`);
          NODE

      - name: Install and audit locked CI toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix "$TOOLCHAIN_DIR"
          npm audit --audit-level=low --prefix "$TOOLCHAIN_DIR"

      - name: Verify locked direct toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const root = ".github/vinext-toolchain/node_modules";
          const expected = JSON.parse(fs.readFileSync(".github/vinext-toolchain/package.json", "utf8")).dependencies;
          for (const [name, version] of Object.entries(expected)) {
            const actual = JSON.parse(fs.readFileSync(`${root}/${name}/package.json`, "utf8")).version;
            if (actual !== version) throw new Error(`${name}: expected ${version}, got ${actual}`);
            console.log(`${name}@${actual}`);
          }
          NODE

      - name: Verify patched security lock resolutions
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const toolchain = JSON.parse(fs.readFileSync(".github/vinext-toolchain/package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync(".github/vinext-toolchain/package-lock.json", "utf8"));

          const parseVersion = (version, label) => {
            const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(version || "");
            if (!match) throw new Error(`Unexpected ${label} version format: ${version}`);
            return match.slice(1).map(Number);
          };
          const compare = (left, right) => {
            for (let index = 0; index < 3; index += 1) {
              if (left[index] !== right[index]) return left[index] - right[index];
            }
            return 0;
          };

          const undiciOverride = toolchain.overrides?.undici;
          const undiciResolved = lock.packages?.["node_modules/undici"]?.version;
          const miniflare = lock.packages?.["node_modules/miniflare"];
          if (!undiciOverride) throw new Error("Missing fail-closed undici override in locked vinext toolchain.");
          if (!undiciResolved) throw new Error("Locked vinext toolchain does not resolve undici.");
          if (undiciResolved !== undiciOverride) {
            throw new Error(`undici override/lock mismatch: override=${undiciOverride}, lock=${undiciResolved}. Regenerate package-lock.json with npm instead of hand-editing it.`);
          }
          const undiciActual = parseVersion(undiciResolved, "undici");
          if (undiciActual[0] === 7 && compare(undiciActual, [7, 28, 0]) >= 0 && compare(undiciActual, [7, 29, 1]) < 0) {
            throw new Error(`GHSA-3wwx-pv8p-q78v vulnerable undici remains locked: ${undiciResolved}`);
          }

          const fastUriOverride = toolchain.overrides?.["fast-uri"];
          const fastUriResolved = lock.packages?.["node_modules/fast-uri"]?.version;
          const ajv = lock.packages?.["node_modules/ajv"];
          if (!fastUriOverride) throw new Error("Missing fail-closed fast-uri override in locked vinext toolchain.");
          if (!fastUriResolved) throw new Error("Locked vinext toolchain does not resolve fast-uri.");
          if (fastUriResolved !== fastUriOverride) {
            throw new Error(`fast-uri override/lock mismatch: override=${fastUriOverride}, lock=${fastUriResolved}. Regenerate package-lock.json with npm instead of hand-editing it.`);
          }
          const fastUriActual = parseVersion(fastUriResolved, "fast-uri");
          if (fastUriActual[0] === 3 && compare(fastUriActual, [3, 1, 8]) < 0) {
            throw new Error(`GHSA-hrr3-gc8f-f4qj vulnerable fast-uri remains locked: ${fastUriResolved}`);
          }

          const undiciRequested = miniflare?.dependencies?.undici ?? "not-present";
          const fastUriRequested = ajv?.dependencies?.["fast-uri"] ?? "not-present";
          console.log(`Patched undici lock verified: miniflare requests ${undiciRequested}; override/resolved=${undiciResolved}.`);
          console.log(`Patched fast-uri lock verified: ajv requests ${fastUriRequested}; override/resolved=${fastUriResolved}.`);
          NODE

      - name: Expose locked toolchain without mutating root lockfile
        shell: bash
        run: |
          set -euo pipefail
          sha256sum package-lock.json > /tmp/root-package-lock.before
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = "package.json";
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
          const toolchain = JSON.parse(fs.readFileSync(".github/vinext-toolchain/package.json", "utf8")).dependencies;
          pkg.devDependencies = { ...pkg.devDependencies, ...toolchain };
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

          link_pkg() {
            local name="$1"
            local src="$PWD/$TOOLCHAIN_DIR/node_modules/$name"
            local dst="$PWD/node_modules/$name"
            mkdir -p "$(dirname "$dst")"
            rm -rf "$dst"
            ln -s "$src" "$dst"
          }

          link_pkg vinext
          link_pkg @vinext/cloudflare
          link_pkg react-server-dom-webpack
          link_pkg vite
          link_pkg @vitejs/plugin-react
          link_pkg @vitejs/plugin-rsc
          link_pkg @cloudflare/vite-plugin
          link_pkg wrangler

      - name: Run locked vinext compatibility check
        run: "$TOOLCHAIN_DIR/node_modules/.bin/vinext check"

      - name: Generate ephemeral Cloudflare configuration without dependency resolution
        shell: bash
        run: |
          set -euo pipefail
          "$TOOLCHAIN_DIR/node_modules/.bin/vinext" init --skip-check --platform=cloudflare --data-cache=kv --image-optimization=cloudflare-images | tee /tmp/vinext-init.log
          if grep -Eq 'Installing dependencies:|Installing devDependencies:|Upgrading dependencies:' /tmp/vinext-init.log; then
            echo 'vinext init attempted live dependency resolution; deterministic CI refuses to continue.' >&2
            exit 1
          fi
          sha256sum -c /tmp/root-package-lock.before
          git diff --exit-code -- package-lock.json

      - name: Pin non-production placeholder bindings
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const path = "wrangler.jsonc";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          config.name = "gachalens-cloudflare-poc";
          config.preview_urls = true;

          for (const namespace of config.kv_namespaces ?? []) {
            if (namespace.binding === "VINEXT_KV_CACHE" && !namespace.id) {
              namespace.id = "00000000000000000000000000000000";
            }
          }

          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Build vinext worker artifact without live React upgrade
        shell: bash
        env:
          WORKERS_CI_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          "$TOOLCHAIN_DIR/node_modules/.bin/vinext" build | tee /tmp/vinext-build.log
          if grep -Fq 'Upgrading React for RSC compatibility' /tmp/vinext-build.log; then
            echo 'vinext attempted to live-upgrade React; deterministic CI refuses this build.' >&2
            exit 1
          fi

      - name: Verify worker artifact and lockfile invariants
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/server/wrangler.json
          sha256sum -c /tmp/root-package-lock.before
          git diff --exit-code -- package-lock.json

      - name: Build exact-head Public Worker bootstrap
        shell: bash
        env:
          WORKERS_CI_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node scripts/build-public-worker.mjs
          node --test tests/cloudflare-dual-worker-bootstrap.test.mjs tests/cloudflare-public-data-read.test.mjs tests/cloudflare-release-integrity.test.mjs

      - name: Dry-run dependency-free Public Worker
        shell: bash
        run: |
          set -euo pipefail
          "$TOOLCHAIN_DIR/node_modules/.bin/wrangler" deploy             --dry-run             --config workers/public/wrangler.jsonc             --outdir /tmp/gacha-public-bundle | tee /tmp/public-dry-run.log
          if grep -REiq 'vinext|react|@supabase/supabase-js' /tmp/gacha-public-bundle 2>/dev/null; then
            echo 'Public Worker bundle unexpectedly contains App runtime dependencies.' >&2
            exit 1
          fi

      - name: Prove exact-head Service Binding locally
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = "dist/server/wrangler.json";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          config.name = "gacha-lens";
          // Local-only compatibility cap: locked wrangler@4.131.1 embeds workerd
          // supporting dates through 2026-09-18. Cloudflare live builds keep
          // the generated compatibility date and are validated separately.
          config.compatibility_date = "2026-09-18";
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          NODE

          log=/tmp/gacha-dual-worker.log
          "$TOOLCHAIN_DIR/node_modules/.bin/wrangler" dev             --config workers/public/wrangler.jsonc             --config dist/server/wrangler.json             --ip 127.0.0.1             --port 8787 >"$log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat "$log" >&2 || true' EXIT

          ready='false'
          for attempt in $(seq 1 30); do
            if curl --silent --fail --max-time 2               http://127.0.0.1:8787/api/runtime-diagnostics/release-source >/tmp/public-source.json; then
              ready='true'
              break
            fi
            sleep 1
          done
          [[ "$ready" == 'true' ]] || {
            echo 'Dual Worker local runtime did not become ready.' >&2
            exit 1
          }

          public_sha="$(node scripts/cloudflare-release-integrity.mjs read-source-sha < /tmp/public-source.json)"
          [[ "$public_sha" == "$TARGET_SHA" ]] || {
            echo "Local Public SHA mismatch: ${public_sha}" >&2
            exit 1
          }

          code="$(curl --silent --show-error --max-time 30             --output /tmp/delegation.json             --write-out '%{http_code}'             http://127.0.0.1:8787/api/runtime-diagnostics/app-delegation)"
          [[ "$code" == '200' ]] || {
            echo "Local Service Binding diagnostic returned HTTP ${code}." >&2
            cat /tmp/delegation.json >&2 || true
            exit 1
          }

          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const expected = process.env.TARGET_SHA;
          const payload = JSON.parse(fs.readFileSync("/tmp/delegation.json", "utf8"));
          if (payload.public_source_sha !== expected) throw new Error("public SHA mismatch");
          if (payload.app_source_sha !== expected) throw new Error("app SHA mismatch");
          if (payload.representative?.path !== "/review" || payload.representative?.status !== 200 || payload.representative?.marker !== true) {
            throw new Error("representative App route delegation failed");
          }
          NODE

          echo "Public exact SHA: $TARGET_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "App exact SHA via Service Binding: $TARGET_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Representative delegated route /review: HTTP 200" >> "$GITHUB_STEP_SUMMARY"
          kill "$pid"
          wait "$pid" || true
          trap - EXIT
