name: R3 Depth Read-only One-shot #206

on:
  push:
    branches:
      - ops/r3-depth-one-shot-206-20260903

permissions:
  contents: read

jobs:
  r3-depth-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APPROVED_MAIN_SHA: b38f62ef81b8ec3a9cdf02395d4bdd678dadee31
      MARKET_API_MAX_ATTEMPTS: "3"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      YAHOO_SHOPPING_APP_ID: ${{ secrets.YAHOO_SHOPPING_APP_ID }}

    steps:
      - name: Checkout disposable branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact approved main and one-file branch diff
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/ops/r3-depth-one-shot-206-20260903"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main --no-tags --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$APPROVED_MAIN_SHA"
          git cat-file -e "$APPROVED_MAIN_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$APPROVED_MAIN_SHA" "$GITHUB_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/r3-depth-one-shot-206.yml"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Execute approved R3 read-only canary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r3-depth-206"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { loadOfficialCatalog } from './scripts/load-official-catalog.mjs';
          import { fetchRows } from './scripts/supabase-rest.mjs';
          import { fetchMarketListingsRaw, MARKET_SOURCE_SCOPES, assertMarketFetchComplete } from './lib/fetchers/market-fetcher.js';
          import { buildPriorityThreeSeedQueriesForVariant } from './lib/fetchers/market-seed-query-planner.js';
          import { countMarketQueryAttempts } from './lib/fetchers/market-query-planner.js';
          import { applyMarketCandidateSafety } from './lib/domain/market-match-safety.js';
          import { buildSanitizedMarketCandidateAudit } from './lib/domain/market-candidate-audit.js';
          import { selectMarketDepthCandidates, buildMarketDepthCollectorDryRun } from './lib/domain/market-depth-collector.js';

          const APPROVED_MAIN_SHA = 'b38f62ef81b8ec3a9cdf02395d4bdd678dadee31';
          const targets = [
            { key: 'buzz', provider: 'rakuten_ichiba', variant_id: 'tarts-y903861-バズ・ライトイヤー', series_id: 'tarts-y903861' },
            { key: 'fushiguro', provider: 'yahoo_shopping', variant_id: 'gashapon-4535123846069000-伏黒恵', series_id: 'gashapon-4535123846069000' },
          ];
          const outDir = path.join(process.env.RUNNER_TEMP, 'r3-depth-206');
          const now = new Date();
          const freshCutoff = now.getTime() - 30 * 24 * 60 * 60 * 1000;
          const qIn = (values) => `in.(${values.map((v) => `"${String(v).replaceAll('"','\\"')}"`).join(',')})`;
          const variantIds = targets.map((t) => t.variant_id);
          const seriesIds = targets.map((t) => t.series_id);

          const [variantRows, seriesRows, unresolvedIssues, existingListings] = await Promise.all([
            fetchRows('variants', { select: 'id,name,series_id,review_required,official_url,variant_type', pageSize: 20, params: { id: qIn(variantIds), order: 'id.asc' } }),
            fetchRows('series', { select: 'id,name,official_url', pageSize: 20, params: { id: qIn(seriesIds), order: 'id.asc' } }),
            fetchRows('import_issues', { select: 'id,table_name,record_id,issue_type,resolved', pageSize: 500, params: { resolved: 'eq.false', order: 'id.asc' } }),
            fetchRows('market_listings', { select: 'id,variant_id,matched_variant_id,source,source_url,raw,status,listing_type,review_required,last_observed_at,listed_at,created_at', pageSize: 500, params: { order: 'id.asc' } }),
          ]);

          const preflight = [];
          for (const target of targets) {
            const variant = variantRows.find((row) => row.id === target.variant_id);
            const series = seriesRows.find((row) => row.id === target.series_id);
            if (!variant || !series || variant.series_id !== target.series_id || variant.review_required === true || String(variant.variant_type || '').toLowerCase() === 'provisional') {
              throw new Error(`R3 preflight identity/review drift: ${target.key}`);
            }
            const unresolved = unresolvedIssues.filter((row) => (row.table_name === 'variants' && row.record_id === target.variant_id) || (row.table_name === 'series' && row.record_id === target.series_id));
            if (unresolved.length !== 0) throw new Error(`R3 preflight unresolved catalog issue drift: ${target.key}`);
            const fresh = existingListings.filter((row) => {
              const variantId = row.matched_variant_id || row.variant_id;
              const ts = Date.parse(row.last_observed_at || row.listed_at || row.created_at || '');
              return variantId === target.variant_id && row.status === 'active' && row.listing_type === 'single' && row.review_required !== true && Number.isFinite(ts) && ts >= freshCutoff;
            });
            if (fresh.length !== 1) throw new Error(`R3 preflight fresh depth drift: ${target.key}; depth=${fresh.length}`);
            preflight.push({ key: target.key, variant_id: target.variant_id, series_id: target.series_id, review_required: false, fresh_safe_depth: fresh.length, unresolved_catalog_issues: 0, current_listing_ids: fresh.map((row) => row.id) });
          }
          fs.writeFileSync(path.join(outDir, 'preflight.json'), `${JSON.stringify({ schema_version: 1, kind: 'r3_depth_preflight', approved_main_sha: APPROVED_MAIN_SHA, generated_at: now.toISOString(), production_writes: 0, targets: preflight }, null, 2)}\n`);

          const catalog = await loadOfficialCatalog();
          const results = [];
          let plannerRequests = 0;
          let httpAttempts = 0;

          for (const target of targets) {
            const variant = catalog.variantById.get(target.variant_id);
            const series = catalog.seriesById.get(target.series_id);
            if (!variant || !series || variant.series_id !== target.series_id) throw new Error(`R3 repository catalog identity drift: ${target.key}`);
            const queries = buildPriorityThreeSeedQueriesForVariant(variant, series).map((query) => ({ ...query, priority: 3, priority_reason: 'r3_depth_read_only', coverage_state: 'depth_one' }));
            if (queries.length !== 1 || countMarketQueryAttempts(queries) < 1 || countMarketQueryAttempts(queries) > 3) throw new Error(`R3 query contract drift: ${target.key}`);

            const sourceOptions = target.provider === 'rakuten_ichiba'
              ? { rakuten: { enabled: true, applicationId: process.env.RAKUTEN_APPLICATION_ID, accessKey: process.env.RAKUTEN_ACCESS_KEY, queryLimit: 1 }, yahoo: { enabled: false } }
              : { rakuten: { enabled: false }, yahoo: { enabled: true, appId: process.env.YAHOO_SHOPPING_APP_ID, queryLimit: 1 } };
            const fetched = assertMarketFetchComplete(await fetchMarketListingsRaw({ catalog, queries, sourceScope: MARKET_SOURCE_SCOPES.PLANNER_APIS, ...sourceOptions }));
            const expectedRequests = target.provider === 'rakuten_ichiba' ? fetched.rakutenRequestsAttempted : fetched.yahooRequestsAttempted;
            const forbiddenRequests = target.provider === 'rakuten_ichiba' ? fetched.yahooRequestsAttempted : fetched.rakutenRequestsAttempted;
            if (forbiddenRequests !== 0 || expectedRequests !== fetched.plannerApiRequestsAttempted || fetched.plannerApiRequestsAttempted > 3 || fetched.plannerApiRequestsAttempted < 1) {
              throw new Error(`R3 provider/request envelope violation: ${target.key}`);
            }
            const targetHttpAttempts = (fetched.feedResults || []).reduce((sum, row) => sum + Math.max(0, Number(row.attempt_count) || 0), 0);
            plannerRequests += fetched.plannerApiRequestsAttempted;
            httpAttempts += targetHttpAttempts;
            if (plannerRequests > 6 || httpAttempts > 18) throw new Error('R3 aggregate request budget exceeded.');

            const safety = applyMarketCandidateSafety({ records: fetched.records, queryPlan: queries, catalog });
            const report = buildSanitizedMarketCandidateAudit({
              records: safety.records,
              queryPlan: queries,
              catalog,
              runContext: { mode: 'dry-run', source_scope: 'planner-apis', run_id: process.env.GITHUB_RUN_ID, run_attempt: process.env.GITHUB_RUN_ATTEMPT, head_sha: APPROVED_MAIN_SHA, event_name: process.env.GITHUB_EVENT_NAME },
              summary: { safety_assessed_records: safety.records.filter((row) => row.market_safety_assessed).length, listing_upserts: 0, observations_created: 0, ingestion_runs_written: 0 },
            });
            const selection = selectMarketDepthCandidates(report.candidates, { budget: 5, targetVariantId: target.variant_id, targetSeriesId: target.series_id, existingListings });
            if (selection.selected_count > 5 || selection.selected.some((candidate) => candidate.source?.provider !== target.provider)) throw new Error(`R3 selected candidate envelope violation: ${target.key}`);
            const dryRun = buildMarketDepthCollectorDryRun({ selection, retrieval: { provider_request_count: fetched.plannerApiRequestsAttempted, raw_candidate_count: fetched.records.length }, generatedAt: new Date() });
            if (dryRun.production_actions !== 0) throw new Error(`R3 dry-run write contract violation: ${target.key}`);

            results.push({
              key: target.key,
              provider: target.provider,
              variant_id: target.variant_id,
              series_id: target.series_id,
              query_attempts_planned: countMarketQueryAttempts(queries),
              planner_api_requests_attempted: fetched.plannerApiRequestsAttempted,
              http_attempts: targetHttpAttempts,
              requests_retried: fetched.requests_retried,
              retry_attempts_total: fetched.retry_attempts_total,
              requests_timed_out: fetched.requests_timed_out,
              requests_rate_limited: fetched.requests_rate_limited,
              requests_permanently_failed: fetched.requests_permanently_failed,
              raw_candidate_count: fetched.records.length,
              safety_assessed_records: safety.records.filter((row) => row.market_safety_assessed).length,
              audit_candidate_count: report.candidates.length,
              accepted_count: selection.selected_count,
              rejected_count: selection.rejected_count,
              rejection_reason_counts: selection.rejection_reason_counts,
              selected_listing_ids: selection.selected_listing_ids,
              selected_source_identities: selection.selected_source_identities,
              selected_public_urls: selection.selected_public_urls,
              selected_candidate_keys: selection.selected_candidate_keys,
              selected_candidate_fingerprints: selection.selected_candidate_fingerprints,
              selected_offers: selection.selected.map((candidate) => ({ title: candidate.listing?.title ?? null, price: candidate.listing?.price ?? null, status: candidate.listing?.status ?? null, provider: candidate.source?.provider ?? null, source_listing_id: candidate.source?.listing_id ?? null, public_url: candidate.source?.public_url ?? null })),
              projected_writes: dryRun.projected_writes,
              production_actions: 0,
            });
          }

          const acceptedTotal = results.reduce((sum, row) => sum + row.accepted_count, 0);
          if (acceptedTotal > 10 || plannerRequests > 6 || httpAttempts > 18) throw new Error('R3 final envelope violation.');
          const evidence = {
            schema_version: 1,
            kind: 'r3_depth_read_only_canary',
            approved_main_sha: APPROVED_MAIN_SHA,
            generated_at: new Date().toISOString(),
            affiliate_enrichment: false,
            strict_p3_predicate: true,
            second_provider_fallback: false,
            planner_api_requests_attempted: plannerRequests,
            http_attempts: httpAttempts,
            accepted_total: acceptedTotal,
            accepted_limit_total: 10,
            production_db_inserts: 0,
            production_db_updates: 0,
            production_db_deletes: 0,
            rpc_calls: 0,
            migrations: 0,
            results,
          };
          fs.writeFileSync(path.join(outDir, 'r3-depth-result.json'), `${JSON.stringify(evidence, null, 2)}\n`);
          console.log(JSON.stringify({ ok: true, planner_api_requests_attempted: plannerRequests, http_attempts: httpAttempts, accepted_total: acceptedTotal, production_writes: 0 }));
          NODE

      - name: Upload sanitized R3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-depth-206-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/r3-depth-206/preflight.json
            ${{ runner.temp }}/r3-depth-206/r3-depth-result.json
