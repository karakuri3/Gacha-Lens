name: Cloudflare runtime smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "worker/**"
      - "jsconfig.json"
      - "next.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloudflare-runtime-smoke.yml"
      - ".github/workflows/cloudflare-cache-proof.yml"

permissions:
  contents: read
  checks: read

concurrency:
  group: cloudflare-live-preview-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  exact-head-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BROWSER_ACCEPT: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Resolve exact-head Cloudflare Preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$TARGET_SHA" ]] || {
            echo "Checkout SHA ${actual_sha} does not match target ${TARGET_SHA}." >&2
            exit 1
          }

          candidate=''
          status=''
          conclusion=''

          for attempt in $(seq 1 40); do
            payload="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100")"

            candidate="$(jq -c --arg sha "$TARGET_SHA" '
              [.check_runs[]
                | select(.name == "Workers Builds: gacha-lens" and .head_sha == $sha)]
              | sort_by(.id)
              | last // empty
            ' <<<"$payload")"

            if [[ -n "$candidate" ]]; then
              status="$(jq -r '.status // ""' <<<"$candidate")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$candidate")"
              if [[ "$status" == 'completed' ]]; then
                break
              fi
            fi

            echo "Cloudflare exact-head build not complete yet (attempt ${attempt}/40)." >> "$GITHUB_STEP_SUMMARY"
            sleep 15
          done

          [[ -n "$candidate" ]] || {
            echo "No Cloudflare Workers check run found for exact head ${TARGET_SHA}." >&2
            exit 1
          }
          [[ "$status" == 'completed' ]] || {
            echo "Cloudflare Workers check did not complete within the bounded wait." >&2
            exit 1
          }
          [[ "$conclusion" == 'success' ]] || {
            echo "Cloudflare Workers exact-head build concluded ${conclusion:-unknown}." >&2
            exit 1
          }

          summary="$(jq -r '.output.summary // ""' <<<"$candidate" | tr -d '\r')"
          preview_url="$(printf '%s\n' "$summary" | grep -Eo 'https://[A-Za-z0-9-]+-gacha-lens\.senpingxingzuo\.workers\.dev' | head -1 || true)"
          check_id="$(jq -r '.id' <<<"$candidate")"

          case "$preview_url" in
            https://*-gacha-lens.senpingxingzuo.workers.dev) ;;
            *)
              echo 'Cloudflare check succeeded but did not expose an approved exact-head Preview URL.' >&2
              printf '%s\n' "$summary" >&2
              exit 1
              ;;
          esac

          echo "PREVIEW_URL=${preview_url}" >> "$GITHUB_ENV"
          echo "Cloudflare check run: ${check_id}" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact source SHA: ${TARGET_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact-head Preview URL: ${preview_url}" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke public runtime and boundaries
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          request_get() {
            local name="$1"
            local path="$2"
            local needle="${3:-}"
            local body="$tmp/${name}.body"
            local headers="$tmp/${name}.headers"
            local attempt rc code delay

            for attempt in 1 2 3; do
              rc=0
              code="$(curl --silent --show-error --location --max-time 90 \
                -H "Accept: ${BROWSER_ACCEPT}" \
                --dump-header "$headers" \
                --output "$body" \
                --write-out '%{http_code}' \
                "${PREVIEW_URL}${path}")" || rc=$?
              code="${code:-000}"

              if [[ "$rc" == "0" && "$code" == "200" ]]; then
                if [[ -n "$needle" ]] && ! grep -Fq "$needle" "$body"; then
                  echo "$name did not contain required marker: $needle" >&2
                  echo 'Bounded public HTML diagnostic (first 2000 bytes):' >&2
                  head -c 2000 "$body" >&2 || true
                  echo >&2
                  echo 'Bounded public HTML error signatures:' >&2
                  grep -Eo '商品情報を取得できません|一時的な通信エラー[^<]{0,160}|Data source[^<]{0,160}|Product data[^<]{0,160}|digest.{0,160}' "$body" | head -20 >&2 || true
                  echo 'Bounded public HTML diagnostic (last 6000 bytes):' >&2
                  tail -c 6000 "$body" >&2 || true
                  exit 1
                fi
                printf '%-24s HTTP 200 (attempt %s)\n' "$name" "$attempt" >> "$GITHUB_STEP_SUMMARY"
                return 0
              fi

              if [[ "$attempt" -lt 3 ]]; then
                case "$code" in
                  000|429|500|502|503|504)
                    delay=$((attempt * 2))
                    echo "$name transient failure rc=$rc HTTP $code on attempt $attempt; retrying after ${delay}s" | tee -a "$GITHUB_STEP_SUMMARY"
                    sleep "$delay"
                    continue
                    ;;
                esac
              fi

              echo "$name failed rc=$rc HTTP $code on attempt $attempt" >&2
              head -c 1000 "$body" >&2 || true
              exit 1
            done
          }

          edge_policy() {
            local name="$1"
            awk 'BEGIN{IGNORECASE=1} /^x-gacha-edge-cache-policy:/ {gsub("\r", ""); print $2; exit}' "$tmp/${name}.headers"
          }

          cf_cache_status() {
            local name="$1"
            awk 'BEGIN{IGNORECASE=1} /^cf-cache-status:/ {gsub("\r", ""); print $2; exit}' "$tmp/${name}.headers"
          }

          encoded_slug='tarts-y901096-%E3%83%87%E3%82%A3%E3%82%BA%E3%83%8B%E3%83%BC-%E3%83%9E%E3%83%AA%E3%83%BC'
          product_path="/series/${encoded_slug}"
          category_path='/categories/%E3%82%AC%E3%82%B7%E3%83%A3%E3%83%9D%E3%83%B3'
          brand_path='/brands/%E3%83%90%E3%83%B3%E3%83%80%E3%82%A4'
          franchise_path='/franchises/%E3%82%B5%E3%83%B3%E3%83%AA%E3%82%AA%E3%82%AD%E3%83%A3%E3%83%A9%E3%82%AF%E3%82%BF%E3%83%BC%E3%82%BA'

          request_get product_1 "$product_path" 'ディズニー マリー'
          request_get product_2 "$product_path" 'ディズニー マリー'
          request_get product_3 "$product_path" 'ディズニー マリー'

          request_get home '/' 'Gacha Lens'
          request_get series '/series' 'ガチャ一覧'
          request_get categories '/categories' 'カテゴリから探す'
          request_get brands '/brands'
          request_get franchises '/franchises'
          request_get category_detail "$category_path" 'ガシャポン'
          request_get category_api '/api/public-discovery?type=category&name=%E3%82%AC%E3%82%B7%E3%83%A3%E3%83%9D%E3%83%B3&page=1' 'ガシャポン'
          request_get brand_detail "$brand_path" 'バンダイ'
          request_get brand_api '/api/public-discovery?type=brand&name=%E3%83%90%E3%83%B3%E3%83%80%E3%82%A4&page=1' 'バンダイ'
          request_get franchise_detail "$franchise_path" 'サンリオキャラクターズ'
          request_get franchise_api '/api/public-discovery?type=franchise&name=%E3%82%B5%E3%83%B3%E3%83%AA%E3%82%AA%E3%82%AD%E3%83%A3%E3%83%A9%E3%82%AF%E3%82%BF%E3%83%BC%E3%82%BA&page=1' 'サンリオキャラクターズ'
          request_get catalog_search '/series?q=%E3%83%9E%E3%83%AA%E3%83%BC' 'マリー'
          request_get ranking '/ranking'
          request_get restocks '/restocks'
          request_get stock '/stock'
          request_get stock_query '/stock?q=%E3%83%9E%E3%83%AA%E3%83%BC' '在庫目撃情報'
          request_get public_stock_api '/api/public-stock' '"rows"'
          request_get schedule '/schedule'
          request_get guides '/guides'
          request_get public_api "/api/public-variants?ids=${encoded_slug}" 'tarts-y901096-ディズニー-マリー'
          request_get review '/review' 'Review access'
          request_get robots '/robots.txt' 'Sitemap: https://gachalens.com/sitemap.xml'
          request_get sitemap '/sitemap.xml' '<loc>https://gachalens.com/'
          request_get series_sitemap '/series-sitemap.xml' '<loc>https://gachalens.com/series/group/'
          request_get variant_sitemap '/variant-sitemap.xml' '<sitemapindex'
          request_get variant_sitemap_shard '/variant-sitemap/1' '<loc>https://gachalens.com/series/'
          grep -Fq '<loc>https://gachalens.com/variant-sitemap/1</loc>' "$tmp/variant_sitemap.body" || {
            echo 'Variant sitemap index did not publish shard 1.' >&2
            exit 1
          }

          grep -Fq 'https://gachalens.com/series/' "$tmp/product_1.body" || {
            echo 'Product detail canonical/site metadata did not point at gachalens.com.' >&2
            exit 1
          }

          for name in product_1 product_2 product_3; do
            [[ "$(edge_policy "$name")" == 'series-detail-300-v2' ]] || {
              echo "$name is missing series-detail edge-cache policy" >&2
              exit 1
            }
          done

          for name in categories brands franchises; do
            [[ "$(edge_policy "$name")" == 'discovery-index-300-v2' ]] || {
              echo "$name is missing bounded discovery-index edge-cache policy" >&2
              exit 1
            }
          done

          for name in series category_detail brand_detail franchise_detail; do
            [[ "$(edge_policy "$name")" == 'discovery-document-300-v2' ]] || {
              echo "$name is missing discovery-document edge-cache policy" >&2
              exit 1
            }
          done

          for name in home ranking restocks stock schedule guides; do
            [[ "$(edge_policy "$name")" == 'public-document-120-v1' ]] || {
              echo "$name is missing public document edge-cache policy" >&2
              exit 1
            }
          done

          for name in robots sitemap series_sitemap variant_sitemap variant_sitemap_shard; do
            [[ "$(edge_policy "$name")" == 'public-sitemap-86400-v1' ]] || {
              echo "$name is missing public sitemap edge-cache policy" >&2
              exit 1
            }
          done


          invalid_variant_shard_code="$(curl --silent --show-error --max-time 60 --output "$tmp/variant-sitemap-invalid.body" --write-out '%{http_code}' "${PREVIEW_URL}/variant-sitemap/5001")"
          [[ "$invalid_variant_shard_code" == "404" ]] || {
            echo "Out-of-range variant sitemap shard returned $invalid_variant_shard_code, expected 404" >&2
            exit 1
          }
          echo 'Out-of-range variant sitemap shard boundary: HTTP 404' >> "$GITHUB_STEP_SUMMARY"

          [[ -z "$(edge_policy catalog_search)" ]] || {
            echo 'Query/search variant unexpectedly received a shared edge-cache policy.' >&2
            exit 1
          }
          [[ -z "$(edge_policy stock_query)" ]] || {
            echo 'Stock query variant unexpectedly received a shared edge-cache policy.' >&2
            exit 1
          }

          request_get categories_warm '/categories' 'カテゴリから探す'
          request_get series_warm '/series' 'ガチャ一覧'
          request_get category_detail_warm "$category_path" 'ガシャポン'
          request_get brand_detail_warm "$brand_path" 'バンダイ'
          request_get franchise_detail_warm "$franchise_path" 'サンリオキャラクターズ'
          request_get ranking_warm '/ranking'
          request_get restocks_warm '/restocks'
          request_get series_sitemap_warm '/series-sitemap.xml'

          for name in categories_warm series_warm category_detail_warm brand_detail_warm franchise_detail_warm ranking_warm series_sitemap_warm; do
            cf_status="$(cf_cache_status "$name")"
            case "$cf_status" in
              HIT|STALE)
                echo "$name edge cache: $cf_status" >> "$GITHUB_STEP_SUMMARY"
                ;;
              *)
                echo "$name was ${cf_status:-none}, expected HIT or STALE" >&2
                exit 1
                ;;
            esac
          done

          restocks_status="$(cf_cache_status restocks_warm)"
          case "$restocks_status" in
            MISS|HIT|STALE)
              echo "restocks_warm edge cache observation: $restocks_status; bounded origin path already verified HTTP 200." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "restocks_warm had unexpected cache status ${restocks_status:-none}" >&2
              exit 1
              ;;
          esac

          review_code="$(curl --silent --show-error --max-time 60 --output "$tmp/review-post.body" --write-out '%{http_code}' -X POST -H "Origin: ${PREVIEW_URL}" -H 'Content-Type: application/x-www-form-urlencoded' --data 'decision=approved' "${PREVIEW_URL}/api/review/community-reports/runtime-smoke-nonexistent")"
          [[ "$review_code" == "401" ]] || { echo "Unauthenticated review mutation returned $review_code, expected 401" >&2; exit 1; }

          ingest_code="$(curl --silent --show-error --max-time 60 --output "$tmp/ingest.body" --write-out '%{http_code}' -X POST "${PREVIEW_URL}/api/ingest/all")"
          [[ "$ingest_code" == "401" ]] || { echo "Unauthenticated ingest returned $ingest_code, expected 401" >&2; exit 1; }

          login_code="$(curl --silent --show-error --max-time 60 --output /dev/null --write-out '%{http_code}' -X POST -H 'Content-Type: application/x-www-form-urlencoded' --data 'token=runtime-smoke-invalid-token' "${PREVIEW_URL}/review/login")"
          [[ "$login_code" == "303" ]] || { echo "Invalid review login returned $login_code, expected 303" >&2; exit 1; }

          echo 'Review/admin unauthenticated mutation boundary: HTTP 401' >> "$GITHUB_STEP_SUMMARY"
          echo 'Ingest unauthenticated boundary: HTTP 401; authorized path is code-pinned to HTTP 410/GitHub Actions.' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Production effective-release regression
        shell: bash
        run: |
          set -euo pipefail
          production='https://gachalens.com'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          fetch_html() {
            local name="$1"
            local path="$2"
            local body="$tmp/$name.html"
            local code
            code="$(curl --silent --show-error --location --max-time 90 \
              -H "Accept: ${BROWSER_ACCEPT}" \
              --output "$body" \
              --write-out '%{http_code}' \
              "${production}${path}")"
            [[ "$code" == "200" ]] || {
              echo "$name returned HTTP $code" >&2
              head -c 2000 "$body" >&2 || true
              exit 1
            }
          }

          require_text() {
            local name="$1"
            local needle="$2"
            grep -Fq "$needle" "$tmp/$name.html" || {
              echo "$name did not contain required text: $needle" >&2
              exit 1
            }
          }

          forbid_text() {
            local name="$1"
            local needle="$2"
            if grep -Fq "$needle" "$tmp/$name.html"; then
              echo "$name unexpectedly contained: $needle" >&2
              exit 1
            fi
          }

          fetch_html kep1er_released '/series?scope=variant&release=released&q=CHAEHYUN'
          require_text kep1er_released '/series/gashapon-4582770121827000-chaehyun'
          fetch_html kep1er_upcoming '/series?scope=variant&release=upcoming&q=CHAEHYUN'
          forbid_text kep1er_upcoming '/series/gashapon-4582770121827000-chaehyun'

          fetch_html kep1er_series_released '/series?scope=series&release=released&q=Kep1er'
          require_text kep1er_series_released '/series/group/gashapon-4582770121827000'
          fetch_html kep1er_series_upcoming '/series?scope=series&release=upcoming&q=Kep1er'
          forbid_text kep1er_series_upcoming '/series/group/gashapon-4582770121827000'

          for spec in \
            'gashapon-4582770121827000|Kep1er ミニCDコレクション' \
            'gashapon-4582769776601000|NCT WISH ぷくっとリング' \
            'gashapon-4582770068344000|【フラットガシャポン】サンリオキャラクターズ いちご新聞クリアラバーコースター' \
            'gashapon-4570118233042000|パンどろぼう フィギュアウォッチコレクション' \
            'gashapon-4582769979477000|TVアニメ『逃げ上手の若君』 まちぼうけ'
          do
            slug="${spec%%|*}"
            name="${spec#*|}"
            key="${slug//[^A-Za-z0-9]/_}"
            fetch_html "series_${key}" "/series/group/${slug}?qa=release-state-332"
            require_text "series_${key}" "$name"
            require_text "series_${key}" '発売中'
          done

          for spec in \
            'gashapon-4582770121827000-chaehyun|CHAEHYUN' \
            'gashapon-4582769776601000-riku|RIKU' \
            'gashapon-4582770068344000-no-207|No.207'
          do
            slug="${spec%%|*}"
            name="${spec#*|}"
            key="${slug//[^A-Za-z0-9]/_}"
            fetch_html "variant_${key}" "/series/${slug}?qa=release-state-332"
            require_text "variant_${key}" "$name"
            require_text "variant_${key}" '発売中'
          done

          fetch_html ranking_upcoming '/ranking/upcoming?qa=release-state-332'
          forbid_text ranking_upcoming 'CHAEHYUN'
          forbid_text ranking_upcoming 'Kep1er ミニCDコレクション'

          fetch_html schedule_sep '/schedule?month=2026-09&qa=release-state-332'
          require_text schedule_sep 'Kep1er ミニCDコレクション'
          require_text schedule_sep 'NCT WISH ぷくっとリング'
          fetch_html schedule_aug '/schedule?month=2026-08&qa=release-state-332'
          require_text schedule_aug 'パンどろぼう フィギュアウォッチコレクション'
          require_text schedule_aug 'サンリオキャラクターズ'

          echo 'Production effective-release UI regression: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- released search includes repaired item and upcoming search excludes it' >> "$GITHUB_STEP_SUMMARY"
          echo '- five parent series details render 発売中' >> "$GITHUB_STEP_SUMMARY"
          echo '- three representative repaired variant details render 発売中' >> "$GITHUB_STEP_SUMMARY"
          echo '- upcoming ranking excludes repaired Kep1er item/series' >> "$GITHUB_STEP_SUMMARY"
          echo '- August/September schedule keeps historical release entries' >> "$GITHUB_STEP_SUMMARY"

      - name: Compare security-header coverage with current Production
        shell: bash
        run: |
          set -euo pipefail
          preview_headers="$(mktemp)"
          production_headers="$(mktemp)"
          trap 'rm -f "$preview_headers" "$production_headers"' EXIT
          curl --silent --show-error --max-time 60 --output /dev/null --dump-header "$preview_headers" "${PREVIEW_URL}/"
          curl --silent --show-error --max-time 60 --output /dev/null --dump-header "$production_headers" 'https://gachalens.com/'

          missing=0
          for header in strict-transport-security x-content-type-options x-frame-options referrer-policy content-security-policy permissions-policy; do
            if grep -qi "^${header}:" "$production_headers"; then
              if grep -qi "^${header}:" "$preview_headers"; then
                echo "Security header preserved: ${header}" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "Preview is missing Production security header: ${header}" >&2
                missing=1
              fi
            fi
          done
          [[ "$missing" == "0" ]]
          echo 'Security-header presence is equivalent to or broader than current Production for the audited header set.' >> "$GITHUB_STEP_SUMMARY"
