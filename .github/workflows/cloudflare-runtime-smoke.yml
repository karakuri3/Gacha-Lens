name: Cloudflare runtime smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "worker/**"
      - "workers/public/**"
      - "scripts/build-public-worker.mjs"
      - "jsconfig.json"
      - "next.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "scripts/cloudflare-release-integrity.mjs"
      - "tests/cloudflare-release-integrity.test.mjs"
      - ".github/workflows/cloudflare-runtime-smoke.yml"
      - ".github/workflows/cloudflare-cache-proof.yml"
      - ".github/workflows/cloudflare-production-release-proof.yml"

permissions:
  contents: read
  checks: read

concurrency:
  group: cloudflare-runtime-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BROWSER_ACCEPT: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Resolve exact-head Cloudflare Preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$TARGET_SHA" ]] || {
            echo "Checkout SHA ${actual_sha} does not match target ${TARGET_SHA}." >&2
            exit 1
          }

          found='false'
          status=''
          conclusion=''
          check_id=''
          preview_url=''

          for attempt in $(seq 1 40); do
            payload="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100")"

            inspection="$(node scripts/cloudflare-release-integrity.mjs inspect-check "$TARGET_SHA" --require-preview <<<"$payload")"
            found="$(jq -r '.found' <<<"$inspection")"
            if [[ "$found" == 'true' ]]; then
              status="$(jq -r '.status // ""' <<<"$inspection")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$inspection")"
              check_id="$(jq -r '.check_id // ""' <<<"$inspection")"
              preview_url="$(jq -r '.preview_url // ""' <<<"$inspection")"
              if [[ "$status" == 'completed' ]]; then
                break
              fi
            fi

            echo "Cloudflare exact-head build not complete yet (attempt ${attempt}/40)." >> "$GITHUB_STEP_SUMMARY"
            sleep 15
          done

          [[ "$found" == 'true' ]] || {
            echo "No Cloudflare Workers check run found for exact head ${TARGET_SHA}." >&2
            exit 1
          }
          [[ "$status" == 'completed' ]] || {
            echo 'Cloudflare Workers check did not complete within the bounded wait.' >&2
            exit 1
          }
          [[ "$conclusion" == 'success' ]] || {
            echo "Cloudflare Workers exact-head build concluded ${conclusion:-unknown}." >&2
            exit 1
          }
          [[ -n "$preview_url" ]] || {
            echo 'Cloudflare check succeeded but did not expose one approved immutable exact-head deployment URL.' >&2
            exit 1
          }

          echo "PREVIEW_URL=${preview_url}" >> "$GITHUB_ENV"
          echo "Cloudflare check run: ${check_id}" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact source SHA: ${TARGET_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Immutable exact-head Preview URL: ${preview_url}" >> "$GITHUB_STEP_SUMMARY"

      - name: Prove Preview runtime source identity
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          headers="$(mktemp)"
          trap 'rm -f "$body" "$headers"' EXIT
          rc=0
          code="$(curl --silent --show-error --max-time 60 \
            -H 'Accept: application/json' \
            -H 'Cache-Control: no-cache' \
            --dump-header "$headers" \
            --output "$body" \
            --write-out '%{http_code}' \
            "${PREVIEW_URL}/api/runtime-diagnostics/release-source")" || rc=$?
          code="${code:-000}"
          [[ "$rc" == '0' && "$code" == '200' ]] || {
            echo "Preview source identity failed rc=${rc} HTTP ${code}." >&2
            cat "$body" >&2 || true
            exit 1
          }
          deployed_sha="$(node scripts/cloudflare-release-integrity.mjs read-source-sha < "$body")"
          [[ "$deployed_sha" == "$TARGET_SHA" ]] || {
            echo "Preview runtime SHA ${deployed_sha} does not match target ${TARGET_SHA}." >&2
            exit 1
          }
          cache_control="$(awk 'BEGIN{IGNORECASE=1} /^cache-control:/ {sub(/^[^:]*:[[:space:]]*/, ""); gsub("\r", ""); print; exit}' "$headers")"
          [[ "$cache_control" == *'no-store'* ]] || {
            echo "Preview release identity endpoint is missing no-store: ${cache_control:-none}." >&2
            exit 1
          }
          echo "Preview runtime source identity: ${deployed_sha}" >> "$GITHUB_STEP_SUMMARY"

      - name: A6 exact-head App parity acceptance without transient retries
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          get_once() {
            local name="$1"
            local path="$2"
            local expected="$3"
            local needle="${4:-}"
            local body="$tmp/${name}.body"
            local headers="$tmp/${name}.headers"
            local code
            code="$(curl --silent --show-error --compressed --max-time 60 -H "Accept: ${BROWSER_ACCEPT}" --dump-header "$headers" --output "$body" --write-out '%{http_code}' "${PREVIEW_URL}${path}")"
            [[ "$code" == "$expected" ]] || {
              echo "A6 ${name}: HTTP ${code}, expected ${expected}" >&2
              head -c 1200 "$body" >&2 || true
              exit 1
            }
            if [[ -n "$needle" ]]; then
              grep -Fq "$needle" "$body" || {
                echo "A6 ${name}: missing marker ${needle}" >&2
                exit 1
              }
            fi
            echo "A6 ${name}: HTTP ${code}" >> "$GITHUB_STEP_SUMMARY"
          }

          category='%E3%82%AC%E3%82%B7%E3%83%A3%E3%83%9D%E3%83%B3'
          brand='%E3%83%90%E3%83%B3%E3%83%80%E3%82%A4'
          franchise='%E3%82%B5%E3%83%B3%E3%83%AA%E3%82%AA%E3%82%AD%E3%83%A3%E3%83%A9%E3%82%AF%E3%82%BF%E3%83%BC%E3%82%BA'
          encoded_slug='tarts-y901096-%E3%83%87%E3%82%A3%E3%82%BA%E3%83%8B%E3%83%BC-%E3%83%9E%E3%83%AA%E3%83%BC'

          get_once ranking '/ranking' 200
          get_once ranking_series '/ranking/series' 200
          get_once ranking_upcoming '/ranking/upcoming' 200
          get_once ranking_upcoming_series '/ranking/upcoming/series' 200
          get_once stock '/stock' 200
          get_once restocks '/restocks' 200
          get_once favorites '/favorites' 200
          get_once categories '/categories' 200
          get_once category "/categories/${category}" 200
          get_once brands '/brands' 200
          get_once brand "/brands/${brand}" 200
          get_once franchises '/franchises' 200
          get_once franchise "/franchises/${franchise}" 200
          get_once guides '/guides' 200
          get_once guide_market '/guides/market-price' 200
          get_once guide_price '/guides/price-history' 200
          get_once guide_stock '/guides/stock-restock' 200
          get_once guide_forecast '/guides/forecast-ranking' 200
          get_once contact '/contact' 200
          get_once schedule_oct '/schedule?month=2026-10' 200 '2026-10'
          get_once public_stock '/api/public-stock' 200 '"rows"'
          get_once public_variants "/api/public-variants?ids=${encoded_slug}" 200
          get_once public_discovery "/api/public-discovery?type=category&name=${category}&page=1" 200
          get_once public_discovery_invalid '/api/public-discovery?type=invalid&name=x&page=1' 400
          get_once review '/review' 200 'Review access'
          get_once unknown '/__a6-unknown-route' 404
          get_once internal '/__public-data/v1/series' 404
          get_once manifest '/manifest.webmanifest' 200
          get_once logo '/brand/gacha-lens-logo.png' 200
          get_once mark '/brand/gacha-lens-mark.png' 200

          redirect_once() {
            local name="$1"
            local path="$2"
            local location_suffix="$3"
            local headers="$tmp/${name}.headers"
            local code location
            code="$(curl --silent --show-error --max-time 60 --output /dev/null --dump-header "$headers" --write-out '%{http_code}' "${PREVIEW_URL}${path}")"
            [[ "$code" == '308' ]] || { echo "A6 ${name}: HTTP ${code}, expected 308" >&2; exit 1; }
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); gsub("\r", ""); print; exit}' "$headers")"
            [[ "$location" == *"$location_suffix" ]] || { echo "A6 ${name}: unexpected Location ${location:-missing}" >&2; exit 1; }
            echo "A6 ${name}: 308 -> ${location}" >> "$GITHUB_STEP_SUMMARY"
          }

          redirect_once trends '/trends' '/ranking'
          redirect_once ranking_legacy '/ranking?tab=upcoming&scope=series' '/ranking/upcoming/series'
          redirect_once category_legacy "/categories/${category}?page=2" "/categories/${category}/page/2"
          redirect_once brand_legacy "/brands/${brand}?page=2" "/brands/${brand}/page/2"
          redirect_once franchise_legacy "/franchises/${franchise}?page=2" "/franchises/${franchise}/page/2"

          for path in '/' '/series' '/ranking' '/favorites'; do
            curl --silent --show-error --max-time 60 "${PREVIEW_URL}${path}" >> "$tmp/pages.html"
          done
          grep -Eo '(src|href)="(/_next/static/[^"?]+|/brand/[^"?]+|/manifest\.webmanifest)' "$tmp/pages.html" |
            sed -E 's/^(src|href)="//' |
            sort -u > "$tmp/assets.txt" || true

          while IFS= read -r asset; do
            [[ -n "$asset" ]] || continue
            code="$(curl --silent --show-error --max-time 60 --output /dev/null --write-out '%{http_code}' "${PREVIEW_URL}${asset}")"
            [[ "$code" == '200' || "$code" == '304' ]] || {
              echo "A6 asset crawl failed: ${asset} -> HTTP ${code}" >&2
              exit 1
            }
          done < "$tmp/assets.txt"

          asset_count="$(wc -l < "$tmp/assets.txt" | tr -d ' ')"
          echo "A6 same-origin asset crawl: ${asset_count} referenced assets, 0 unexpected failures" >> "$GITHUB_STEP_SUMMARY"
          echo 'A6 no-retry App route/query/API/static acceptance: PASS' >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke public runtime and boundaries
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          request_get() {
            local name="$1"
            local path="$2"
            local needle="${3:-}"
            local body="$tmp/${name}.body"
            local headers="$tmp/${name}.headers"
            local attempt rc code delay

            for attempt in $(seq 1 6); do
              rc=0
              code="$(curl --silent --show-error --compressed --location --max-time 90 \
                -H "Accept: ${BROWSER_ACCEPT}" \
                --dump-header "$headers" \
                --output "$body" \
                --write-out '%{http_code}' \
                "${PREVIEW_URL}${path}")" || rc=$?
              code="${code:-000}"

              if [[ "$rc" == "0" && "$code" == "200" ]]; then
                if [[ -n "$needle" ]] && ! grep -Fq "$needle" "$body"; then
                  echo "$name did not contain required marker: $needle" >&2
                  echo 'Bounded public HTML diagnostic (first 2000 bytes):' >&2
                  head -c 2000 "$body" >&2 || true
                  echo >&2
                  echo 'Bounded public HTML error signatures:' >&2
                  grep -Eo '商品情報を取得できません|一時的な通信エラー[^<]{0,160}|Data source[^<]{0,160}|Product data[^<]{0,160}|digest.{0,160}' "$body" | head -20 >&2 || true
                  echo 'Bounded public HTML diagnostic (last 6000 bytes):' >&2
                  tail -c 6000 "$body" >&2 || true
                  exit 1
                fi
                printf '%-24s HTTP 200 (attempt %s)\n' "$name" "$attempt" >> "$GITHUB_STEP_SUMMARY"
                return 0
              fi

              if [[ "$attempt" -lt 6 ]]; then
                case "$code" in
                  000|429|500|502|503|504)
                    delay=$((attempt * 3))
                    echo "$name transient failure rc=$rc HTTP $code on attempt $attempt; retrying after ${delay}s" | tee -a "$GITHUB_STEP_SUMMARY"
                    sleep "$delay"
                    continue
                    ;;
                esac
              fi

              echo "$name failed rc=$rc HTTP $code on attempt $attempt" >&2
              head -c 1000 "$body" >&2 || true
              exit 1
            done
          }

          encoded_slug='tarts-y901096-%E3%83%87%E3%82%A3%E3%82%BA%E3%83%8B%E3%83%BC-%E3%83%9E%E3%83%AA%E3%83%BC'
          product_path="/series/${encoded_slug}"
          category_path='/categories/%E3%82%AC%E3%82%B7%E3%83%A3%E3%83%9D%E3%83%B3'
          brand_path='/brands/%E3%83%90%E3%83%B3%E3%83%80%E3%82%A4'
          franchise_path='/franchises/%E3%82%B5%E3%83%B3%E3%83%AA%E3%82%AA%E3%82%AD%E3%83%A3%E3%83%A9%E3%82%AF%E3%82%BF%E3%83%BC%E3%82%BA'

          request_get product_1 "$product_path" 'ディズニー マリー'
          request_get product_2 "$product_path" 'ディズニー マリー'
          request_get product_3 "$product_path" 'ディズニー マリー'

          request_get home '/' 'Gacha Lens'
          request_get series '/series' 'ガチャ一覧'
          request_get categories '/categories' 'カテゴリから探す'
          request_get brands '/brands'
          request_get franchises '/franchises'
          request_get category_detail "$category_path" 'ガシャポン'
          request_get category_api '/api/public-discovery?type=category&name=%E3%82%AC%E3%82%B7%E3%83%A3%E3%83%9D%E3%83%B3&page=1' 'ガシャポン'
          request_get brand_detail "$brand_path" 'バンダイ'
          request_get brand_api '/api/public-discovery?type=brand&name=%E3%83%90%E3%83%B3%E3%83%80%E3%82%A4&page=1' 'バンダイ'
          request_get franchise_detail "$franchise_path" 'サンリオキャラクターズ'
          request_get franchise_api '/api/public-discovery?type=franchise&name=%E3%82%B5%E3%83%B3%E3%83%AA%E3%82%AA%E3%82%AD%E3%83%A3%E3%83%A9%E3%82%AF%E3%82%BF%E3%83%BC%E3%82%BA&page=1' 'サンリオキャラクターズ'
          request_get catalog_search '/series?q=%E3%83%9E%E3%83%AA%E3%83%BC' 'マリー'
          request_get restocks '/restocks'
          request_get stock '/stock'
          request_get stock_query '/stock?q=%E3%83%9E%E3%83%AA%E3%83%BC' '在庫目撃情報'
          request_get public_stock_api '/api/public-stock' '"rows"'
          request_get schedule '/schedule'
          request_get guides '/guides'
          request_get public_api "/api/public-variants?ids=${encoded_slug}" 'tarts-y901096-ディズニー-マリー'
          request_get review '/review' 'Review access'
          request_get robots '/robots.txt' 'Sitemap: https://gachalens.com/sitemap.xml'
          request_get sitemap '/sitemap.xml' '<loc>https://gachalens.com/'
          request_get series_sitemap '/series-sitemap.xml' '<loc>https://gachalens.com/series/group/'
          request_get variant_sitemap '/variant-sitemap.xml' '<sitemapindex'
          request_get variant_sitemap_shard '/variant-sitemap/1' '<loc>https://gachalens.com/series/'
          grep -Fq '<loc>https://gachalens.com/variant-sitemap/1</loc>' "$tmp/variant_sitemap.body" || {
            echo 'Variant sitemap index did not publish shard 1.' >&2
            exit 1
          }

          grep -Fq 'https://gachalens.com/series/' "$tmp/product_1.body" || {
            echo 'Product detail canonical/site metadata did not point at gachalens.com.' >&2
            exit 1
          }

          echo 'Edge-cache policy/HIT semantics are enforced by the separate exact-head Cloudflare cache proof workflow.' >> "$GITHUB_STEP_SUMMARY"

          invalid_variant_shard_code=''
          for attempt in $(seq 1 6); do
            rc=0
            invalid_variant_shard_code="$(curl --silent --show-error --max-time 60 --output "$tmp/variant-sitemap-invalid.body" --write-out '%{http_code}' "${PREVIEW_URL}/variant-sitemap/5001")" || rc=$?
            invalid_variant_shard_code="${invalid_variant_shard_code:-000}"
            if [[ "$rc" == '0' && "$invalid_variant_shard_code" == '404' ]]; then break; fi
            if [[ "$attempt" -lt 6 ]]; then
              case "$invalid_variant_shard_code" in
                000|429|500|502|503|504)
                  delay=$((attempt * 3))
                  echo "variant-sitemap-invalid transient failure rc=$rc HTTP $invalid_variant_shard_code on attempt $attempt; retrying after ${delay}s" >> "$GITHUB_STEP_SUMMARY"
                  sleep "$delay"
                  continue
                  ;;
              esac
            fi
            echo "Out-of-range variant sitemap shard returned rc=$rc HTTP $invalid_variant_shard_code, expected 404" >&2
            exit 1
          done
          [[ "$invalid_variant_shard_code" == "404" ]] || {
            echo "Out-of-range variant sitemap shard returned $invalid_variant_shard_code, expected 404" >&2
            exit 1
          }
          echo 'Out-of-range variant sitemap shard boundary: HTTP 404' >> "$GITHUB_STEP_SUMMARY"

          review_code="$(curl --silent --show-error --max-time 60 --output "$tmp/review-post.body" --write-out '%{http_code}' -X POST -H "Origin: ${PREVIEW_URL}" -H 'Content-Type: application/x-www-form-urlencoded' --data 'decision=approved' "${PREVIEW_URL}/api/review/community-reports/runtime-smoke-nonexistent")"
          [[ "$review_code" == "401" ]] || { echo "Unauthenticated review mutation returned $review_code, expected 401" >&2; exit 1; }

          ingest_code="$(curl --silent --show-error --max-time 60 --output "$tmp/ingest.body" --write-out '%{http_code}' -X POST "${PREVIEW_URL}/api/ingest/all")"
          [[ "$ingest_code" == "401" ]] || { echo "Unauthenticated ingest returned $ingest_code, expected 401" >&2; exit 1; }

          login_code="$(curl --silent --show-error --max-time 60 --output /dev/null --write-out '%{http_code}' -X POST -H 'Content-Type: application/x-www-form-urlencoded' --data 'token=runtime-smoke-invalid-token' "${PREVIEW_URL}/review/login")"
          [[ "$login_code" == "303" ]] || { echo "Invalid review login returned $login_code, expected 303" >&2; exit 1; }

          echo 'Review/admin unauthenticated mutation boundary: HTTP 401' >> "$GITHUB_STEP_SUMMARY"
          echo 'Ingest unauthenticated boundary: HTTP 401; authorized path is code-pinned to HTTP 410/GitHub Actions.' >> "$GITHUB_STEP_SUMMARY"

      - name: Compare security-header coverage with current Production
        shell: bash
        run: |
          set -euo pipefail
          preview_headers="$(mktemp)"
          production_headers="$(mktemp)"
          trap 'rm -f "$preview_headers" "$production_headers"' EXIT
          curl --silent --show-error --max-time 60 --output /dev/null --dump-header "$preview_headers" "${PREVIEW_URL}/"
          curl --silent --show-error --max-time 60 --output /dev/null --dump-header "$production_headers" 'https://gachalens.com/'

          missing=0
          for header in strict-transport-security x-content-type-options x-frame-options referrer-policy content-security-policy permissions-policy; do
            if grep -qi "^${header}:" "$production_headers"; then
              if grep -qi "^${header}:" "$preview_headers"; then
                echo "Security header preserved: ${header}" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "Preview is missing Production security header: ${header}" >&2
                missing=1
              fi
            fi
          done
          [[ "$missing" == "0" ]]
          echo 'Security-header presence is equivalent to or broader than current Production for the audited header set.' >> "$GITHUB_STEP_SUMMARY"


  exact-head-public-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Resolve exact-head Cloudflare Public Preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$TARGET_SHA" ]] || {
            echo "Checkout SHA ${actual_sha} does not match target ${TARGET_SHA}." >&2
            exit 1
          }

          found='false'
          status=''
          conclusion=''
          check_id=''
          preview_url=''

          for attempt in $(seq 1 40); do
            payload="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100")"

            inspection="$(node scripts/cloudflare-release-integrity.mjs inspect-check "$TARGET_SHA" --public <<<"$payload")"
            found="$(jq -r '.found' <<<"$inspection")"
            if [[ "$found" == 'true' ]]; then
              status="$(jq -r '.status // ""' <<<"$inspection")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$inspection")"
              check_id="$(jq -r '.check_id // ""' <<<"$inspection")"
              preview_url="$(jq -r '.preview_url // ""' <<<"$inspection")"
              if [[ "$status" == 'completed' && -n "$preview_url" ]]; then
                break
              fi
            fi

            echo "Cloudflare Public exact-head build not complete yet (attempt ${attempt}/40)." >> "$GITHUB_STEP_SUMMARY"
            sleep 15
          done

          [[ "$found" == 'true' ]] || {
            echo "No gacha-lens-public Cloudflare check run found for exact head ${TARGET_SHA}." >&2
            exit 1
          }
          [[ "$status" == 'completed' ]] || {
            echo 'gacha-lens-public Cloudflare check did not complete within the bounded wait.' >&2
            exit 1
          }
          [[ "$conclusion" == 'success' ]] || {
            echo "gacha-lens-public exact-head build concluded ${conclusion:-unknown}." >&2
            exit 1
          }
          [[ -n "$preview_url" ]] || {
            echo 'gacha-lens-public check succeeded but did not expose one approved immutable Version URL.' >&2
            exit 1
          }

          echo "PUBLIC_PREVIEW_URL=${preview_url}" >> "$GITHUB_ENV"
          echo "Public Cloudflare check run: ${check_id}" >> "$GITHUB_STEP_SUMMARY"
          echo "Public exact source SHA: ${TARGET_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Public immutable Version URL: ${preview_url}" >> "$GITHUB_STEP_SUMMARY"

      - name: Prove Public Preview runtime source identity
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          headers="$(mktemp)"
          trap 'rm -f "$body" "$headers"' EXIT

          rc=0
          code="$(curl --silent --show-error --max-time 60 \
            -H 'Accept: application/json' \
            -H 'Cache-Control: no-cache' \
            --dump-header "$headers" \
            --output "$body" \
            --write-out '%{http_code}' \
            "${PUBLIC_PREVIEW_URL}/api/runtime-diagnostics/release-source")" || rc=$?
          code="${code:-000}"

          [[ "$rc" == '0' && "$code" == '200' ]] || {
            echo "Public Preview source identity failed rc=${rc} HTTP ${code}." >&2
            cat "$body" >&2 || true
            exit 1
          }

          deployed_sha="$(node scripts/cloudflare-release-integrity.mjs read-source-sha < "$body")"
          [[ "$deployed_sha" == "$TARGET_SHA" ]] || {
            echo "Public Preview runtime SHA ${deployed_sha} does not match target ${TARGET_SHA}." >&2
            exit 1
          }

          plane="$(jq -r '.plane // ""' < "$body")"
          [[ "$plane" == 'public' ]] || {
            echo "Public Preview release-source plane is ${plane:-missing}, expected public." >&2
            exit 1
          }

          cache_control="$(awk 'BEGIN{IGNORECASE=1} /^cache-control:/ {sub(/^[^:]*:[[:space:]]*/, ""); gsub("\r", ""); print; exit}' "$headers")"
          [[ "$cache_control" == *'no-store'* ]] || {
            echo "Public Preview release identity endpoint is missing no-store: ${cache_control:-none}." >&2
            exit 1
          }

          echo "Public Preview runtime source identity: ${deployed_sha}" >> "$GITHUB_STEP_SUMMARY"
          echo "Public Preview plane: ${plane}" >> "$GITHUB_STEP_SUMMARY"

      - name: Prove Public document plane cold and warm on exact-head Preview
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          request_public_document() {
            local pass="$1"
            local name="$2"
            local path="$3"
            local needle="$4"
            local body="$tmp/${pass}-${name}.body"
            local headers="$tmp/${pass}-${name}.headers"
            local metrics code content_type plane canonical

            metrics="$(curl --silent --show-error --max-time 60 \
              -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,text/plain;q=0.8,*/*;q=0.7' \
              --dump-header "$headers" \
              --output "$body" \
              --write-out '%{http_code} %{time_total}' \
              "${PUBLIC_PREVIEW_URL}${path}")"
            code="${metrics%% *}"

            [[ "$code" == '200' ]] || {
              echo "${pass} ${name} returned HTTP ${code}, expected 200." >&2
              head -c 1500 "$body" >&2 || true
              exit 1
            }
            grep -Fq "$needle" "$body" || {
              echo "${pass} ${name} is missing marker: ${needle}" >&2
              head -c 1500 "$body" >&2 || true
              exit 1
            }

            plane="$(awk 'BEGIN{IGNORECASE=1} /^x-gacha-public-plane:/ {sub(/^[^:]*:[[:space:]]*/, ""); gsub("\r", ""); print; exit}' "$headers")"
            [[ "$plane" == 'phase-a3' ]] || {
              echo "${pass} ${name} did not execute on the Phase A3 Public plane: ${plane:-missing}" >&2
              exit 1
            }

            content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {sub(/^[^:]*:[[:space:]]*/, ""); gsub("\r", ""); print; exit}' "$headers")"
            echo "${pass} ${name}: HTTP ${code}; time_total=${metrics#* }; content-type=${content_type}" >> "$GITHUB_STEP_SUMMARY"

            if [[ "$content_type" == text/html* ]]; then
              grep -Fq '<link rel="canonical"' "$body" || {
                echo "${pass} ${name} HTML is missing canonical metadata." >&2
                exit 1
              }
              grep -Fq '<meta name="description"' "$body" || {
                echo "${pass} ${name} HTML is missing description metadata." >&2
                exit 1
              }
              canonical="$(grep -Eo '<link rel="canonical" href="[^"]+"' "$body" | head -1 | sed -E 's/.*href="([^"]+)"/\1/')"
              [[ "$canonical" == https://gachalens.com/* ]] || {
                echo "${pass} ${name} canonical escaped production origin: ${canonical:-missing}" >&2
                exit 1
              }
            fi
          }

          integrity_body="$tmp/app-integrity.body"
          integrity_code="$(curl --silent --show-error --max-time 60 --output "$integrity_body" --write-out '%{http_code}' "${PUBLIC_PREVIEW_URL}/api/runtime-diagnostics/app-delegation")"
          if [[ "$integrity_code" == '200' ]]; then
            echo 'PUBLIC_APP_SHA_MATCH=true' >> "$GITHUB_ENV"
            routes=(
              'home|/|Gacha Lens'
              'series|/series|ガチャ一覧'
              'schedule|/schedule?month=2026-10|2026-10'
              'privacy|/privacy|プライバシーポリシー'
              'terms|/terms|利用規約'
              'disclaimer|/disclaimer|免責事項'
              'affiliate|/affiliate-disclosure|広告・アフィリエイトについて'
              'operator|/operator|運営情報'
              'robots|/robots.txt|Sitemap: https://gachalens.com/sitemap.xml'
              'sitemap|/sitemap.xml|<loc>https://gachalens.com/'
              'series_sitemap|/series-sitemap.xml|<loc>https://gachalens.com/series/'
              'variant_sitemap|/variant-sitemap.xml|<sitemapindex'
            )

            for pass in cold warm; do
              for spec in "${routes[@]}"; do
                IFS='|' read -r name path needle <<<"$spec"
                request_public_document "$pass" "$name" "$path" "$needle"
              done

              series_detail_path="$(grep -Eo 'href="/series/group/[^"]+"' "$tmp/${pass}-series.body" | head -1 | sed -E 's/^href="([^"]+)"/\1/')"
              [[ -n "$series_detail_path" ]] || {
                echo "${pass} delegated series index did not expose a parent-series detail link." >&2
                exit 1
              }
              request_public_document "$pass" series_detail "$series_detail_path" '<article><h1'
            done
          elif [[ "$integrity_code" == '409' ]] && grep -Fq '"error":"mixed_source_sha"' "$integrity_body"; then
            echo 'PUBLIC_APP_SHA_MATCH=false' >> "$GITHUB_ENV"
            echo 'Public Preview binding points at a different App SHA; exact-head data-backed documents must fail closed with 409.' >> "$GITHUB_STEP_SUMMARY"

            static_routes=(
              'robots|/robots.txt|Sitemap: https://gachalens.com/sitemap.xml'
            )
            for pass in cold warm; do
              for spec in "${static_routes[@]}"; do
                IFS='|' read -r name path needle <<<"$spec"
                request_public_document "$pass" "$name" "$path" "$needle"
              done
              for path in '/' '/series' '/schedule?month=2026-10' '/privacy' '/terms' '/disclaimer' '/affiliate-disclosure' '/operator' '/ranking' '/api/public-stock' '/manifest.webmanifest' '/sitemap.xml' '/series-sitemap.xml' '/variant-sitemap.xml'; do
                body="$tmp/${pass}-mixed.body"
                code="$(curl --silent --show-error --max-time 60 --output "$body" --write-out '%{http_code}' "${PUBLIC_PREVIEW_URL}${path}")"
                [[ "$code" == '409' ]] || {
                  echo "${pass} mixed-SHA data-backed route ${path} returned HTTP ${code}, expected 409." >&2
                  head -c 1200 "$body" >&2 || true
                  exit 1
                }
                grep -Fq '"error":"mixed_source_sha"' "$body" || {
                  echo "${pass} mixed-SHA route ${path} did not fail with mixed_source_sha." >&2
                  exit 1
                }
              done
            done
          else
            echo "Public Preview App integrity diagnostic returned HTTP ${integrity_code}, expected 200 or fail-closed 409." >&2
            cat "$integrity_body" >&2 || true
            exit 1
          fi

          if grep -R -E 'HTTP (429|500|502|503|504)' "$GITHUB_STEP_SUMMARY" >/dev/null 2>&1; then
            echo 'Public document proof observed a transient/resource-limit HTTP failure.' >&2
            exit 1
          fi

      - name: Audit Public Preview SEO and discovery semantics against current Production
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          if [[ "${PUBLIC_APP_SHA_MATCH:-}" != 'true' ]]; then
            echo 'Public SEO parity audit deferred: immutable Public Preview correctly fails closed because its live Service Binding App SHA differs from the PR SHA; same-SHA behavior is covered by local exact-head Service Binding proof.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          compare_canonical() {
            local name="$1"
            local path="$2"
            local preview="$tmp/${name}.preview"
            local production="$tmp/${name}.production"

            curl --fail --silent --show-error --max-time 60 -H 'Accept: text/html' "${PUBLIC_PREVIEW_URL}${path}" > "$preview"
            curl --fail --silent --show-error --max-time 60 -H 'Accept: text/html' "https://gachalens.com${path}" > "$production"

            local preview_canonical production_canonical
            preview_canonical="$(grep -Eo '<link rel="canonical" href="[^"]+"' "$preview" | head -1 | sed -E 's/.*href="([^"]+)"/\1/')"
            production_canonical="$(grep -Eo '<link rel="canonical" href="[^"]+"' "$production" | head -1 | sed -E 's/.*href="([^"]+)"/\1/')"

            preview_canonical_normalized="${preview_canonical%/}"
            production_canonical_normalized="${production_canonical%/}"
            [[ -n "$preview_canonical" && "$preview_canonical_normalized" == "$production_canonical_normalized" ]] || {
              echo "${name} canonical mismatch: Public=${preview_canonical:-missing}; Production=${production_canonical:-missing}" >&2
              exit 1
            }
            grep -Fq '<meta name="description"' "$preview" || { echo "${name} Public HTML missing description." >&2; exit 1; }
            grep -Fq '<h1' "$preview" || { echo "${name} Public HTML missing primary heading." >&2; exit 1; }
            ! grep -Fq 'noindex' "$preview" || { echo "${name} Public HTML unexpectedly contains noindex." >&2; exit 1; }
            echo "${name}: canonical parity ${preview_canonical}; indexable HTML semantics preserved." >> "$GITHUB_STEP_SUMMARY"
          }

          compare_canonical home '/'
          compare_canonical series '/series'
          compare_canonical schedule '/schedule?month=2026-10'

          curl --fail --silent --show-error --max-time 60 -H 'Accept: text/html' "${PUBLIC_PREVIEW_URL}/series" > "$tmp/series-for-detail"
          series_detail_path="$(grep -Eo 'href="/series/group/[^"]+"' "$tmp/series-for-detail" | head -1 | sed -E 's/^href="([^"]+)"/\1/')"
          [[ -n "$series_detail_path" ]] || {
            echo 'Public series index did not expose a parent-series detail for parity audit.' >&2
            exit 1
          }
          compare_canonical series_detail "$series_detail_path"

          curl --fail --silent --show-error --max-time 60 "${PUBLIC_PREVIEW_URL}/robots.txt" > "$tmp/robots.preview"
          curl --fail --silent --show-error --max-time 60 'https://gachalens.com/robots.txt' > "$tmp/robots.production"
          for directive in \
            'Disallow: /api/' \
            'Disallow: /review/' \
            'Disallow: /supabase-series' \
            'Sitemap: https://gachalens.com/sitemap.xml' \
            'Sitemap: https://gachalens.com/series-sitemap.xml' \
            'Sitemap: https://gachalens.com/variant-sitemap.xml' \
            'Host: https://gachalens.com/'; do
            grep -Fq "$directive" "$tmp/robots.preview" || { echo "Public robots missing: $directive" >&2; exit 1; }
            grep -Fq "$directive" "$tmp/robots.production" || { echo "Production robots baseline missing: $directive" >&2; exit 1; }
          done

          for path in /sitemap.xml /series-sitemap.xml /variant-sitemap.xml; do
            preview_code="$(curl --silent --show-error --max-time 60 --output "$tmp/preview-sitemap" --write-out '%{http_code}' "${PUBLIC_PREVIEW_URL}${path}")"
            production_code="$(curl --silent --show-error --max-time 60 --output "$tmp/production-sitemap" --write-out '%{http_code}' "https://gachalens.com${path}")"
            [[ "$preview_code" == '200' && "$production_code" == '200' ]] || {
              echo "Sitemap status mismatch on ${path}: Public=${preview_code}; Production=${production_code}" >&2
              exit 1
            }
            grep -Fq 'https://gachalens.com/' "$tmp/preview-sitemap" || { echo "Public sitemap ${path} escaped canonical origin." >&2; exit 1; }
            echo "${path}: Public/Production HTTP 200 and canonical gachalens.com origin preserved." >> "$GITHUB_STEP_SUMMARY"
          done

          echo 'Robots directives and sitemap/canonical meaning preserved relative to current Production.' >> "$GITHUB_STEP_SUMMARY"

      - name: Prove bootstrap route boundary
        shell: bash
        run: |
          set -euo pipefail

          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT

          code="$(curl --silent --show-error --max-time 60 \
            -H 'Accept: application/json' \
            --output "$body" \
            --write-out '%{http_code}' \
            "${PUBLIC_PREVIEW_URL}/__public-bootstrap-unknown")"

          [[ "$code" == '404' ]] || {
            echo "Unknown Public bootstrap route returned HTTP ${code}, expected 404." >&2
            cat "$body" >&2 || true
            exit 1
          }

          error="$(jq -r '.error // ""' < "$body")"
          [[ "$error" == 'route_not_owned_by_public_bootstrap' ]] || {
            echo "Unknown Public bootstrap route returned unexpected error: ${error:-missing}." >&2
            exit 1
          }

          echo 'Unknown Public bootstrap route: fail-closed HTTP 404' >> "$GITHUB_STEP_SUMMARY"
