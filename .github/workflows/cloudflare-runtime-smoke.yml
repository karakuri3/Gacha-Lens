name: Cloudflare runtime smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "worker/**"
      - "next.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloudflare-runtime-smoke.yml"
      - ".github/workflows/cloudflare-cache-proof.yml"

permissions:
  contents: read

# Runtime smoke and cache proof share one isolated Worker/Supabase preview.
# Keep them serial: this is a correctness gate, not a synthetic load test.
concurrency:
  group: cloudflare-live-preview-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  exact-head-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Cloudflare Workers Builds proved this immutable version was built from
      # DEPLOYED_SHA. Following workflow-only commits are permitted only when
      # the runtime source set is byte-equivalent to that deployed commit.
      DEPLOYED_SHA: e72087932172520b07282acf8428cc11adcb1790
      PREVIEW_URL: https://323412c6-gacha-lens.senpingxingzuo.workers.dev
    steps:
      - name: Checkout current pull-request head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prove runtime sources match deployed Cloudflare build
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${DEPLOYED_SHA}^{commit}"
          changed="$(git diff --name-only "$DEPLOYED_SHA" HEAD -- app components lib worker next.config.mjs package.json package-lock.json)"
          if [[ -n "$changed" ]]; then
            echo 'Runtime source drift exists after the pinned Cloudflare deployment:' >&2
            echo "$changed" >&2
            exit 1
          fi
          echo "Runtime source tree is byte-equivalent to deployed Cloudflare commit ${DEPLOYED_SHA}." >> "$GITHUB_STEP_SUMMARY"
          echo "Preview URL: ${PREVIEW_URL}" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke public runtime and boundaries
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          check_get() {
            local name="$1"
            local path="$2"
            local needle="${3:-}"
            local body="$tmp/${name}.body"
            local headers="$tmp/${name}.headers"
            local code=""

            for attempt in 1 2 3; do
              code="$(curl --silent --show-error --location --max-time 90 --dump-header "$headers" --output "$body" --write-out '%{http_code}' "${PREVIEW_URL}${path}")"
              if [[ "$code" == "200" ]]; then
                break
              fi

              case "$code" in
                429|500|502|503|504)
                  if [[ "$attempt" -lt 3 ]]; then
                    delay=$((attempt * 2))
                    echo "$name transient HTTP $code on attempt $attempt; retrying after ${delay}s" | tee -a "$GITHUB_STEP_SUMMARY"
                    sleep "$delay"
                    ;;
                  else
                    echo "$name returned transient HTTP $code after $attempt attempts" >&2
                  fi
                  ;;
                *)
                  echo "$name returned HTTP $code" >&2
                  head -c 1000 "$body" >&2 || true
                  exit 1
                  ;;
              esac
            done

            if [[ "$code" != "200" ]]; then
              head -c 1000 "$body" >&2 || true
              exit 1
            fi
            if [[ -n "$needle" ]] && ! grep -Fq "$needle" "$body"; then
              echo "$name did not contain required marker: $needle" >&2
              exit 1
            fi
            printf '%-24s HTTP 200\n' "$name" >> "$GITHUB_STEP_SUMMARY"
            sleep 1
          }

          encoded_slug='tarts-y901096-%E3%83%87%E3%82%A3%E3%82%BA%E3%83%8B%E3%83%BC-%E3%83%9E%E3%83%AA%E3%83%BC'
          product_path="/series/${encoded_slug}"

          # Repeat a production-shaped HTML detail request. Dedicated cache-proof
          # CI separately asserts MISS -> HIT -> HIT at this exact runtime.
          for n in 1 2 3; do
            metrics="$(curl --silent --show-error --max-time 90 -H 'Accept: text/html' --output "$tmp/product-${n}.body" --write-out '%{http_code} %{time_total}' "${PREVIEW_URL}${product_path}")"
            code="${metrics%% *}"
            [[ "$code" == "200" ]] || { echo "product detail attempt $n returned $code" >&2; exit 1; }
            grep -Fq 'ディズニー マリー' "$tmp/product-${n}.body" || { echo 'Japanese-slug product marker missing' >&2; exit 1; }
            echo "Product detail attempt ${n}: ${metrics}" >> "$GITHUB_STEP_SUMMARY"
          done

          check_get home '/' 'Gacha Lens'
          check_get series '/series' 'ガチャ一覧'
          check_get catalog_search '/series?q=%E3%83%9E%E3%83%AA%E3%83%BC' 'マリー'
          check_get ranking '/ranking'
          check_get restocks '/restocks'
          check_get stock '/stock'
          check_get schedule '/schedule'
          check_get guides '/guides'
          check_get public_api "/api/public-variants?ids=${encoded_slug}" 'tarts-y901096-ディズニー-マリー'
          check_get review '/review' 'Review access'
          check_get robots '/robots.txt' 'Sitemap: https://gachalens.com/sitemap.xml'
          check_get sitemap '/sitemap.xml' '<loc>https://gachalens.com/'
          check_get series_sitemap '/series-sitemap.xml' '<loc>https://gachalens.com/series/group/'
          check_get variant_sitemap '/variant-sitemap.xml' '<loc>https://gachalens.com/series/'

          grep -Fq 'https://gachalens.com/series/' "$tmp/product-1.body" || {
            echo 'Product detail canonical/site metadata did not point at gachalens.com.' >&2
            exit 1
          }

          # Public high-read pages and sitemap outputs must advertise the
          # Cloudflare edge policy so warm traffic does not re-enter Supabase.
          for name in home series ranking restocks stock schedule guides; do
            grep -qi '^x-gacha-edge-cache-policy: public-document-120-v1' "$tmp/${name}.headers" || {
              echo "$name is missing public document edge-cache policy" >&2
              exit 1
            }
          done
          for name in robots sitemap series_sitemap variant_sitemap; do
            grep -qi '^x-gacha-edge-cache-policy: public-sitemap-86400-v1' "$tmp/${name}.headers" || {
              echo "$name is missing public sitemap edge-cache policy" >&2
              exit 1
            }
          done

          # A second request at the same POP must be served from edge cache for
          # representative expensive public routes.
          for spec in 'ranking:/ranking' 'restocks:/restocks' 'series_sitemap:/series-sitemap.xml'; do
            name="${spec%%:*}"
            path="${spec#*:}"
            headers="$tmp/${name}-warm.headers"
            code="$(curl --silent --show-error --max-time 90 --dump-header "$headers" --output /dev/null --write-out '%{http_code}' "${PREVIEW_URL}${path}")"
            [[ "$code" == "200" ]] || { echo "$name warm request returned $code" >&2; exit 1; }
            cf_status="$(awk 'BEGIN{IGNORECASE=1} /^cf-cache-status:/ {gsub("\r", ""); print $2; exit}' "$headers")"
            [[ "$cf_status" == "HIT" ]] || { echo "$name warm request was ${cf_status:-none}, expected HIT" >&2; exit 1; }
            echo "$name warm edge cache: HIT" >> "$GITHUB_STEP_SUMMARY"
          done

          # Privileged write boundaries: no cookie/token must never reach data mutation.
          review_code="$(curl --silent --show-error --max-time 60 --output "$tmp/review-post.body" --write-out '%{http_code}' -X POST -H "Origin: ${PREVIEW_URL}" -H 'Content-Type: application/x-www-form-urlencoded' --data 'decision=approved' "${PREVIEW_URL}/api/review/community-reports/runtime-smoke-nonexistent")"
          [[ "$review_code" == "401" ]] || { echo "Unauthenticated review mutation returned $review_code, expected 401" >&2; exit 1; }

          ingest_code="$(curl --silent --show-error --max-time 60 --output "$tmp/ingest.body" --write-out '%{http_code}' -X POST "${PREVIEW_URL}/api/ingest/all")"
          [[ "$ingest_code" == "401" ]] || { echo "Unauthenticated ingest returned $ingest_code, expected 401" >&2; exit 1; }

          login_code="$(curl --silent --show-error --max-time 60 --output /dev/null --write-out '%{http_code}' -X POST -H 'Content-Type: application/x-www-form-urlencoded' --data 'token=runtime-smoke-invalid-token' "${PREVIEW_URL}/review/login")"
          [[ "$login_code" == "303" ]] || { echo "Invalid review login returned $login_code, expected 303" >&2; exit 1; }

          echo 'Review/admin unauthenticated mutation boundary: HTTP 401' >> "$GITHUB_STEP_SUMMARY"
          echo 'Ingest unauthenticated boundary: HTTP 401; authorized path is code-pinned to HTTP 410/GitHub Actions.' >> "$GITHUB_STEP_SUMMARY"

      - name: Compare security-header coverage with current Production
        shell: bash
        run: |
          set -euo pipefail
          preview_headers="$(mktemp)"
          production_headers="$(mktemp)"
          trap 'rm -f "$preview_headers" "$production_headers"' EXIT
          curl --silent --show-error --max-time 60 --output /dev/null --dump-header "$preview_headers" "${PREVIEW_URL}/"
          curl --silent --show-error --max-time 60 --output /dev/null --dump-header "$production_headers" 'https://gachalens.com/'

          missing=0
          for header in strict-transport-security x-content-type-options x-frame-options referrer-policy content-security-policy permissions-policy; do
            if grep -qi "^${header}:" "$production_headers"; then
              if grep -qi "^${header}:" "$preview_headers"; then
                echo "Security header preserved: ${header}" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "Preview is missing Production security header: ${header}" >&2
                missing=1
              fi
            fi
          done
          [[ "$missing" == "0" ]]
          echo 'Security-header presence is equivalent to or broader than current Production for the audited header set.' >> "$GITHUB_STEP_SUMMARY"
