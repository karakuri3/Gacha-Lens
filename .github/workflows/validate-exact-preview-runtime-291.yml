name: Validate exact #291 Preview runtime

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-exact-preview-runtime-291.yml"

permissions:
  contents: read

jobs:
  exact-preview-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_URL: https://d88ef767-gacha-lens.senpingxingzuo.workers.dev
      PRODUCTION_URL: https://gachalens.com
      BROWSER_ACCEPT: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
    steps:
      - name: Checkout validation-only workflow
        uses: actions/checkout@v7

      - name: Smoke exact #291 Preview runtime, cache, and boundaries
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          get() {
            local name="$1" path="$2" needle="${3:-}"
            local body="$tmp/$name.body" headers="$tmp/$name.headers"
            local code
            code="$(curl --silent --show-error --location --max-time 90 \
              -H "Accept: ${BROWSER_ACCEPT}" \
              --dump-header "$headers" --output "$body" --write-out '%{http_code}' \
              "${PREVIEW_URL}${path}")"
            [[ "$code" == "200" ]] || { echo "$name HTTP $code" >&2; head -c 1200 "$body" >&2 || true; exit 1; }
            if [[ -n "$needle" ]]; then grep -Fq "$needle" "$body" || { echo "$name missing marker $needle" >&2; exit 1; }; fi
            if grep -Eq '商品情報を取得できません|一時的な通信エラー' "$body"; then
              echo "$name contains public data-error signature" >&2
              exit 1
            fi
          }

          edge_policy() { awk 'BEGIN{IGNORECASE=1} /^x-gacha-edge-cache-policy:/ {gsub("\r", ""); print $2; exit}' "$tmp/$1.headers"; }
          cf_status() { awk 'BEGIN{IGNORECASE=1} /^cf-cache-status:/ {gsub("\r", ""); print $2; exit}' "$tmp/$1.headers"; }

          get home '/' 'Gacha Lens'
          get series '/series' 'ガチャ一覧'
          get group '/series/group/tarts-y901096' 'ディズニーキャラクター Pretty Faceポーチ'
          get product '/series/tarts-y901096-%E3%83%87%E3%82%A3%E3%82%BA%E3%83%8B%E3%83%BC-%E3%83%9E%E3%83%AA%E3%83%BC' 'ディズニー マリー'
          get categories '/categories' 'カテゴリから探す'
          get api '/api/public-variants?ids=tarts-y901096-%E3%83%87%E3%82%A3%E3%82%BA%E3%83%8B%E3%83%BC-%E3%83%9E%E3%83%AA%E3%83%BC' 'tarts-y901096-ディズニー-マリー'

          [[ "$(edge_policy home)" == 'public-document-120-v1' ]]
          [[ "$(edge_policy series)" == 'discovery-document-1800-v1' ]]
          [[ "$(edge_policy group)" == 'series-detail-1800-v1' ]]
          [[ "$(edge_policy product)" == 'series-detail-1800-v1' ]]
          [[ "$(edge_policy categories)" == 'discovery-index-86400-v1' ]]

          get series_warm '/series' 'ガチャ一覧'
          get group_warm '/series/group/tarts-y901096' 'ディズニーキャラクター Pretty Faceポーチ'
          for name in series_warm group_warm; do
            status="$(cf_status "$name")"
            case "$status" in HIT|STALE) ;; *) echo "$name cache status ${status:-none}, expected HIT/STALE" >&2; exit 1;; esac
          done

          review_code="$(curl --silent --show-error --max-time 60 --output /dev/null --write-out '%{http_code}' -X POST -H "Origin: ${PREVIEW_URL}" -H 'Content-Type: application/x-www-form-urlencoded' --data 'decision=approved' "${PREVIEW_URL}/api/review/community-reports/runtime-smoke-nonexistent")"
          [[ "$review_code" == "401" ]] || { echo "review boundary HTTP $review_code" >&2; exit 1; }
          ingest_code="$(curl --silent --show-error --max-time 60 --output /dev/null --write-out '%{http_code}' -X POST "${PREVIEW_URL}/api/ingest/all")"
          [[ "$ingest_code" == "401" ]] || { echo "ingest boundary HTTP $ingest_code" >&2; exit 1; }
          login_code="$(curl --silent --show-error --max-time 60 --output /dev/null --write-out '%{http_code}' -X POST -H 'Content-Type: application/x-www-form-urlencoded' --data 'token=runtime-smoke-invalid-token' "${PREVIEW_URL}/review/login")"
          [[ "$login_code" == "303" ]] || { echo "invalid login HTTP $login_code" >&2; exit 1; }

          preview_headers="$tmp/preview.headers"
          prod_headers="$tmp/prod.headers"
          curl --silent --show-error --max-time 60 --output /dev/null --dump-header "$preview_headers" "${PREVIEW_URL}/"
          curl --silent --show-error --max-time 60 --output /dev/null --dump-header "$prod_headers" "${PRODUCTION_URL}/"
          missing=0
          for header in strict-transport-security x-content-type-options x-frame-options referrer-policy content-security-policy permissions-policy; do
            if grep -qi "^${header}:" "$prod_headers" && ! grep -qi "^${header}:" "$preview_headers"; then
              echo "Preview missing Production security header: $header" >&2
              missing=1
            fi
          done
          [[ "$missing" == 0 ]]

          echo 'Exact #291 Preview runtime/cache/auth-boundary/security-header proof PASS.' >> "$GITHUB_STEP_SUMMARY"
