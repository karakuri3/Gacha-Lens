name: Gacha Market P3 Seed Canary

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact approved main SHA
        required: true
        type: string
      confirmation:
        description: Type APPROVE_ONE_P3_SEED_CANARY
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  p3-seed-canary:
    concurrency:
      group: gacha-ingestion
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GACHA_DATA_SOURCE: supabase
      BACKFILL_TASK: market
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
      YAHOO_SHOPPING_APP_ID: ${{ secrets.YAHOO_SHOPPING_APP_ID }}
      YAHOO_SHOPPING_FETCH_ENABLED: ${{ secrets.YAHOO_SHOPPING_FETCH_ENABLED }}
      P3_SEED_CANARY_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify exact approved main
        id: main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "${{ inputs.expected_main_sha }}"
          git fetch --no-tags origin main --depth=1
          origin_main_sha="$(git rev-parse origin/main)"
          test "$GITHUB_SHA" = "$origin_main_sha"
          echo "origin_main_sha=$origin_main_sha" >> "$GITHUB_OUTPUT"
      - name: Freshly retrieve and strictly revalidate fixed P3 target
        env:
          P3_SEED_CANARY_MAX_CANDIDATES: "1"
        run: >-
          node scripts/market-p3-seed-canary.mjs
          --target=config/market-p3-seed-canary-target.json
          --expected-main-sha=${{ inputs.expected_main_sha }}
          --origin-main-sha=${{ steps.main.outputs.origin_main_sha }}
          --persist=true
          --output-dir=${{ runner.temp }}/gacha-market-p3-seed-canary
      - name: Scan sanitized canary artifact
        run: node scripts/manual-market-audit-guard.mjs scan --directory=${{ runner.temp }}/gacha-market-p3-seed-canary
      - name: Upload sanitized P3 seed canary artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-p3-seed-canary-result-${{ github.run_id }}
          path: ${{ runner.temp }}/gacha-market-p3-seed-canary
          if-no-files-found: error
          retention-days: 14
