name: Gacha Market Bounded Automatic Production

permissions:
  contents: read
  actions: read

on:
  schedule:
    - cron: "17,47 * * * *"

jobs:
  bounded-production:
    if: ${{ vars.AUTOMATIC_MARKET_BOUNDED_AUTO_ENABLED == 'true' }}
    concurrency:
      group: gacha-market-bounded-v2
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GH_READ_TOKEN: ${{ github.token }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
      YAHOO_SHOPPING_APP_ID: ${{ secrets.YAHOO_SHOPPING_APP_ID }}
      YAHOO_SHOPPING_FETCH_ENABLED: ${{ secrets.YAHOO_SHOPPING_FETCH_ENABLED }}
      YAHOO_AFFILIATE_TRACKING_ID: ${{ secrets.YAHOO_AFFILIATE_TRACKING_ID }}
      GACHA_DATA_SOURCE: supabase
      BACKFILL_TASK: market
      INGESTION_WRITE_DISABLED: "true"
      MARKET_BACKFILL_WRITE_DISABLED: "true"
      AUTOMATIC_INGESTION_WRITE_ENABLED: ${{ vars.AUTOMATIC_INGESTION_WRITE_ENABLED || 'false' }}
      AUTOMATIC_INGESTION_ROLLOUT_STAGE: ${{ vars.AUTOMATIC_INGESTION_ROLLOUT_STAGE || 'disabled' }}
      AUTOMATIC_INGESTION_ROLLOUT_POLICY_DIGEST: ${{ vars.AUTOMATIC_INGESTION_ROLLOUT_POLICY_DIGEST || '' }}
      AUTOMATIC_INGESTION_BOUNDED_PERSISTENCE_ENABLED: ${{ vars.AUTOMATIC_INGESTION_BOUNDED_PERSISTENCE_ENABLED || 'false' }}
      AUTOMATIC_INGESTION_BOUNDED_APPROVAL: ${{ vars.AUTOMATIC_INGESTION_BOUNDED_APPROVAL || '' }}
      AUTOMATIC_INGESTION_SCHEDULE: ${{ github.event.schedule }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify exact main SHA
        id: main_sha
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "schedule"
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch --no-tags origin main --depth=1
          origin_main_sha="$(git rev-parse origin/main)"
          test "$GITHUB_SHA" = "$origin_main_sha"
          echo "origin_main_sha=$origin_main_sha" >> "$GITHUB_OUTPUT"
      - name: Resolve bounded rollout policy and throttle
        id: rollout
        run: >-
          node scripts/automatic-ingestion-rollout.mjs preflight
          --output-dir=${{ runner.temp }}/gacha-market-bounded-auto
          --stage=market-bounded
          --configured-policy-digest=${{ env.AUTOMATIC_INGESTION_ROLLOUT_POLICY_DIGEST }}
          --task=market
          --schedule="$AUTOMATIC_INGESTION_SCHEDULE"
          --event-name=${{ github.event_name }}
          --ref=${{ github.ref }}
          --head-sha=${{ github.sha }}
          --origin-main-sha=${{ steps.main_sha.outputs.origin_main_sha }}
          --automatic-write-enabled=${{ env.AUTOMATIC_INGESTION_WRITE_ENABLED }}
          --bounded-persistence-enabled=${{ env.AUTOMATIC_INGESTION_BOUNDED_PERSISTENCE_ENABLED }}
      - name: Generate blocked bounded result before source fetch
        if: ${{ always() && steps.rollout.outputs.expected_noop != 'true' && steps.rollout.outputs.allowed != 'true' }}
        run: >-
          npm run market:bounded-persist -- blocked
          --output-dir=${{ runner.temp }}/gacha-market-bounded-auto
          --preflight=${{ runner.temp }}/gacha-market-bounded-auto/ingestion-rollout-preflight.json
          --event-name=${{ github.event_name }}
          --ref=${{ github.ref }}
          --head-sha=${{ github.sha }}
      - name: Report expected rollout no-op
        if: ${{ steps.rollout.outputs.expected_noop == 'true' }}
        run: |
          echo "## Expected automatic rollout no-op" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reason: ${{ steps.rollout.outputs.expected_noop_reason }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source fetch: skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bounded persistence: skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "- Database writes: 0" >> "$GITHUB_STEP_SUMMARY"
      - name: Run controlled market backfill
        id: market_backfill
        if: ${{ steps.rollout.outputs.allowed == 'true' }}
        env:
          MARKET_AUDIT_OUTPUT_DIR: ${{ runner.temp }}/gacha-market-bounded-auto/audit
        run: >-
          npm run market:backfill --
          --mode=dry-run
          --limit=${{ steps.rollout.outputs.limit }}
          --priority=${{ steps.rollout.outputs.priority }}
          --release=${{ steps.rollout.outputs.release }}
          --source-scope=${{ steps.rollout.outputs.source_scope }}
          --execute-sources
      - name: Generate bounded plan
        id: plan
        if: ${{ steps.market_backfill.outcome == 'success' }}
        run: >-
          node scripts/automatic-ingestion-rollout.mjs plan
          --output-dir=${{ runner.temp }}/gacha-market-bounded-auto
          --preflight=${{ runner.temp }}/gacha-market-bounded-auto/ingestion-rollout-preflight.json
          --audit=${{ runner.temp }}/gacha-market-bounded-auto/audit/market-candidate-audit.json
      - name: Generate bounded persistence preview
        id: preview
        if: ${{ steps.plan.outputs.plan_generated == 'true' }}
        run: >-
          node scripts/automatic-ingestion-rollout.mjs preview
          --output-dir=${{ runner.temp }}/gacha-market-bounded-auto
          --preflight=${{ runner.temp }}/gacha-market-bounded-auto/ingestion-rollout-preflight.json
          --audit=${{ runner.temp }}/gacha-market-bounded-auto/audit/market-candidate-audit.json
          --plan=${{ runner.temp }}/gacha-market-bounded-auto/market-bounded-write-plan.json
          --event-name=${{ github.event_name }}
          --ref=${{ github.ref }}
          --head-sha=${{ github.sha }}
      - name: Run bounded market persistence
        id: persistence
        if: ${{ steps.rollout.outputs.allowed == 'true' && steps.rollout.outputs.persistence_authorized == 'true' && steps.rollout.outputs.bounded_persistence_enabled == 'true' && steps.rollout.outputs.bounded_approval_valid == 'true' && steps.plan.outputs.budget_state == 'within_budget' && steps.preview.outputs.preview_generated == 'true' }}
        run: >-
          npm run market:bounded-persist -- persist
          --output-dir=${{ runner.temp }}/gacha-market-bounded-auto
          --audit=${{ runner.temp }}/gacha-market-bounded-auto/audit/market-candidate-audit.json
          --plan=${{ runner.temp }}/gacha-market-bounded-auto/market-bounded-write-plan.json
          --event-name=${{ github.event_name }}
          --ref=${{ github.ref }}
          --head-sha=${{ github.sha }}
          --main-sha-verified=${{ steps.rollout.outputs.main_sha_verified }}
          --task=market
          --schedule="$AUTOMATIC_INGESTION_SCHEDULE"
          --stage=market-bounded
          --automatic-write-enabled=${{ env.AUTOMATIC_INGESTION_WRITE_ENABLED }}
          --bounded-persistence-enabled=${{ env.AUTOMATIC_INGESTION_BOUNDED_PERSISTENCE_ENABLED }}
          --policy-digest=${{ steps.rollout.outputs.policy_digest }}
      - name: Scan sanitized bounded artifact
        id: scan
        if: ${{ always() && steps.rollout.outputs.report_generated == 'true' }}
        run: >-
          node scripts/automatic-ingestion-rollout.mjs scan
          --directories=${{ runner.temp }}/gacha-market-bounded-auto
      - name: Upload sanitized bounded artifact
        if: ${{ always() && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: market-bounded-auto-result-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gacha-market-bounded-auto
          if-no-files-found: error
          retention-days: 14
      - name: Enforce bounded rollout result
        if: ${{ always() && steps.rollout.outputs.expected_noop != 'true' && (steps.rollout.outputs.allowed != 'true' || steps.plan.outputs.plan_generated != 'true' || steps.preview.outputs.preview_generated != 'true' || (steps.rollout.outputs.persistence_authorized == 'true' && steps.persistence.outputs.result_generated != 'true')) }}
        run: |
          echo "::error::Automatic bounded rollout failed closed before or during persistence."
          exit 1
