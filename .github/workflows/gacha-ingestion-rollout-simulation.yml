name: Gacha Ingestion Rollout Simulation

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Rollout stage to simulate without persistence
        required: true
        type: choice
        options:
          - market-shadow
          - market-bounded

jobs:
  rollout-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
      YAHOO_SHOPPING_APP_ID: ${{ secrets.YAHOO_SHOPPING_APP_ID }}
      YAHOO_SHOPPING_FETCH_ENABLED: ${{ secrets.YAHOO_SHOPPING_FETCH_ENABLED }}
      GH_READ_TOKEN: ${{ github.token }}
      INGESTION_WRITE_DISABLED: "true"
      MARKET_BACKFILL_WRITE_DISABLED: "true"
      AUTOMATIC_INGESTION_WRITE_ENABLED: "false"
      BACKFILL_TASK: market
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify exact main SHA
        id: main_sha
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch --no-tags origin main --depth=1
          origin_main_sha="$(git rev-parse origin/main)"
          test "$GITHUB_SHA" = "$origin_main_sha"
          echo "origin_main_sha=$origin_main_sha" >> "$GITHUB_OUTPUT"
      - name: Load policy and run read-only rollout preflight
        id: rollout
        run: >-
          node scripts/automatic-ingestion-rollout.mjs preflight
          --output-dir=${{ runner.temp }}/gacha-rollout-report
          --stage=${{ inputs.stage }}
          --task=market
          --event-name=workflow_dispatch
          --ref=${{ github.ref }}
          --head-sha=${{ github.sha }}
          --origin-main-sha=${{ steps.main_sha.outputs.origin_main_sha }}
          --simulation=true
          --automatic-write-enabled=false
      - name: Run market shadow dry-run
        id: market_backfill
        if: ${{ steps.rollout.outputs.allowed == 'true' }}
        env:
          MARKET_AUDIT_OUTPUT_DIR: ${{ runner.temp }}/gacha-market-audit
        run: >-
          npm run market:backfill --
          --mode=dry-run
          --limit=5
          --priority=1
          --release=released
          --source-scope=planner-apis
          --execute-sources
      - name: Generate bounded prediction and verify Production snapshot
        id: rollout_plan
        if: ${{ steps.rollout.outputs.allowed == 'true' && steps.market_backfill.outcome == 'success' }}
        run: >-
          node scripts/automatic-ingestion-rollout.mjs plan
          --output-dir=${{ runner.temp }}/gacha-rollout-report
          --preflight=${{ runner.temp }}/gacha-rollout-report/ingestion-rollout-preflight.json
          --audit=${{ runner.temp }}/gacha-market-audit/market-candidate-audit.json
      - name: Scan sanitized rollout artifact
        if: ${{ always() && steps.rollout.outputs.report_generated == 'true' }}
        run: >-
          node scripts/automatic-ingestion-rollout.mjs scan
          --directories=${{ runner.temp }}/gacha-rollout-report,${{ runner.temp }}/gacha-market-audit
      - name: Upload sanitized rollout artifact
        if: ${{ always() && steps.rollout.outputs.report_generated == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-shadow-report-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gacha-rollout-report
            ${{ runner.temp }}/gacha-market-audit/market-candidate-audit.json
            ${{ runner.temp }}/gacha-market-audit/market-candidate-audit.md
          if-no-files-found: error
          retention-days: 14
      - name: Enforce simulation result
        if: ${{ always() && (steps.rollout.outputs.allowed != 'true' || steps.rollout_plan.outputs.plan_generated != 'true' || steps.rollout_plan.outputs.database_writes != '0') }}
        run: |
          echo "::error::Rollout simulation failed closed."
          exit 1
