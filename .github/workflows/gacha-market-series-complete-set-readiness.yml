name: Gacha Market Series Complete-Set Readiness

on:
  workflow_dispatch:
    inputs:
      audit_run_id:
        description: Exact read-only complete-set diagnostic run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  readiness:
    concurrency:
      group: gacha-market-series-complete-set-manual-canary
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify exact main revision
        id: main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch --no-tags origin main --depth=1
          origin_main_sha="$(git rev-parse origin/main)"
          test "$GITHUB_SHA" = "$origin_main_sha"
          echo "origin_main_sha=$origin_main_sha" >> "$GITHUB_OUTPUT"
      - name: Download exact complete-set diagnostic artifact
        uses: actions/download-artifact@v4
        with:
          name: market-series-complete-set-diagnostic-${{ inputs.audit_run_id }}
          path: ${{ runner.temp }}/gacha-market-series-complete-set-readiness/audit
          repository: ${{ github.repository }}
          run-id: ${{ inputs.audit_run_id }}
          github-token: ${{ github.token }}
      - name: Build read-only complete-set readiness artifact
        env:
          GACHA_DATA_SOURCE: supabase
          MARKET_BACKFILL_WRITE_DISABLED: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          npm run market:series-complete-set-readiness --
          --audit-run-id=${{ inputs.audit_run_id }}
          --diagnostic=${{ runner.temp }}/gacha-market-series-complete-set-readiness/audit/market-series-complete-set-diagnostic.json
          --origin-main-sha=${{ steps.main.outputs.origin_main_sha }}
          --output-dir=${{ runner.temp }}/gacha-market-series-complete-set-readiness/result
      - name: Scan sanitized readiness artifact
        id: scan
        if: ${{ always() }}
        run: node scripts/manual-market-audit-guard.mjs scan --directory=${{ runner.temp }}/gacha-market-series-complete-set-readiness/result
      - name: Upload sanitized readiness artifact
        if: ${{ always() && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: market-series-complete-set-readiness-${{ github.run_id }}
          path: ${{ runner.temp }}/gacha-market-series-complete-set-readiness/result
          if-no-files-found: error
          retention-days: 14
