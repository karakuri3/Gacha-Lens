name: Gacha Market P1 Bounded Manual Production

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact approved main SHA
        required: true
        type: string
      mode:
        description: Read-only dry-run or exact one-listing canary write
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - canary-write
      limit:
        description: Priority 1 variants to inspect (1-5)
        required: true
        default: "5"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
      candidate_key:
        description: Exact deterministic first eligible candidate key; required only for canary-write
        required: false
        type: string
      approval:
        description: Exact digest/head/candidate-bound approval; required only for canary-write
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  priority-one-bounded:
    concurrency:
      group: gacha-market-bounded-v2
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GACHA_DATA_SOURCE: supabase
      MARKET_BACKFILL_WRITE_DISABLED: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify exact main and fixed Priority 1 bounded contract
        id: main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "${{ inputs.expected_main_sha }}"
          case "${{ inputs.limit }}" in 1|2|3|4|5) ;; *) exit 1 ;; esac
          case "${{ inputs.mode }}" in dry-run|canary-write) ;; *) exit 1 ;; esac
          git fetch --no-tags origin main --depth=1
          origin_main_sha="$(git rev-parse origin/main)"
          test "$GITHUB_SHA" = "$origin_main_sha"
          echo "origin_main_sha=$origin_main_sha" >> "$GITHUB_OUTPUT"
      - name: Run Priority 1 bounded dry-run or exact canary
        id: bounded
        env:
          P1_BOUNDED_APPROVAL: ${{ inputs.approval }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          YAHOO_SHOPPING_APP_ID: ${{ secrets.YAHOO_SHOPPING_APP_ID }}
          YAHOO_SHOPPING_FETCH_ENABLED: ${{ secrets.YAHOO_SHOPPING_FETCH_ENABLED }}
          YAHOO_SHOPPING_REQUEST_DELAY_MS: "5000"
        run: >-
          node scripts/market-p1-bounded-persistence.mjs
          --mode=${{ inputs.mode }}
          --limit=${{ inputs.limit }}
          --candidate-key=${{ inputs.candidate_key }}
          --expected-main-sha=${{ inputs.expected_main_sha }}
          --origin-main-sha=${{ steps.main.outputs.origin_main_sha }}
          --output-dir=${{ runner.temp }}/gacha-market-p1-bounded-persistence
      - name: Scan sanitized Priority 1 bounded artifact
        id: scan
        if: ${{ always() }}
        run: node scripts/manual-market-audit-guard.mjs scan --directory=${{ runner.temp }}/gacha-market-p1-bounded-persistence
      - name: Upload sanitized Priority 1 bounded artifact
        if: ${{ always() && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: market-p1-bounded-result-${{ github.run_id }}
          path: ${{ runner.temp }}/gacha-market-p1-bounded-persistence
          if-no-files-found: error
          retention-days: 14
