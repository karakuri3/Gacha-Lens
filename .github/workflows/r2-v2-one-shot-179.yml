name: R2 V2 One-Shot #179

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APPROVED_CODE_SHA: dc25eb16b7e057397fe3bf9527f5467ac54b281a
  EXPECTED_CURRENT_MAIN_SHA: f1d723f971ddbdceed830bc87f2c67936577f56b
  R2_V2_APPROVAL: APPROVE_MARKET_REOBSERVATION_R2_CANARY_V2:dc25eb16b7e057397fe3bf9527f5467ac54b281a:441957a6649817acff82d5b07eb0c6e9701fa4473662ef8544a7a9fa61614a24

on:
  push:
    branches:
      - ops/r2-v2-one-shot-179-20260902
    paths:
      - .github/workflows/r2-v2-one-shot-179.yml

jobs:
  execute-r2-v2-once:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: r2-v2-one-shot-179-20260902
      cancel-in-progress: false
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      YAHOO_SHOPPING_APP_ID: ${{ secrets.YAHOO_SHOPPING_APP_ID }}
      MARKET_API_MAX_ATTEMPTS: "3"
      YAHOO_SHOPPING_REQUEST_TIMEOUT_MS: "12000"
    steps:
      - name: Check out one-shot branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify approved code snapshot and one-file workflow delta
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/ops/r2-v2-one-shot-179-20260902"
          git fetch --no-tags origin main --depth=20
          test "$(git rev-parse origin/main)" = "$EXPECTED_CURRENT_MAIN_SHA"
          test "$(git rev-parse "$APPROVED_CODE_SHA^{commit}")" = "$APPROVED_CODE_SHA"
          git merge-base --is-ancestor "$APPROVED_CODE_SHA" origin/main
          mapfile -t main_since_approved < <(git diff --name-only "$APPROVED_CODE_SHA"..origin/main)
          test "${#main_since_approved[@]}" -eq 4
          printf '%s\n' "${main_since_approved[@]}" | sort > "$RUNNER_TEMP/main-since-approved.txt"
          printf '%s\n' \
            docs/DECISIONS.md \
            docs/HANDOFF.md \
            docs/STATUS.md \
            docs/TODO.md | sort > "$RUNNER_TEMP/expected-main-since-approved.txt"
          diff -u "$RUNNER_TEMP/expected-main-since-approved.txt" "$RUNNER_TEMP/main-since-approved.txt"
          mapfile -t changed < <(git diff --name-only "$APPROVED_CODE_SHA"...HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/r2-v2-one-shot-179.yml"
          git diff --check "$APPROVED_CODE_SHA"...HEAD

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Execute approved Yahoo-only R2 v2 canary exactly once
        shell: bash
        run: |
          set -euo pipefail
          node scripts/market-reobservation-r2-v2-canary.mjs \
            --mode canary-write \
            --head-sha "$APPROVED_CODE_SHA" \
            --expected-main-sha "$APPROVED_CODE_SHA" \
            --approval "$R2_V2_APPROVAL" \
            2>&1 | tee "$RUNNER_TEMP/r2-v2-result.txt"

      - name: Upload sanitized execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-v2-one-shot-179-${{ github.run_id }}
          path: ${{ runner.temp }}/r2-v2-result.txt
          if-no-files-found: ignore
          retention-days: 7
