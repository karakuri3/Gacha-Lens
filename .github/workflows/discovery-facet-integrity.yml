name: Discovery Facet Integrity

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/brands/**"
      - "app/categories/**"
      - "app/franchises/**"
      - "app/api/public-discovery/**"
      - "app/sitemap.js"
      - "lib/domain/discovery-facets.js"
      - "lib/domain/category-discovery.js"
      - "lib/domain/*static-manifest.js"
      - "lib/targeted-*-series-page.js"
      - "lib/series.js"
      - "lib/data/public-sitemap-identifiers.js"
      - "scripts/discovery-facet-integrity-audit.mjs"
      - "tests/discovery-facet-integrity.test.mjs"
      - ".github/workflows/discovery-facet-integrity.yml"

permissions:
  contents: read

concurrency:
  group: discovery-facet-integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  production-read-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused facet contract tests
        run: >-
          node --test
          tests/discovery-facet-integrity.test.mjs
          tests/discovery-facets.test.mjs
          tests/category-discovery.test.mjs
          tests/category-detail-targeted-read.test.mjs
          tests/discovery-facet-static-rendering.test.mjs

      - name: Prove all currently published facet identifiers
        run: npm run discovery:audit-live
