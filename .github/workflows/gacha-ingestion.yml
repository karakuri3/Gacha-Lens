name: Gacha ingestion

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      task:
        description: Ingestion task
        required: true
        default: market
        type: choice
        options:
          - all
          - official
          - market
          - stock
      mode:
        description: Manual market mode (scheduled runs use the rollout policy)
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - canary-write
          - write
      limit:
        description: Maximum market variants (1-200)
        required: true
        default: "25"
        type: string
      priority:
        description: Market priority (all or 1-5)
        required: true
        default: all
        type: string
      release:
        description: Market release scope
        required: true
        default: all
        type: choice
        options:
          - all
          - released
          - upcoming
      source_scope:
        description: Market source scope
        required: true
        default: planner-apis
        type: choice
        options:
          - planner-apis
          - approved-feeds
          - all
      execute_sources:
        description: Execute configured external sources during dry-run
        required: true
        default: false
        type: boolean
      canary_audit_run_id:
        description: Approved dry-run workflow run ID
        required: false
        type: string
      canary_candidate_keys:
        description: Comma-separated approved candidate keys, maximum 4
        required: false
        type: string
      production_write_approval:
        description: Exact approval for a manual Production write
        required: false
        default: ""
        type: string
  schedule:
    - cron: "7 * * * *"
    - cron: "17,47 * * * *"
    - cron: "37 * * * *"

jobs:
  upsert:
    concurrency:
      group: gacha-ingestion
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MARKET_RAW_FEED_SOURCES_JSON: ${{ secrets.MARKET_RAW_FEED_SOURCES_JSON }}
      STOCK_RAW_FEED_SOURCES_JSON: ${{ secrets.STOCK_RAW_FEED_SOURCES_JSON }}
      RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
      YAHOO_SHOPPING_APP_ID: ${{ secrets.YAHOO_SHOPPING_APP_ID }}
      YAHOO_SHOPPING_FETCH_ENABLED: ${{ secrets.YAHOO_SHOPPING_FETCH_ENABLED }}
      OFFICIAL_DETAIL_FETCH_LIMIT: 60
      OFFICIAL_DETAIL_FETCH_DELAY_MS: 250
      OFFICIAL_TARTS_PAGES_PER_RUN: 4
      OFFICIAL_TARTS_MAX_PAGE: 80
      MARKET_QUERY_CURSOR_MINUTES: 30
      GACHA_DATA_SOURCE: supabase
      AUTOMATIC_INGESTION_WRITE_ENABLED: ${{ vars.AUTOMATIC_INGESTION_WRITE_ENABLED || 'false' }}
      AUTOMATIC_INGESTION_ROLLOUT_STAGE: ${{ vars.AUTOMATIC_INGESTION_ROLLOUT_STAGE || 'disabled' }}
      AUTOMATIC_INGESTION_ROLLOUT_POLICY_DIGEST: ${{ vars.AUTOMATIC_INGESTION_ROLLOUT_POLICY_DIGEST || '' }}
      AUTOMATIC_INGESTION_BOUNDED_PERSISTENCE_ENABLED: ${{ vars.AUTOMATIC_INGESTION_BOUNDED_PERSISTENCE_ENABLED || 'false' }}
      AUTOMATIC_INGESTION_BOUNDED_APPROVAL: ${{ vars.AUTOMATIC_INGESTION_BOUNDED_APPROVAL || '' }}
      GH_READ_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout full history for canary write
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'canary-write' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Checkout shallow history
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'canary-write' }}
        uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Select ingestion task
        id: ingestion
        shell: bash
        env:
          MANUAL_TASK: ${{ inputs.task }}
          MANUAL_MODE: ${{ inputs.mode }}
          MANUAL_LIMIT: ${{ inputs.limit }}
          MANUAL_PRIORITY: ${{ inputs.priority }}
          MANUAL_RELEASE: ${{ inputs.release }}
          MANUAL_SOURCE_SCOPE: ${{ inputs.source_scope }}
          MANUAL_EXECUTE_SOURCES: ${{ inputs.execute_sources }}
          CANARY_AUDIT_RUN_ID: ${{ inputs.canary_audit_run_id }}
          CANARY_CANDIDATE_KEYS: ${{ inputs.canary_candidate_keys }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE" in
            "7 * * * *") task=official ;;
            "17,47 * * * *") task=market ;;
            "37 * * * *") task=stock ;;
            *) task="${MANUAL_TASK:-all}" ;;
          esac
          if [ -n "$SCHEDULE" ]; then
            mode=rollout
            limit=5
            priority=1
            release=released
            source_scope=planner-apis
            execute_sources=true
          else
            mode="${MANUAL_MODE:-dry-run}"
            release="${MANUAL_RELEASE:-all}"
            source_scope="${MANUAL_SOURCE_SCOPE:-planner-apis}"
            execute_sources="${MANUAL_EXECUTE_SOURCES:-false}"
            case "${MANUAL_LIMIT:-25}" in ''|*[!0-9]*) limit=25 ;; *) limit="$MANUAL_LIMIT" ;; esac
            case "${MANUAL_PRIORITY:-all}" in all|1|2|3|4|5) priority="${MANUAL_PRIORITY:-all}" ;; *) priority=all ;; esac
          fi
          case "$source_scope" in planner-apis|approved-feeds|all) ;; *) source_scope=planner-apis ;; esac
          if [ "$task" = "all" ] && [ "$mode" = "dry-run" ]; then
            echo "::error::The all task writes official and stock data. Select write explicitly, or run the default market dry-run."
            exit 1
          fi
          if [ "$mode" = "canary-write" ]; then
            fail_canary() {
              mkdir -p "$RUNNER_TEMP/gacha-market-canary"
              printf '%s\n' \
                '{"schema_version":1,"source_audit_run_id":"","workflow_run_id":"'"$GITHUB_RUN_ID"'","head_sha":"'"$GITHUB_SHA"'","mode":"canary-write","ok":false,"failed_stage":"request_validation","error_code":"canary_request_validation_failed","candidate_count":0,"candidate_keys":[],"candidates":[],"listing_writes":0,"observation_writes":0,"verification":false,"rollback":{"attempted":false,"verified":false,"listings_deleted":0,"observations_deleted":0,"listings_restored":0,"observations_restored":0},"db_deltas":{},"health":{"database":"unknown"}}' \
                > "$RUNNER_TEMP/gacha-market-canary/market-canary-result.json"
              printf '%s\n' '# Market Canary Result' '' '- Failed stage: request_validation' '- Error code: canary_request_validation_failed' '- Listing writes: 0' '- Observation writes: 0' '- Rollback: not required' \
                > "$RUNNER_TEMP/gacha-market-canary/market-canary-result.md"
              echo "::error::$1"
              exit 1
            }
            if [ -n "$SCHEDULE" ]; then echo "::error::Canary write cannot run on a schedule."; exit 1; fi
            if [ "$task" != "market" ] || [ "$source_scope" != "planner-apis" ] || [ "${MANUAL_RELEASE:-all}" != "released" ] || [ "$priority" != "1" ]; then
              fail_canary "Canary write requires task=market, priority=1, source_scope=planner-apis and release=released."
            fi
            if [ "$limit" -lt 1 ] || [ "$limit" -gt 5 ]; then
              fail_canary "Canary write limit must be between 1 and 5."
            fi
            if ! [[ "$CANARY_AUDIT_RUN_ID" =~ ^[0-9]+$ ]]; then
              fail_canary "Canary audit run ID must contain digits only."
            fi
            IFS=',' read -ra canary_keys <<< "$CANARY_CANDIDATE_KEYS"
            if [ "${#canary_keys[@]}" -lt 1 ] || [ "${#canary_keys[@]}" -gt 4 ]; then
              fail_canary "Canary write requires between one and four candidate keys."
            fi
            declare -A seen_keys
            for key in "${canary_keys[@]}"; do
              if ! [[ "$key" =~ ^[0-9a-f]{16}$ ]] || [ -n "${seen_keys[$key]:-}" ]; then
                fail_canary "Candidate keys must be unique 16-character lowercase hex values."
              fi
              seen_keys[$key]=1
            done
            execute_sources=true
          fi
          echo "task=$task" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "limit=$limit" >> "$GITHUB_OUTPUT"
          echo "priority=$priority" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "source_scope=$source_scope" >> "$GITHUB_OUTPUT"
          echo "execute_sources=$execute_sources" >> "$GITHUB_OUTPUT"
          echo "canary_audit_run_id=$CANARY_AUDIT_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "canary_candidate_keys=$CANARY_CANDIDATE_KEYS" >> "$GITHUB_OUTPUT"
          case "$mode" in
            dry-run) execution_type=manual_dry_run ;;
            canary-write) execution_type=manual_canary_write ;;
            write) if [ -n "$SCHEDULE" ]; then execution_type=scheduled_write; else execution_type=manual_full_write; fi ;;
            rollout) execution_type=read_only ;;
            *) execution_type=read_only ;;
          esac
          echo "execution_type=$execution_type" >> "$GITHUB_OUTPUT"
      - name: Verify exact main SHA for Production mutation or rollout
        id: main_sha
        if: ${{ steps.ingestion.outputs.mode == 'write' || steps.ingestion.outputs.mode == 'rollout' }}
        shell: bash
        run: |
          origin_main_sha=""
          if git fetch --no-tags origin main --depth=1; then
            origin_main_sha="$(git rev-parse origin/main 2>/dev/null || true)"
          fi
          echo "origin_main_sha=$origin_main_sha" >> "$GITHUB_OUTPUT"
      - name: Resolve rollout policy and throttle
        id: rollout
        if: ${{ steps.ingestion.outputs.mode == 'rollout' }}
        run: >-
          node scripts/automatic-ingestion-rollout.mjs preflight
          --output-dir=${{ runner.temp }}/gacha-rollout-report
          --stage=${{ env.AUTOMATIC_INGESTION_ROLLOUT_STAGE }}
          --configured-policy-digest=${{ env.AUTOMATIC_INGESTION_ROLLOUT_POLICY_DIGEST }}
          --task=${{ steps.ingestion.outputs.task }}
          --schedule=${{ github.event.schedule }}
          --event-name=${{ github.event_name }}
          --ref=${{ github.ref }}
          --head-sha=${{ github.sha }}
          --origin-main-sha=${{ steps.main_sha.outputs.origin_main_sha }}
          --automatic-write-enabled=${{ env.AUTOMATIC_INGESTION_WRITE_ENABLED }}
          --bounded-persistence-enabled=${{ env.AUTOMATIC_INGESTION_BOUNDED_PERSISTENCE_ENABLED }}
      - name: Generate blocked bounded result before source fetch
        id: bounded_blocked_result
        if: ${{ always() && steps.ingestion.outputs.mode == 'rollout' && env.AUTOMATIC_INGESTION_ROLLOUT_STAGE == 'market-bounded' && steps.rollout.outputs.allowed != 'true' }}
        run: >-
          npm run market:bounded-persist -- blocked
          --output-dir=${{ runner.temp }}/gacha-rollout-report
          --preflight=${{ runner.temp }}/gacha-rollout-report/ingestion-rollout-preflight.json
          --event-name=${{ github.event_name }}
          --ref=${{ github.ref }}
          --head-sha=${{ github.sha }}
      - name: Run execution preflight
        id: execution_preflight
        if: ${{ steps.ingestion.outputs.mode == 'write' }}
        run: >-
          node scripts/ingestion-execution-guard.mjs preflight
          --output-dir=${{ runner.temp }}/gacha-ingestion-run-report
          --event-name=${{ github.event_name }}
          --ref=${{ github.ref }}
          --head-sha=${{ github.sha }}
          --origin-main-sha=${{ steps.main_sha.outputs.origin_main_sha }}
          --task=${{ steps.ingestion.outputs.task }}
          --mode=${{ steps.ingestion.outputs.mode }}
          --schedule=${{ github.event.schedule }}
          --source-scope=${{ steps.ingestion.outputs.source_scope }}
          --execute-sources=${{ steps.ingestion.outputs.execute_sources }}
          --automatic-write-enabled=${{ env.AUTOMATIC_INGESTION_WRITE_ENABLED }}
          --event-path=${{ github.event_path }}
      - name: Capture before snapshot
        id: before_snapshot
        if: ${{ steps.ingestion.outputs.mode == 'write' && steps.execution_preflight.outputs.allowed == 'true' }}
        run: >-
          node scripts/ingestion-execution-guard.mjs snapshot
          --output=${{ runner.temp }}/gacha-ingestion-before.json
      - name: Download approved market candidate audit
        if: ${{ steps.ingestion.outputs.mode == 'canary-write' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.ingestion.outputs.canary_audit_run_id }}
          name: market-candidate-audit-${{ steps.ingestion.outputs.canary_audit_run_id }}
          path: ${{ runner.temp }}/approved-market-audit
      - name: Run controlled market backfill
        id: market_backfill
        if: ${{ (github.event_name == 'workflow_dispatch' && steps.ingestion.outputs.task == 'market' && steps.ingestion.outputs.mode != 'write') || (steps.ingestion.outputs.mode == 'rollout' && steps.rollout.outputs.allowed == 'true') }}
        env:
          BACKFILL_MODE: ${{ steps.ingestion.outputs.mode == 'rollout' && 'dry-run' || steps.ingestion.outputs.mode }}
          BACKFILL_LIMIT: ${{ steps.ingestion.outputs.mode == 'rollout' && steps.rollout.outputs.limit || steps.ingestion.outputs.limit }}
          BACKFILL_PRIORITY: ${{ steps.ingestion.outputs.mode == 'rollout' && steps.rollout.outputs.priority || steps.ingestion.outputs.priority }}
          BACKFILL_RELEASE: ${{ steps.ingestion.outputs.mode == 'rollout' && steps.rollout.outputs.release || steps.ingestion.outputs.release }}
          BACKFILL_SOURCE_SCOPE: ${{ steps.ingestion.outputs.mode == 'rollout' && steps.rollout.outputs.source_scope || steps.ingestion.outputs.source_scope }}
          BACKFILL_EXECUTE_SOURCES: ${{ steps.ingestion.outputs.mode == 'rollout' && steps.rollout.outputs.execute_sources || steps.ingestion.outputs.execute_sources }}
          BACKFILL_TASK: ${{ steps.ingestion.outputs.task }}
          CANARY_AUDIT_RUN_ID: ${{ steps.ingestion.outputs.canary_audit_run_id }}
          CANARY_CANDIDATE_KEYS: ${{ steps.ingestion.outputs.canary_candidate_keys }}
          MARKET_AUDIT_OUTPUT_DIR: ${{ runner.temp }}/gacha-market-audit
          MARKET_CANARY_OUTPUT_DIR: ${{ runner.temp }}/gacha-market-canary
        run: |
          set -o pipefail
          args=("--mode=$BACKFILL_MODE" "--limit=$BACKFILL_LIMIT" "--priority=$BACKFILL_PRIORITY" "--release=$BACKFILL_RELEASE" "--source-scope=$BACKFILL_SOURCE_SCOPE")
          if [ "$BACKFILL_MODE" = "dry-run" ] && [ "$BACKFILL_EXECUTE_SOURCES" = "true" ]; then args+=("--execute-sources"); fi
          if [ "$BACKFILL_MODE" = "canary-write" ]; then
            args+=("--execute-sources" "--audit-run-id=$CANARY_AUDIT_RUN_ID" "--candidate-keys=$CANARY_CANDIDATE_KEYS" "--approved-audit-path=${{ runner.temp }}/approved-market-audit/market-candidate-audit.json")
          fi
          npm run market:backfill -- "${args[@]}" 2>&1 | tee ingestion.log
      - name: Upload sanitized market candidate audit
        if: ${{ always() && steps.ingestion.outputs.task == 'market' && ((github.event_name == 'workflow_dispatch' && steps.ingestion.outputs.mode == 'dry-run' && steps.ingestion.outputs.execute_sources == 'true') || (steps.ingestion.outputs.mode == 'rollout' && steps.rollout.outputs.allowed == 'true')) }}
        uses: actions/upload-artifact@v4
        with:
          name: market-candidate-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gacha-market-audit/market-candidate-audit.json
            ${{ runner.temp }}/gacha-market-audit/market-candidate-audit.md
          if-no-files-found: error
          retention-days: 7
      - name: Generate rollout prediction plan
        id: rollout_plan
        if: ${{ steps.ingestion.outputs.mode == 'rollout' && steps.rollout.outputs.allowed == 'true' && steps.market_backfill.outcome == 'success' }}
        run: >-
          node scripts/automatic-ingestion-rollout.mjs plan
          --output-dir=${{ runner.temp }}/gacha-rollout-report
          --preflight=${{ runner.temp }}/gacha-rollout-report/ingestion-rollout-preflight.json
          --audit=${{ runner.temp }}/gacha-market-audit/market-candidate-audit.json
      - name: Generate bounded persistence preview
        id: persistence_preview
        if: ${{ steps.ingestion.outputs.mode == 'rollout' && steps.rollout.outputs.stage == 'market-bounded' && steps.rollout.outputs.allowed == 'true' && steps.rollout_plan.outputs.plan_generated == 'true' }}
        run: >-
          node scripts/automatic-ingestion-rollout.mjs preview
          --output-dir=${{ runner.temp }}/gacha-rollout-report
          --preflight=${{ runner.temp }}/gacha-rollout-report/ingestion-rollout-preflight.json
          --audit=${{ runner.temp }}/gacha-market-audit/market-candidate-audit.json
          --plan=${{ runner.temp }}/gacha-rollout-report/market-bounded-write-plan.json
          --event-name=${{ github.event_name }}
          --ref=${{ github.ref }}
          --head-sha=${{ github.sha }}
      - name: Run bounded market persistence
        id: bounded_persistence
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '17,47 * * * *' && steps.ingestion.outputs.task == 'market' && steps.ingestion.outputs.mode == 'rollout' && steps.rollout.outputs.stage == 'market-bounded' && steps.rollout.outputs.allowed == 'true' && steps.rollout.outputs.persistence_authorized == 'true' && steps.rollout.outputs.bounded_persistence_enabled == 'true' && steps.rollout.outputs.bounded_approval_valid == 'true' && steps.rollout_plan.outputs.budget_state == 'within_budget' && steps.persistence_preview.outputs.preview_generated == 'true' }}
        run: >-
          npm run market:bounded-persist -- persist
          --output-dir=${{ runner.temp }}/gacha-rollout-report
          --audit=${{ runner.temp }}/gacha-market-audit/market-candidate-audit.json
          --plan=${{ runner.temp }}/gacha-rollout-report/market-bounded-write-plan.json
          --event-name=${{ github.event_name }}
          --ref=${{ github.ref }}
          --head-sha=${{ github.sha }}
          --main-sha-verified=${{ steps.rollout.outputs.main_sha_verified }}
          --task=market
          --schedule=${{ github.event.schedule }}
          --stage=market-bounded
          --automatic-write-enabled=${{ env.AUTOMATIC_INGESTION_WRITE_ENABLED }}
          --bounded-persistence-enabled=${{ env.AUTOMATIC_INGESTION_BOUNDED_PERSISTENCE_ENABLED }}
          --policy-digest=${{ steps.rollout.outputs.policy_digest }}
      - name: Scan rollout report
        if: ${{ always() && steps.ingestion.outputs.mode == 'rollout' && steps.rollout.outputs.report_generated == 'true' }}
        run: >-
          node scripts/automatic-ingestion-rollout.mjs scan
          --directories=${{ runner.temp }}/gacha-rollout-report,${{ runner.temp }}/gacha-market-audit
      - name: Upload sanitized rollout report
        if: ${{ always() && steps.ingestion.outputs.mode == 'rollout' && steps.rollout.outputs.report_generated == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-shadow-report-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gacha-rollout-report
            ${{ runner.temp }}/gacha-market-audit/market-candidate-audit.json
            ${{ runner.temp }}/gacha-market-audit/market-candidate-audit.md
          if-no-files-found: error
          retention-days: 14
      - name: Enforce rollout result
        if: ${{ always() && steps.ingestion.outputs.mode == 'rollout' && (steps.rollout.outputs.allowed != 'true' || steps.rollout_plan.outputs.plan_generated != 'true' || (steps.rollout.outputs.stage == 'market-bounded' && (steps.persistence_preview.outputs.preview_generated != 'true' || (steps.rollout.outputs.persistence_authorized == 'true' && steps.bounded_persistence.outputs.result_generated != 'true')))) }}
        run: |
          echo "::error::Automatic rollout failed closed before persistence."
          exit 1
      - name: Upload sanitized market canary result
        if: ${{ always() && inputs.mode == 'canary-write' }}
        uses: actions/upload-artifact@v4
        with:
          name: market-canary-result-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gacha-market-canary/market-canary-result.json
            ${{ runner.temp }}/gacha-market-canary/market-canary-result.md
          if-no-files-found: error
          retention-days: 7
      - name: Run ingestion
        id: production_ingestion
        if: ${{ steps.ingestion.outputs.mode == 'write' && steps.execution_preflight.outputs.allowed == 'true' && steps.before_snapshot.outcome == 'success' }}
        continue-on-error: true
        env:
          MARKET_COVERAGE_LIMIT: ${{ steps.ingestion.outputs.limit }}
          MARKET_COVERAGE_PRIORITY: ${{ steps.ingestion.outputs.priority }}
          MARKET_COVERAGE_RELEASE: ${{ steps.ingestion.outputs.release }}
          MARKET_COVERAGE_COOLDOWN_HOURS: 24
          MARKET_SOURCE_SCOPE: ${{ steps.ingestion.outputs.source_scope }}
          INGESTION_WRITE_DISABLED: "false"
          INGESTION_EXECUTION_AUTHORIZED: "true"
          INGESTION_EXECUTION_TYPE: ${{ steps.ingestion.outputs.execution_type }}
          INGESTION_MODE: ${{ steps.ingestion.outputs.mode }}
          INGESTION_SCHEDULE: ${{ github.event.schedule }}
          INGESTION_PREFLIGHT_REASON_CODE: ${{ steps.execution_preflight.outputs.reason_code }}
          INGESTION_TRIGGER_SOURCE: ${{ github.event_name }}
        run: |
          set -o pipefail
          npm run db:upsert-all -- --task=${{ steps.ingestion.outputs.task }} 2>&1 | tee ingestion.log
      - name: Clean replaced provisional variants
        id: cleanup_provisional
        if: ${{ steps.execution_preflight.outputs.allowed == 'true' && steps.production_ingestion.outcome == 'success' && steps.ingestion.outputs.task == 'official' }}
        continue-on-error: true
        run: npm run db:cleanup-provisional
      - name: Remove validation-only signal rows
        id: cleanup_nonproduction
        if: ${{ steps.execution_preflight.outputs.allowed == 'true' && steps.production_ingestion.outcome == 'success' && steps.ingestion.outputs.mode == 'write' }}
        continue-on-error: true
        run: npm run db:cleanup-nonproduction
      - name: Remove irrelevant unlinked market rows
        id: cleanup_market
        if: ${{ steps.execution_preflight.outputs.allowed == 'true' && steps.production_ingestion.outcome == 'success' && steps.ingestion.outputs.task == 'market' && steps.ingestion.outputs.mode == 'write' }}
        continue-on-error: true
        run: npm run db:cleanup-irrelevant-market
      - name: Capture after snapshot
        id: after_snapshot
        if: ${{ always() && steps.ingestion.outputs.mode == 'write' && steps.execution_preflight.outputs.allowed == 'true' && steps.before_snapshot.outcome == 'success' }}
        run: >-
          node scripts/ingestion-execution-guard.mjs snapshot
          --output=${{ runner.temp }}/gacha-ingestion-after.json
      - name: Finalize ingestion run report
        id: finalize_report
        if: ${{ always() && steps.ingestion.outputs.mode == 'write' && steps.execution_preflight.outputs.report_generated == 'true' }}
        run: >-
          node scripts/ingestion-execution-guard.mjs finalize
          --output-dir=${{ runner.temp }}/gacha-ingestion-run-report
          --before=${{ runner.temp }}/gacha-ingestion-before.json
          --after=${{ runner.temp }}/gacha-ingestion-after.json
          --ingestion-started=${{ steps.production_ingestion.outcome != 'skipped' }}
          --ingestion-outcome=${{ steps.production_ingestion.outcome }}
          --cleanup-outcome=${{ steps.cleanup_provisional.outcome }}:${{ steps.cleanup_nonproduction.outcome }}:${{ steps.cleanup_market.outcome }}
          --failed-step=production_ingestion
      - name: Scan ingestion run report
        if: ${{ always() && steps.ingestion.outputs.mode == 'write' && steps.execution_preflight.outputs.report_generated == 'true' }}
        run: node scripts/ingestion-execution-guard.mjs scan --directory=${{ runner.temp }}/gacha-ingestion-run-report
      - name: Upload sanitized ingestion run report
        if: ${{ always() && steps.ingestion.outputs.mode == 'write' && steps.execution_preflight.outputs.report_generated == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-run-report-${{ github.run_id }}
          path: ${{ runner.temp }}/gacha-ingestion-run-report
          if-no-files-found: error
          retention-days: 14
      - name: Enforce Production ingestion result
        if: ${{ always() && steps.ingestion.outputs.mode == 'write' && (steps.execution_preflight.outputs.allowed != 'true' || steps.finalize_report.outputs.final_ok != 'true') }}
        run: |
          echo "::error::Production ingestion was blocked or failed its final verification."
          exit 1
      - name: Write summary
        if: always()
        run: |
          echo "## Gacha ingestion" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Task: ${{ steps.ingestion.outputs.task }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: ${{ steps.ingestion.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Market source scope: ${{ steps.ingestion.outputs.source_scope }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.market_backfill.outputs.audit_report_generated }}" ]; then
            echo "- Candidate audit artifact: market-candidate-audit-${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Candidate count: ${{ steps.market_backfill.outputs.audit_candidate_count }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Accepted count: ${{ steps.market_backfill.outputs.audit_accepted_count }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Review count: ${{ steps.market_backfill.outputs.audit_review_count }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Report complete: ${{ steps.market_backfill.outputs.audit_report_complete }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Database writes: ${{ steps.market_backfill.outputs.database_writes }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "${{ steps.market_backfill.outputs.canary_result_generated }}" ]; then
            echo "- Approved audit run: ${{ steps.market_backfill.outputs.canary_audit_run_id }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Selected candidate count: ${{ steps.market_backfill.outputs.canary_candidate_count }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Listing writes: ${{ steps.market_backfill.outputs.canary_listing_writes }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Observation writes: ${{ steps.market_backfill.outputs.canary_observation_writes }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Rollback: ${{ steps.market_backfill.outputs.canary_rollback }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Verification: ${{ steps.market_backfill.outputs.canary_verification }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Review queue: /review" >> "$GITHUB_STEP_SUMMARY"
          echo "- Next check: import_issues high/medium items" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload ingestion log
        if: ${{ always() && steps.ingestion.outputs.mode != 'write' }}
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-log
          path: ingestion.log
