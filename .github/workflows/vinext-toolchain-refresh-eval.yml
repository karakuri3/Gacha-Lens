name: Vinext toolchain patched refresh evaluation

on:
  pull_request:
    branches:
      - validate/vinext-toolchain-refresh-base-292
    paths:
      - ".github/vinext-toolchain-refresh-trigger"
      - ".github/workflows/vinext-toolchain-refresh-eval.yml"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Create patched isolated toolchain manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gacha-vinext-toolchain
          cat > /tmp/gacha-vinext-toolchain/package.json <<'JSON'
          {
            "name": "gacha-lens-vinext-ci-toolchain-refresh",
            "private": true,
            "version": "1.0.0",
            "type": "module",
            "dependencies": {
              "@cloudflare/vite-plugin": "1.54.8",
              "@vinext/cloudflare": "1.0.0-beta.6",
              "@vitejs/plugin-react": "6.1.1",
              "@vitejs/plugin-rsc": "0.5.34",
              "react-server-dom-webpack": "19.2.8",
              "vinext": "1.0.0-beta.8",
              "vite": "8.2.2",
              "wrangler": "4.131.1"
            }
          }
          JSON

      - name: Resolve lock normally
        run: npm install --package-lock-only --ignore-scripts --prefix /tmp/gacha-vinext-toolchain

      - name: Install exact resolved graph
        run: npm ci --ignore-scripts --prefix /tmp/gacha-vinext-toolchain

      - name: Verify direct versions
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = '/tmp/gacha-vinext-toolchain/node_modules';
          const expected = JSON.parse(fs.readFileSync('/tmp/gacha-vinext-toolchain/package.json','utf8')).dependencies;
          for (const [name, version] of Object.entries(expected)) {
            const actual = JSON.parse(fs.readFileSync(`${root}/${name}/package.json`, 'utf8')).version;
            if (actual !== version) throw new Error(`${name}: expected ${version}, got ${actual}`);
            console.log(`${name}@${actual}`);
          }
          NODE

      - name: Capture audit and dependency paths
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json --prefix /tmp/gacha-vinext-toolchain > /tmp/audit.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const audit = JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'));
          console.log('AUDIT=' + JSON.stringify(audit.metadata?.vulnerabilities ?? {}));
          for (const [name, finding] of Object.entries(audit.vulnerabilities ?? {})) {
            console.log(`FINDING ${name} severity=${finding.severity} direct=${finding.isDirect} range=${finding.range}`);
          }
          NODE
          echo '--- npm explain sharp ---'
          npm explain sharp --prefix /tmp/gacha-vinext-toolchain || true
          echo '--- npm explain miniflare ---'
          npm explain miniflare --prefix /tmp/gacha-vinext-toolchain || true
          echo '--- resolved sharp versions ---'
          npm ls sharp --all --prefix /tmp/gacha-vinext-toolchain || true
          echo '--- resolved miniflare versions ---'
          npm ls miniflare --all --prefix /tmp/gacha-vinext-toolchain || true

      - name: Upload evaluation
        uses: actions/upload-artifact@v4
        with:
          name: vinext-toolchain-refresh-evidence
          path: |
            /tmp/gacha-vinext-toolchain/package.json
            /tmp/gacha-vinext-toolchain/package-lock.json
            /tmp/audit.json
          if-no-files-found: error
          retention-days: 3
