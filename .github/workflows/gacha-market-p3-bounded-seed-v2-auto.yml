name: Gacha Market P3 Bounded Seed V2 Automatic

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPROVE_P3_BOUNDED_SEED_V2_AUTO_CANARY_V1
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  p3-bounded-seed-v2-auto:
    concurrency:
      group: gacha-market-bounded-v2
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify exact current main revision
        id: main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch --no-tags origin main --depth=1
          origin_main_sha="$(git rev-parse origin/main)"
          test "$GITHUB_SHA" = "$origin_main_sha"
          echo "origin_main_sha=$origin_main_sha" >> "$GITHUB_OUTPUT"
      - name: Resolve automatic execution gate
        id: gate
        shell: bash
        env:
          P3_BOUNDED_SEED_V2_AUTO_ENABLED: ${{ vars.P3_BOUNDED_SEED_V2_AUTO_ENABLED || '' }}
          P3_BOUNDED_SEED_V2_AUTO_APPROVAL: ${{ vars.P3_BOUNDED_SEED_V2_AUTO_APPROVAL || '' }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            if [ "$P3_BOUNDED_SEED_V2_AUTO_ENABLED" != "true" ] || [ "$P3_BOUNDED_SEED_V2_AUTO_APPROVAL" != "APPROVE_P3_BOUNDED_SEED_V2_AUTO_V1" ]; then
              echo "execute=false" >> "$GITHUB_OUTPUT"
              echo "## P3 V2 automatic seed disabled" >> "$GITHUB_STEP_SUMMARY"
              echo "- Status: disabled" >> "$GITHUB_STEP_SUMMARY"
              echo "- Provider fetch: skipped" >> "$GITHUB_STEP_SUMMARY"
              echo "- Database writes: 0" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "execute=true" >> "$GITHUB_OUTPUT"
            echo "execution_mode=scheduled-auto" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          echo "execute=true" >> "$GITHUB_OUTPUT"
          echo "execution_mode=manual-auto-canary" >> "$GITHUB_OUTPUT"
      - name: Run fixed Priority 3 bounded seed v2 automatic path
        id: execute
        if: ${{ steps.gate.outputs.execute == 'true' }}
        env:
          GACHA_DATA_SOURCE: supabase
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          YAHOO_SHOPPING_APP_ID: ${{ secrets.YAHOO_SHOPPING_APP_ID }}
          YAHOO_SHOPPING_FETCH_ENABLED: ${{ secrets.YAHOO_SHOPPING_FETCH_ENABLED }}
          P3_BOUNDED_SEED_V2_AUTO_ENABLED: ${{ vars.P3_BOUNDED_SEED_V2_AUTO_ENABLED || '' }}
          P3_BOUNDED_SEED_V2_AUTO_APPROVAL: ${{ vars.P3_BOUNDED_SEED_V2_AUTO_APPROVAL || '' }}
          P3_BOUNDED_SEED_V2_AUTO_CANARY_CONFIRMATION: ${{ inputs.confirmation || '' }}
          P3_BOUNDED_SEED_V2_AUTO_ORIGIN_MAIN_SHA: ${{ steps.main.outputs.origin_main_sha }}
        run: >-
          node scripts/market-p3-bounded-seed-v2-auto.mjs
          --output-dir=${{ runner.temp }}/gacha-market-p3-bounded-seed-v2-auto
      - name: Scan sanitized P3 bounded seed v2 automatic artifact
        id: scan
        if: ${{ always() && steps.gate.outputs.execute == 'true' }}
        run: node scripts/manual-market-audit-guard.mjs scan --directory=${{ runner.temp }}/gacha-market-p3-bounded-seed-v2-auto
      - name: Upload sanitized P3 bounded seed v2 automatic artifact
        if: ${{ always() && steps.gate.outputs.execute == 'true' && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: market-p3-bounded-seed-v2-auto-result-${{ github.run_id }}
          path: ${{ runner.temp }}/gacha-market-p3-bounded-seed-v2-auto
          if-no-files-found: error
          retention-days: 14
