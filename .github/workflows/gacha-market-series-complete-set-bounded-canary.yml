name: Gacha Market Series Complete-Set Bounded Canary

on:
  workflow_dispatch:
    inputs:
      readiness_run_id:
        description: Exact approved complete-set readiness run ID
        required: true
        type: string
      readiness_digest:
        description: Exact readiness canonical digest
        required: true
        type: string
      expected_main_sha:
        description: Exact approved main SHA
        required: true
        type: string
      approval:
        description: APPROVE_SERIES_COMPLETE_SET_CANARY:MAIN_SHA:READINESS_DIGEST:CANDIDATE_DIGEST
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  series-complete-set-bounded-canary:
    concurrency:
      group: gacha-market-series-complete-set-manual-canary
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify exact approved main
        id: main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "${{ inputs.expected_main_sha }}"
          git fetch --no-tags origin main --depth=1
          origin_main_sha="$(git rev-parse origin/main)"
          test "$GITHUB_SHA" = "$origin_main_sha"
          echo "origin_main_sha=$origin_main_sha" >> "$GITHUB_OUTPUT"
      - name: Download exact complete-set readiness artifact
        uses: actions/download-artifact@v4
        with:
          name: market-series-complete-set-readiness-${{ inputs.readiness_run_id }}
          path: ${{ runner.temp }}/gacha-market-series-complete-set-bounded-canary/readiness
          repository: ${{ github.repository }}
          run-id: ${{ inputs.readiness_run_id }}
          github-token: ${{ github.token }}
      - name: Persist exactly one approved complete-set series candidate
        env:
          GACHA_DATA_SOURCE: supabase
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SERIES_COMPLETE_SET_CANARY_READINESS_DIGEST: ${{ inputs.readiness_digest }}
          SERIES_COMPLETE_SET_CANARY_APPROVAL: ${{ inputs.approval }}
        run: >-
          npm run market:series-complete-set-canary --
          --readiness=${{ runner.temp }}/gacha-market-series-complete-set-bounded-canary/readiness/market-series-complete-set-readiness.json
          --expected-main-sha=${{ inputs.expected_main_sha }}
          --origin-main-sha=${{ steps.main.outputs.origin_main_sha }}
          --output-dir=${{ runner.temp }}/gacha-market-series-complete-set-bounded-canary/result
      - name: Scan sanitized complete-set canary artifact
        id: scan
        if: ${{ always() }}
        run: node scripts/manual-market-audit-guard.mjs scan --directory=${{ runner.temp }}/gacha-market-series-complete-set-bounded-canary/result
      - name: Upload sanitized complete-set canary artifact
        if: ${{ always() && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: market-series-complete-set-bounded-canary-${{ github.run_id }}
          path: ${{ runner.temp }}/gacha-market-series-complete-set-bounded-canary/result
          if-no-files-found: error
          retention-days: 14
