name: Gacha Other Data One-Time Bulk Recovery

on:
  push:
    branches:
      - main
    paths:
      - .github/ops/gacha-other-data-bulk-recovery-20260917.token

permissions:
  contents: read
  actions: read

jobs:
  other-data-bulk-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GACHA_DATA_SOURCE: supabase
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OFFICIAL_SOURCE_URLS: https://gashapon.jp/schedule/,https://gashapon.jp/products/,https://www.takaratomy-arts.co.jp/items/gacha/search.html?order=release&p=1&sort=0
      OFFICIAL_DETAIL_FETCH_LIMIT: 500
      OFFICIAL_DETAIL_FETCH_DELAY_MS: 200
      OFFICIAL_SOURCE_FETCH_DELAY_MS: 200
      OFFICIAL_TARTS_PAGES_PER_RUN: 8
      STOCK_RAW_FEED_URLS: ${{ secrets.STOCK_RAW_FEED_URLS }}
      STOCK_RAW_FEED_SOURCES_JSON: ${{ secrets.STOCK_RAW_FEED_SOURCES_JSON }}
      STOCK_X_SEARCH_ENABLED: ${{ secrets.STOCK_X_SEARCH_ENABLED }}
      STOCK_X_SEARCH_QUERIES: ${{ secrets.STOCK_X_SEARCH_QUERIES }}
      STOCK_X_MONITOR_ACCOUNTS: ${{ secrets.STOCK_X_MONITOR_ACCOUNTS }}
      STOCK_X_SEARCH_MAX_RESULTS: ${{ secrets.STOCK_X_SEARCH_MAX_RESULTS }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      X_FETCH_ENABLED: ${{ secrets.X_FETCH_ENABLED }}
      X_USE_DEFAULT_QUERIES: ${{ secrets.X_USE_DEFAULT_QUERIES }}
      X_SEARCH_QUERIES: ${{ secrets.X_SEARCH_QUERIES }}
      X_MONITOR_ACCOUNTS: ${{ secrets.X_MONITOR_ACCOUNTS }}
      X_RAW_FEED_URLS: ${{ secrets.X_RAW_FEED_URLS }}
      X_RAW_FEED_SOURCES_JSON: ${{ secrets.X_RAW_FEED_SOURCES_JSON }}
      X_SEARCH_MAX_RESULTS: ${{ secrets.X_SEARCH_MAX_RESULTS }}
      GACHA_OTHER_DATA_BULK_RECOVERY_CONFIRMATION: APPROVE_GACHA_OTHER_DATA_BULK_RECOVERY_20260917
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify one-time recovery marker and exact current main
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test -f .github/ops/gacha-other-data-bulk-recovery-20260917.token
          marker="$(tr -d '\r\n' < .github/ops/gacha-other-data-bulk-recovery-20260917.token)"
          test "$marker" = "$GACHA_OTHER_DATA_BULK_RECOVERY_CONFIRMATION"
          git fetch --no-tags origin main --depth=1
          origin_main_sha="$(git rev-parse origin/main)"
          test "$GITHUB_SHA" = "$origin_main_sha"
          echo "origin_main_sha=$origin_main_sha" >> "$GITHUB_OUTPUT"
      - name: Snapshot Production counts before recovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/gacha-other-data-bulk-recovery"
          node --input-type=module <<'NODE' > "${RUNNER_TEMP}/gacha-other-data-bulk-recovery/before.json"
          import { fetchRowCount } from './scripts/supabase-rest.mjs';
          const counts = {
            series: await fetchRowCount('series'),
            variants: await fetchRowCount('variants'),
            provisional_variants: await fetchRowCount('variants', { variant_type: 'eq.provisional' }),
            stock_reports: await fetchRowCount('stock_reports'),
            restock_events: await fetchRowCount('restock_events'),
            x_reactions: await fetchRowCount('x_reactions'),
            import_issues: await fetchRowCount('import_issues'),
          };
          console.log(JSON.stringify(counts, null, 2));
          NODE
      - name: Bulk refresh official detail lineups
        shell: bash
        run: |
          set -euo pipefail
          for round in $(seq 1 16); do
            echo "official bulk round ${round}/16"
            npm run ingest:official
            remaining="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { getGeneratedDataPath } from './scripts/generated-paths.mjs';
          const file = getGeneratedDataPath('official-raw.json');
          const parsed = JSON.parse(fs.readFileSync(file, 'utf8'));
          process.stdout.write(String(Number(parsed.remainingDetails ?? 0)));
          NODE
            )"
            echo "official remaining detail pages: ${remaining}"
            if [ "${remaining}" -le 0 ]; then
              break
            fi
          done
      - name: Import configured stock and restock feeds
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${STOCK_RAW_FEED_URLS:-}" ] || [ -n "${STOCK_RAW_FEED_SOURCES_JSON:-}" ] || [ "${STOCK_X_SEARCH_ENABLED:-false}" = "true" ]; then
            npm run ingest:stock
          else
            echo "No approved stock/restock feed or enabled stock X search is configured; skipping without inventing data."
          fi
      - name: Import configured social/X evidence
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${X_RAW_FEED_URLS:-}" ] || [ -n "${X_RAW_FEED_SOURCES_JSON:-}" ] || [ "${X_FETCH_ENABLED:-false}" = "true" ]; then
            npm run ingest:x
          else
            echo "No reviewed X feed or pre-enabled X API lane is configured; skipping without activating paid access."
          fi
      - name: Snapshot Production counts after recovery
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' > "${RUNNER_TEMP}/gacha-other-data-bulk-recovery/after.json"
          import { fetchRowCount } from './scripts/supabase-rest.mjs';
          const counts = {
            series: await fetchRowCount('series'),
            variants: await fetchRowCount('variants'),
            provisional_variants: await fetchRowCount('variants', { variant_type: 'eq.provisional' }),
            stock_reports: await fetchRowCount('stock_reports'),
            restock_events: await fetchRowCount('restock_events'),
            x_reactions: await fetchRowCount('x_reactions'),
            import_issues: await fetchRowCount('import_issues'),
          };
          console.log(JSON.stringify(counts, null, 2));
          NODE
          node --input-type=module <<'NODE' > "${RUNNER_TEMP}/gacha-other-data-bulk-recovery/summary.json"
          import fs from 'node:fs';
          const root = process.env.RUNNER_TEMP + '/gacha-other-data-bulk-recovery';
          const before = JSON.parse(fs.readFileSync(root + '/before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync(root + '/after.json', 'utf8'));
          const deltas = Object.fromEntries(Object.keys(after).map((key) => [key, Number(after[key]) - Number(before[key])]));
          console.log(JSON.stringify({ before, after, deltas }, null, 2));
          NODE
          cat "${RUNNER_TEMP}/gacha-other-data-bulk-recovery/summary.json"
      - name: Upload sanitized recovery summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gacha-other-data-bulk-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/gacha-other-data-bulk-recovery
          if-no-files-found: error
          retention-days: 14
