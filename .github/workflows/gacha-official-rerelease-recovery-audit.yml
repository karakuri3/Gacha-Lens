name: Gacha Official Rerelease Residual Read-Only Audit

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: gacha-official-rerelease-residual-read-only-audit
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  official-rerelease-residual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      INGESTION_WRITE_DISABLED: "true"
      MARKET_BACKFILL_WRITE_DISABLED: "true"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify exact current main before residual scan
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin main --depth=1
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
      - name: Run post-A3 rerelease residual read-only audit
        id: audit
        continue-on-error: true
        run: >-
          node scripts/official-rerelease-recovery-audit.mjs audit
          --output-dir=${{ runner.temp }}/gacha-official-rerelease-recovery-audit
          --expected-main-sha=${{ github.sha }}
          --run-id=${{ github.run_id }}
      - name: Verify exact main remained unchanged through residual scan
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main --depth=1
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Scan sanitized rerelease residual artifact
        id: scan
        if: ${{ always() }}
        run: >-
          node scripts/official-rerelease-recovery-audit.mjs scan
          --output-dir=${{ runner.temp }}/gacha-official-rerelease-recovery-audit
      - name: Upload sanitized rerelease residual audit
        if: ${{ always() && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: official-rerelease-recovery-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/gacha-official-rerelease-recovery-audit
          if-no-files-found: error
          retention-days: 14
      - name: Enforce rerelease residual audit readiness
        if: ${{ always() && steps.scan.outcome == 'success' }}
        run: >-
          node scripts/official-rerelease-recovery-audit.mjs verify
          --output-dir=${{ runner.temp }}/gacha-official-rerelease-recovery-audit
