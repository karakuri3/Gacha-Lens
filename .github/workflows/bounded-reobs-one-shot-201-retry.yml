name: Bounded Re-observation One-shot #201 Retry

on:
  push:
    branches:
      - ops/bounded-reobs-one-shot-201-retry-20260903

permissions:
  contents: read

jobs:
  bounded-reobservation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APPROVED_MAIN_SHA: 9859ab4d1d92043cc914dd00ea5814eff614e6f3
      REOBS_BOUNDED_EXPECTED_MAIN_SHA: 9859ab4d1d92043cc914dd00ea5814eff614e6f3
      REOBS_BOUNDED_OBSERVATION_KEY: reobs-v1:bounded-20260903-01
      REOBS_BOUNDED_LISTING_IDS: yahoo-lead-netstore-302507s186ook6,yahoo-lead-netstore-qq172606s186ppk4,yahoo-lead-netstore-qq292605s248enk8,yahoo-lead-netstore-qq152607s248pmk2,yahoo-lead-netstore-qq162601s196bdm3,yahoo-lead-netstore-qq292607s309bqk4,yahoo-toysanta-g-5l370018il-003-57693,yahoo-toysanta-g-5l3e0018i5-005-57677
      REOBS_BOUNDED_APPROVAL: APPROVE_MARKET_REOBSERVATION_BOUNDED_V1:9859ab4d1d92043cc914dd00ea5814eff614e6f3:1142a10b4c8818562b27f9222a388be073934ca83a33932c2dfca65a5d4782bf
      MARKET_API_MAX_ATTEMPTS: "3"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      YAHOO_SHOPPING_APP_ID: ${{ secrets.YAHOO_SHOPPING_APP_ID }}

    steps:
      - name: Checkout disposable branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact approved main and one-file branch diff
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/ops/bounded-reobs-one-shot-201-retry-20260903"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main --no-tags --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$APPROVED_MAIN_SHA"
          git cat-file -e "$APPROVED_MAIN_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$APPROVED_MAIN_SHA" "$GITHUB_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/bounded-reobs-one-shot-201-retry.yml"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Execute approved bounded re-observation exactly once
        shell: bash
        run: |
          set -euo pipefail
          node scripts/market-reobservation-bounded-canary.mjs \
            --mode canary-write \
            --approval "$REOBS_BOUNDED_APPROVAL" \
            --head-sha "$APPROVED_MAIN_SHA" \
            --expected-main-sha "$APPROVED_MAIN_SHA" \
            --observation-key "$REOBS_BOUNDED_OBSERVATION_KEY" \
            --listing-ids "$REOBS_BOUNDED_LISTING_IDS" \
            --resolution-manifest-out "$RUNNER_TEMP/reobs-bounded-resolution-manifest.json" \
            | tee "$RUNNER_TEMP/reobs-bounded-result.json"

      - name: Upload sanitized execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-reobs-201-retry-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/reobs-bounded-result.json
            ${{ runner.temp }}/reobs-bounded-resolution-manifest.json
